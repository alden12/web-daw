      - ref: DAW-12
        area: DAW
        title: Key and tonic-relative intervals
        status: planning
        sort_path: "000012"
        priority: 0
        deps:
          - DAW-5
          - INST-1
        body: >-
          Make **key** (a `{ tonic: 0-11, scale/mode }`) a first-class musical
          unit that the roll display and the computer-keyboard input are both
          projections of. The flagship synth **Nimbus** (INST-1, shipped slice
          56) is its natural test-bed.


          Sits alongside tempo, groove and time signature (DAW-10) as a
          project-level musical value: same pattern - one value on
          `ProjectData`, projected into the UI, the schema and MCP rather than
          branched on.


          The two halves reinforce each other: a tonic-relative model is
          precisely what lets the QWERTY keyboard span **4 octaves**, because
          diatonic degrees pack ~7 per octave (one keyboard row) where chromatic
          needs 12 (which doesn't fit a 10-key row).


          - **Data model unchanged.** `NoteEvent.pitch` stays **absolute MIDI**
          (transposition-safe, interop-friendly, and the scheduler/engine never
          learn about keys). Key is an **input/display layer**: display maps
          absolute -> degree; the keyboard maps degree -> absolute. A pure
          projection, no persistence change - the same "everything is a
          projection of the schema" discipline the rest of the app follows. Key
          lives at **project level** first; per-clip / per-section overrides are
          a clean follow-on.

          - **Keyboard = diatonic by default.** Replace the hardcoded
          single-octave `KEY_MAP` (`AppShell.tsx`) with a map **generated from
          the current key**: the four letter/number rows become four octaves of
          the scale, so playing is always "in key". A modifier (e.g. Shift)
          raises a semitone for accidentals; the layout mode (diatonic vs a
          chromatic / isomorphic option) can be a setting.

          - **Display = scale highlighting first, note colour last.** Hue is
          reserved for the two-voice authorship coding, so degree must **not**
          ride on hue. First cut: **scale highlighting on the piano-roll lane
          backgrounds** (in-key rows lit, the tonic row accented) plus optional
          **degree labels** on notes (`1 b3 5`...). Note *fill* stays authorship
          colour. A later opt-in can encode degree on a non-hue channel
          (brightness / saturation within the authorship hue) so both codings
          coexist.

          - **MCP payoff:** exposing key in project state lets the agent compose
          diatonically ("add a ii-V-I in the project key"). Pairs with the
          autotune scale-snap layer under audio pitch & time (INST-7).
        id: 019fae04-4269-7649-9153-7bd2abce8210
        created_at: 2026-07-29T13:15:42.569Z
        updated_at: 2026-07-29T18:26:37.375Z
      - ref: DAW-13
        area: DAW
        title: Audio export and mixdown
        status: to-do
        sort_path: "000013"
        priority: 0
        deps:
          - AGENT-4.1
        body: >-
          There is currently **no way to get a finished track out of the DAW as
          audio.** The `.daw.zip` export is the *project* bundle, not a rendered
          mix, and `OfflineAudioContext` appears only under the agent-ears work.


          Render the arrangement offline to a buffer and encode it out (WAV
          first, then MP3 / stem options), surfaced as a transport / File
          action. Every segment needs this and it plausibly gates any public
          launch.


          Engine work is a **shared offline-render core** with the agent's
          objective DSP analysis ticket: build the offline render once
          (client-side, the exact DSP graph the user hears) and both
          mixdown-export and the agent's ears draw on it - so the two are best
          built together, with export the more fundamental of the pair.


          This is also where provenance stripping happens (see the
          "local-by-default provenance" agent ticket): export / bounce strips
          authorship and agent-intent metadata unless the user explicitly opts
          in.


          Not research-driven; found while mapping the roadmap.
        id: 019fae04-5b6e-76cd-9ecb-604ffae6b1b8
        created_at: 2026-07-29T13:15:48.974Z
        updated_at: 2026-07-29T16:00:33.727Z
      - ref: DAW-14
        area: DAW
        title: Shipped UI tidy-ups (slices 25-42)
        status: done
        sort_path: "000014"
        priority: 0
        body: >-
          *Part of DAW-8. Formerly `DAW-8.1`.* The already-shipped items from
          the UI-tidy-ups and timeline-usability batches, kept as the historical
          record.


          - **Kebab (⋮) context menus (slice 26).** A reusable icon-only `Menu`
          (`ui/Menu.tsx`) replaced the track/group/patch × and the "+ Group"
          button: rows get Delete, the add menu offers Add empty track / Add
          group. The popover renders in a **portal** (fixed-positioned) so it is
          never clipped by a row's overflow or painted over by a sibling row's
          controls, and only one menu is open at a time. **[foundational]**

          - **Context-menu popover could open offscreen - FIXED (slice 42).**
          `Menu` positioned its portal popover at `top: trigger.bottom + 4` with
          no viewport clamp, so a trigger near the bottom edge opened a menu
          that ran off the bottom (same for the right edge). Fix: a
          `useLayoutEffect` in `ui/Menu.tsx` measures the popover and clamps it
          inside the viewport, flipping above the trigger when it would overflow
          the bottom (before paint, no flash).

          - **Held note stuck on when you switch tracks mid-press - FIXED (slice
          42).** The computer-keyboard play handler in `ui/AppShell.tsx` read
          `projectStore.selectedId` on **keyup** to pick which instrument to
          release, so press-on-A, select-B, release called `noteOff` on track B
          and A's voice rang forever. Fix: a `heldKeys` ref (`Map<midi,
          instrumentId>`) remembers which instrument each held key started on
          and routes the matching note-off there. (Web MIDI / the on-screen
          keyboard will want the same per-source held-note bookkeeping.)

          - **Center panel reflow when the activity panel expands - RESOLVED
          (verified slice 42).** The flow-layout rework (slice 31:
          `grid-template-columns: ... minmax(0, 1fr) ...` for the center column
          plus `min-w-0` on the workbench) already sized the center from the
          remaining space - confirmed by measurement (center 760 -> 1027 when
          the panel collapses, back to 760 when it expands). Locked with a
          regression test in `e2e/layout.e2e.ts`.

          - **Audio clip double-trigger when its loop region isn't bar-aligned -
          FIXED (slice 37).** The audio path in `sequencer/scheduler.ts` tiles
          the clip's region across the placement *and* `onsetsInBeatRange` wraps
          each onset over the arrangement loop, so when the region length didn't
          divide the loop length, onsets near the loop boundary overlapped. Fix:
          the scheduler passes a `maxDurationSec` (time to the next loop
          boundary) to `scheduleAudioClip`, and the pure `audioPlayWindow`
          truncates the played span there. A fade at the cut to avoid a click on
          hard-cut audio is a possible future refinement.

          - **No playhead/ticker on an audio clip in launch (clip) mode - FIXED
          (slice 37).** A launched clip plays via a synthetic placement (`{ id:
          '__launch', ... }`) not in `track.placements`, which the clip-panel
          playhead scanned. Fix: when `track.launchedClipId === clip.id` the
          playhead uses the transport loop region as the active window.

          - **e2e start-race flake - FIXED (slice 37).** `engine.start()`
          awaiting the worklet modules (slice 36) made it resolve a beat later,
          so tests clicking the grid right after "start audio" raced the
          start-overlay removal. Fixed by making each e2e's `dismissStart` wait
          for the start button to clear (`toHaveCount(0)`) before interacting.

          - **Timeline resize handle vs loop markers (slice 26).** The
          bottom-timeline resize handle straddled the panel's top edge and stole
          drags from the ruler's loop-region markers; it now sits fully above
          the edge.

          - **Clip-rail width drag-resize.** The clip pool beside the piano roll
          is drag-resizable (persisted width via the shared `ResizeHandle`),
          like the device rack and side panels.
        id: 019fae04-9b89-759a-afd5-4e2371fc2b95
