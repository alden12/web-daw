      - ref: DAW-10
        area: DAW
        title: Changeable time signature
        status: review
        sort_path: "000010"
        priority: 0
        deps:
          - DAW-4
          - DAW-5
        body: >-
          Transport & grid: the meter is a transport-level project value (`{
          numerator, denominator }` on `ProjectData`, default 4/4) with a
          `setTimeSignature` edit, surfaced beside the tempo control. A "beat"
          stays a fixed quarter-note, so bar length in beats is `numerator * 4 /
          denominator` (the shared `beatsPerBar` helper in `project/schema.ts`);
          the scheduler metronome accent, every bar/beat `Ruler`, the
          arrangement + waveform grids, the recorder's bar snap, and MCP all
          project that one value - no per-site hardcoding.


          Delivered in two slices so the fractional-bar rendering landed on its
          own:


          **Numerator: simple meters (x/4)** - the keystone field +
          `setTimeSignature` edit (rides undo/history/multiplayer) +
          `set_time_signature` MCP tool + a numerator control by the tempo
          readout, with every consumer switched off the hardcoded `BEATS_PER_BAR
          = 4` to the project's `beatsPerBar` getter. The denominator was stored
          (default 4) and rode the whole data model already, but stayed fixed at
          4 in the UI/MCP; bars remained integer beats.


          **Denominator: compound meters (x/8)** - unlocked the denominator (a
          `<select>` beside the numerator; `set_time_signature` now takes it
          too). The subdivision is the meter's "shown beat" (`beatUnitBeats =
          4/denominator`: a quarter in x/4, an eighth in x/8), so the ruler
          ticks and the metronome step by it and 7/8 shows 7 eighth-beats with
          the bar line landing on a tick. `beatTicks` iterates by tick *index*
          (not accumulating beats) so the fractional-bar test (7/8 bars every
          3.5 beats) stays exact; `metronomeClicksInBeatRange` gained a
          `beatUnit` step and accents the bar downbeat; the recorder count-in
          matches.


          **Remaining:** compound accent *grouping* (6/8 as two dotted-quarter
          pulses) is a later nicety - downbeat-only for now.


          Status: built and working, in an open PR, not yet on `main`.
        id: 019fae04-05a1-722c-bb56-9d91a3eeaf03
        created_at: 2026-07-29T13:15:27.009Z
        updated_at: 2026-07-29T16:00:31.389Z
