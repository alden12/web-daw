    context:
      protocol: >-
        **Overview.** web-daw is an open-source, browser-based DAW built on one
        idea: **the parameter schema is the keystone**, and the UI, the MCP
        control plane, automation, and persistence are all projections of it.
        The second idea is that the session is a document **co-edited by a human
        and an AI** - every edit flows through one `dispatch(command, author)`
        seam into an append-only authored log, which is what makes history,
        versioning, two-voice colour, multiplayer, and an agent cheap rather
        than bolted-on. Read the **Thesis** context section first;
        **Architecture** is the map of the code.


        The repo is at `/Users/alden/Documents/code/web-daw` (public:
        `alden12/web-daw`, AGPL-3.0). Sole author/owner: Alden Laslett. The app
        is deployed (Fly + Neon, single-origin, auth on).


        **This project's tickets came from `docs/DESIGN.md`**, migrated on
        2026-07-29. That doc and the `yarn roadmap:*` tooling are being retired
        in favour of this project. Still live in the repo and worth reading
        rather than duplicating here:

        - `CLAUDE.md` - coding conventions (zod at boundaries,
        functional/declarative style, full descriptive variable names, object
        maps over `switch`, split large files, keep formatted, forward-only
        migrations, CI must stay green).

        - `docs/RESEARCH.md` - the user-research evidence file. Several tickets
        cite it by section; it is the source for the librarian framing, the
        reported-struggle percentages, and the branching/WAM decisions.

        - `docs/DEPLOY.md` - the deploy + migrations runbook.

        - `docs/BRIEF.md`, `docs/HANDOVER.md`, `docs/AGENT.md`,
        `docs/mockups/mobile-ux.html`.


        **Running a session.** Open with `resume_project`. Most sessions are one
        of three shapes:

        1. *Build a ticket.* Read it with `get_ticket`, check the context
        sections it references, work in the repo. Flip the status as it moves.

        2. *Shape the roadmap.* Add or revise tickets and context as decisions
        firm up.

        3. *Review / triage.* Sweep for stale statuses and stale prose.


        **Status vocabulary** (unchanged from the old doc, so it reads the
        same): `done` = on `main` / shipped · `review` = built and working,
        often deployed, but in an open PR not yet merged · `in-progress` = being
        built on a branch right now · `to-do` = designed and ready to build,
        next up · `planning` = still being shaped / longer horizon.


        **Keeping status current is a manual discipline - nothing moves it
        automatically.** When you open a PR that implements a ticket, set it to
        `review` in the same change; set it `done` when the PR merges. Whenever
        you notice a stale status (a ticket really
        done/merged/in-progress/abandoned but marked otherwise), fix it right
        away in whatever change you are already making - don't wait to be asked.
        The same goes for stale *prose*: the old design doc accumulated items
        still listed as roadmap that had actually shipped (Web MIDI input, the
        arpeggiator), so when a ticket's body contradicts the code, correct the
        ticket.


        **Refs match the old design-doc ids exactly**, including the dotted
        sub-tickets (`DAW-8.1`, `AGENT-4.1`, `HOST-6.2`, `HOST-8.4`, ...), so
        code comments referencing e.g. `DAW-10` or "Phase B2" still resolve. Two
        deliberate departures: `DAW-10.1`/`DAW-10.2` were folded into DAW-10
        (two slices of one delivered feature, no independent status to track),
        and four tickets are **new** - INST-7 (audio pitch and time), INST-8
        (autotune), INST-9 (drum-kit sourcing), INST-10 (in-app IDE) - which
        were roadmap prose in the doc with no marker.


        **Dependencies are structured edges** (`deps` on
        `create_ticket`/`edit_ticket`), not prose - the graph is laid out from
        them and a cycle is refused. Two conventions: a sub-ticket never needs a
        dep on its own parent (nesting already expresses it, and the server
        refuses the redundant edge); and `deps` **replaces** the whole set, so
        pass the full list when revising. *Legacy to tidy as you touch things:*
        some bodies still carry a redundant trailing "Deps: X" line from before
        edges existed. Where it duplicates a real edge it is merely noise -
        delete it when you next rewrite that body, and never let prose and edges
        disagree.


        **Areas.** `DAW` core engine and UI · `INST` instruments, effects and
        DSP · `AGENT` the agent · `HOST` server, hosting, sync and history ·
        `COLLAB` multi-user · `MOBILE` platform and form factor · `ARCH`
        refactors and structural clean-ups.


        **Write as you go. Do not save it for the end - there is no end.** A
        conversation gets abandoned rather than closed, so anything held back
        for a final write is lost. Use `add_note` whenever something is worth
        having next time: what the user asked, a decision made in passing, what
        to pick up next. One line, no reading first, cheap enough mid-task.
        Correct one with `edit_note` or drop it with `delete_note` if it turns
        out to be wrong. Use `set_context` when revising the project's settled
        narrative, and `checkpoint_session` only when a real chunk of work has
        finished or the user says they are stopping.
      Thesis: >-
        An open-source, web-based DAW where three ideas reinforce each other:


        1. **The parameter schema is the keystone.** Every parameter of every
        instrument and effect is declared once, declaratively. The UI, the MCP
        control surface, automation, and save/load are all projections of that
        one model. Add a parameter to the schema and it shows up everywhere for
        free.

        2. **The session is a document co-edited by a human and an AI.** Claude
        is not a side feature; it is a second author working the same model you
        do. The product's job is to make the agent's presence, reach, and
        history legible.

        3. **Everything is structured data flowing through one store as
        discrete, authored events.** This single fact is what makes presence,
        history, versioning, file export, and a pluggable agent all cheap rather
        than bolted-on. We keep returning to it.


        What makes it different from Ableton/Logic/etc.: the AI co-author, the
        version-control model, fearless experimentation, and tinkerability on a
        software level - all of which fall out of points 1-3.


        **The constraint is the moat.** Owning the whole device chain (no
        third-party plugins) means project state is *complete*, which is what
        lets it be JSON, diffed, versioned semantically, and fully read and
        written by an agent. Every incumbent is locked out of this by their own
        plugin ecosystem and cannot follow without abandoning it. The one-line
        position:


        > The open-source browser DAW whose projects are *complete, readable
        files* - because it owns its whole device chain. Your project is data
        you can diff, git, script, and hand to an agent.


        **The durable asset is the architecture, not only the app.** The
        transferable value is the **project format** (a complete, readable,
        diffable musical document) and the **control plane** (the param-schema
        keystone exposed as a typed, agent-addressable surface over MCP) - both
        potentially useful to people and tools that never touch this UI. The app
        is the reference implementation that proves them; the format and control
        plane are the moat. Design them to be adoptable (documented, stable,
        seam-friendly), not just internally convenient.


        **Lead with the librarian, let authorship be discovered.** The
        best-evidenced agent use is AI-as-librarian (build me a template, a
        starting point, a variation), not AI-as-composer. Keep the co-author
        vision, but pitch the librarian first, keep an off-switch (AGENT-8), and
        keep provenance local by default so it is never an evidence trail
        against the user (AGENT-9).


        **The cheap things to bake in early**, because retrofitting is
        expensive: the project as a nested tree of buses, a persisted
        append-only authored event log, and the human-readable file format. All
        three are now in place.
      Market and positioning: >-
        Who we build for, and the strategic reasoning. Grounded in the user
        research (`docs/RESEARCH.md`, gathered 2026-07-17), which stress-tested
        the design's premises against primary evidence - forum threads, issue
        trackers, a dead-analogue post-mortem - and was deliberately biased
        toward disconfirming the design.


        ## At a glance


        The one-screen pitch, in the order it's best told. Deliberately
        telegraphic - a shareable starting frame, not the full argument.


        - **What is it?** A browser DAW where the project is structured data,
        co-edited by a human and an AI. An open format + control plane, with an
        app on top (the format may outlast the app).

        - **What's the USP?** Projects are complete, readable, diffable *files*
        - version them like code. Agent-native: an AI co-author that edits the
        real project through one control plane. Open-source, browser-based, no
        install, no VSTs.

        - **What problem does it solve?** DAW projects are opaque binaries -
        can't diff, review, or hand to a tool. Music software isn't built for
        people who think in files, versions, and automation. No real AI
        collaborator *inside* the DAW - chat lives elsewhere, can't touch the
        project.

        - **Who is it for?** Primary: developers who make music
        (build-from-personal-pain archetype). Secondary: beginners, via an AI
        "librarian" that does the setup. Not: pro producers wedded to VSTs, or
        pure hobbyists on mobile.

        - **How does it work?** One param-schema is the keystone; UI, AI,
        automation, persistence are projections of it. Everything flows through
        a single store as structured edits -> versionable + agent-addressable.
        An MCP control plane lets an LLM read/write the project as a first-class
        user.

        - **How do you monetise?** *(weakest-specified - no validated
        willingness-to-pay yet)* Open-source core (AGPL); sole-provider via
        trademark, not license. Likely: a hosted/sync tier + agent usage
        (bring-key or metered). Longer shot: the format/architecture itself as
        the asset (embed, licence, platform).

        - **What does growth look like?** Land segment (b) developers first
        (where the pain and the distribution channels are). Expand to beginners
        once the librarian carries the setup burden. Open format ->
        ecosystem/community as moat; hosting + agents as the revenue surface.


        ## Who this is for


        Stated honestly, because it shapes every decision. The primary user is a
        **developer who makes music** - the author is the archetype, and the
        tool is built from pain points felt personally when composing with
        existing software. That is a deliberate bias, not an accident, and it is
        fine: the research found this is the **only well-evidenced fit** for the
        design, that the segment is real and underserved, and that several other
        founders are independently building pieces of the same thing. It is
        acceptable if the author remains the primary user; the design should
        stay coherent to that person first.


        In priority order:


        - **(b) Developer-adjacent musicians - the lead.** Local-first,
        git-shaped history, a readable/diffable project folder, MCP and IDE
        editing, agent-scriptable everything. This is who the built product
        already serves and who we design for by default.

        - **(d) Complete beginners - the sharpest secondary opening.** Their top
        reported pain by a wide margin is "where do I start" (AGENT-13), which a
        competent agent genuinely answers - and an agent over a *fully readable*
        project is uniquely able to inspect and explain the whole session, which
        a plugin-opaque DAW cannot. Reached via the **librarian** framing, not
        the co-author framing. Guard against being a toy that never converts
        upward.

        - **(a) hobbyist producers and (c) working/semi-pro producers - not
        targeted, as designed.** Winning them would mean third-party plugin
        support (WAM/VST), which dilutes the core differentiator. We do not
        chase them unless direct evidence shows plugin absence is the actual
        thing blocking adoption.


        The **biggest risk is audience ambiguity** (the top-4 objection on our
        closest analogue's launch thread): versioning wins developers, the agent
        wins beginners, and the two audiences barely overlap. The resolution is
        to **lead with (b)** and treat (d) as the second act, not to court all
        four at once.
      Architecture: >-
        The primitives everything else builds on. (Repo coding conventions live
        in `CLAUDE.md`; this is the shape of the system.)


        - **`src/audio/params/` - the keystone.** `ParamSchema` (a discriminated
        union of number / enum / boolean / sample specs), `ParamStore` (single
        source of truth: get/set/subscribe/snapshot/load, coerce + validate),
        `binding.ts` (`ParamBinding`, `rampParam`, `bindParams` - the seam that
        keeps the store transport-agnostic so native audio nodes can become
        worklets).

        - **`src/audio/instruments/` and `src/audio/effects/`** - each a pure,
        DOM-free `catalog.ts` (labels + schemas, so the Node MCP server
        type-checks without the DOM) plus a DOM `registry.ts` of factories. Both
        are Map-backed registration APIs, so adding a device touches no central
        switch.

        - **`src/audio/midi/device/`** - the third device class: note transforms
        (octavator, arpeggiator) on the note path, same catalog/registry
        pattern, pure `(notes, range, ctx) -> notes`.

        - **`src/audio/project/projectStore.ts`** - the structural top: the
        project as a tree of buses, each track owning a ParamStore + clips + an
        ordered effect chain. snapshot/load round-trips everything.
        `project/schema.ts` is the canonical zod document schema both client and
        server validate against.

        - **`src/audio/engine/AudioEngine.ts`** - realizes the project as audio;
        per track `instrument -> fx... -> trackGain -> master -> limiter ->
        destination`.

        - **`src/audio/commands/`** - `dispatch(command, author)` -> `applyEdit`
        -> the append-only authored edit log. The one mutation seam. `applyEdit`
        is a **pure function of the command** and **forward-only** (no inverse),
        which is why past states are reached by replaying from a stored anchor,
        never by walking HEAD backward.

        - **`src/audio/mcp/` + `server/`** - the control plane. A Node MCP
        server mirrors a ProjectStore and forwards validated, track-addressed
        edits to the browser over a WebSocket; the browser mirrors its own edits
        back.

        - **`src/contract/`** - the plain-data zod API contract (HTTP route
        descriptors + WS message unions + shared param/error schemas) both
        client and server import. One definition, many consumers, no drift.

        - **`src/audio/sync/sharedSession.ts`** - optimistic apply + total-order
        rebase against the server authority.


        ## Rules that keep it coherent


        - **The parameter schema is the keystone.** Don't add per-parameter or
        per-type UI/branching - map over the schema/catalog. UI and MCP must
        **iterate the catalogs**, never hardcode instrument/effect/param names
        or lists.

        - **Keep the Node MCP server DOM-free.** Pure data (schemas/catalogs)
        stays in `catalog.ts`; anything touching Web Audio stays in
        `registry.ts` / the engine.

        - **Validate at every untrusted boundary with zod** (MCP tool inputs,
        model responses, loaded bundles, server writes). Keep "validation"
        (reject bad input, with a message) distinct from
        "coercion/normalization" (clamp/snap a trusted value): the `ParamStore`
        coerces; the MCP boundary validates.

        - **Follow MIDI / General MIDI conventions** where a standard exists, so
        the app interoperates with other tools and matches what an LLM already
        knows. C4 = MIDI 60; drum kits default their pad notes to the GM drum
        map (kick = 36, snare = 38, closed hat = 42, open hat = 46, ...).
        Defaults stay data (remappable), but pick the standard as the default.

        - **The axis principle:** horizontal = playback time; **vertical =
        "other ways this could go"** (clip variants, version history, branches
        all stack downward). Protect this everywhere.

        - **Oversized files to chip away at when touched:** `projectStore.ts`
        (ARCH-1), `AudioEngine.ts` (AGENT-19), `ArrangementTimeline.tsx`.
      Layout and UX: >-
        ## Spatial spine (video-editor style, not Ableton)


        - **Full-width timeline along the bottom** - the arrangement overview,
        the time axis.

        - **Center = the workbench for the selected track/clip** - its device
        chain (instrument + effects as a horizontal signal flow) plus tabs for
        MIDI / Automation / Audio. One focused surface instead of every panel at
        once. It reads **top to bottom as the signal path**: notes (piano roll)
        / audio clip on top, the instrument + effect rack below, then the
        arrangement output - notes -> (midi fx ->) instrument -> effects ->
        output.

        - **Activity rail + library panel on the left.** A thin activity rail
        (`ActivityRail.tsx`) spanning full height switches the panel between one
        view at a time - Search / Project / Instruments / Effects / Patches /
        Samples / Activity - and clicking the active icon collapses the panel to
        just the rail. There is **no separate top toolbar**; the chrome
        distributes into the pieces it belongs to. The library panel header
        carries the project name + one main menu (undo/redo,
        switch/new/rename/delete/export/import) and a search box that jumps to a
        grouped Search results view.

        - **AI agent pane on the right** - chat + activity feed + composer. It
        collapses away entirely (no idle rail); its expand control lives at the
        right of the workbench tab bar.


        **Mode toggle (Converse / Balanced / Produce):** resizes the agent pane.
        Produce collapses it to a thin presence rail. *(Note: AGENT-8's "off"
        mode deliberately overrides the "the agent is never fully gone" stance
        here, on research evidence.)*


        **Two-voice color:** teal = the user's edits, coral = Claude's. It runs
        through clips, the activity feed, the focus glow, and the AI cursor. The
        palette literally encodes authorship, which is the product's thesis made
        visible. Under multi-user it became **perspective-relative** - the
        viewer's own edits are always teal, collaborators get stable hashed
        hues, `agent`/`claude` stay absolute (see COLLAB-1).


        **AI presence:** when Claude touches a control it animates in place ("AI
        cursor"); the focused track glows; the activity feed narrates every
        action. No spooky action at a distance.


        **Panel value hierarchy:** a deliberate value staircase so the eye knows
        where to land - center workbench brightest, side panels a step darker,
        timeline its own dark band, cards (devices/clips/variants) lighter
        still, dividers strong enough to read the seams.


        ## Track organization: grouping as the default


        The reason track lists spiral is that the flat list is the primitive and
        grouping is a manual overlay. Invert it: **the project is a tree of
        buses, not a flat list.** Every track is born into a group; a group is
        structurally a track-of-tracks with its own gain and effect chain, so it
        reuses the routing wholesale. Groups are visible labeled sections that
        collapse on demand (collapsing is the deliberate "give me room" action,
        not the default). Groups are MCP-addressable like tracks.


        *Reality check:* the original "Claude is the librarian, filing each new
        track into a family group" was simplified in slice 54 to a **single
        default `main` group** every new track files into. Manual grouping (drag
        into groups, right-click add) is a DAW-8 follow-on.


        **Open question:** music has two organizing axes, by role (the bus tree)
        and by song section (intro/verse/chorus). Current lean: bus tree is the
        structural default; sections live on the timeline as labeled regions.


        ## UI conventions


        - **Glyph icons: size them up.** Small glyph controls (disclosure
        arrows, chevrons, kebab dots) tend to render too cramped. Default new
        ones to ~16-18px with an adequate hit area (~`w-6`/`w-7`), not
        `text-[10px]`; size up existing small ones when you touch them.
        (Established from repeated feedback.)

        - **Touch-first affordances apply now, not just for mobile** (MOBILE-2):
        persistent ⋮ menus over hover-only kebabs; always pair a right-click
        context menu with a tap-reachable equivalent; keep hit targets generous.

        - **Keep edit-time (vertical, history) visually distinct from play-time
        (horizontal).** History is its own mode/overlay, not crammed onto the
        song ruler.
      Automation (design): >-
        Not yet built - the longer-horizon feature that most directly cashes in
        the keystone.


        Automation is just a parameter over time: a list of breakpoints `{beat,
        value, curve}` bound to a param id. Because parameters are the keystone:


        - **It renders itself.** The lane's axis, bounds, and interpolation come
        straight from the schema (cutoff is exponential, level is linear; units
        label the axis). Zero per-parameter code, the same dividend the knobs
        get.

        - **Claude can write it.** "Ramp the cutoff 400 -> 4000 over bars 5-8,
        exponential" is one tool call that writes breakpoints; the curve appears
        in coral. Hand-drawing stays available, it is just no longer the only
        way.

        - **Recording is nearly free.** Every knob move is already a timestamped
        event; capture the stream against the transport position and you have
        recorded automation.


        **Where it lives spatially:** the timeline shows that automation
        *exists* (a faint curve overlay / badge on the clip, with optional
        inline lanes for quick nudges); the center workbench (an Automation tab)
        is where you and Claude actually shape it, scoped to one track with room
        to draw.


        Because params are schema-driven `ParamStore`s throughout - including
        MIDI-device params like arp rate/gate/swing - everything automates
        through this one lane implementation.
      History and versioning: >-
        We already emit the exact event stream this is made of: every edit is a
        discrete, authored protocol message into the store (the activity feed is
        a live window onto it).


        ## The decided model


        - **Hybrid versioning.** Working edits autosave continuously (never lose
        work), the system **auto-checkpoints** on a cadence, and you or Claude
        stamp a **named version**. *Revised later (HOST-6): auto-checkpoints
        became **keyframes**, not commits - invisible in the version list, no
        feed noise - and commits are entirely user-driven, so version nodes stay
        few and meaningful.*

        - **The semantic edit DAG is the source of truth**; the materialized
        `project.json` snapshot is a fast-load cache, always rebuildable by
        replaying commits.

        - **We keep our own content-addressed commit DAG rather than binding to
        real git.** Git's text-merge buys nothing for music, and our edits are
        already semantic, so we get readable diffs for free. Exporting to /
        backing onto git stays an option for a later slice (the "PR your
        arrangement" story), not a dependency.

        - **Diff/merge semantically.** Two people editing the same clip is a
        musical conflict, not a line conflict. A thin layer understands
        tracks/clips/params and renders diffs in musical terms ("Branch B: Lead
        cutoff 4000->1400, +Delay, Bass +4 notes"). Two-voice color extends
        across history.

        - **Undo/redo graduated from session-only to time-travel over commits**
        (survives reload).


        ## Keyframe + delta storage


        Commits are stored like video frames: most hold only their `entries`
        (the semantic delta) and reconstruct on demand by replaying forward from
        the nearest ancestor that carries a full `snapshot` (a *keyframe*). A
        keyframe is written for the root, every Nth commit, a revert (a
        discontinuity), and **any commit containing undo/redo entries** - those
        restore a snapshot rather than applying forward, so they can't be
        replayed; forcing a keyframe there keeps every delta commit pure-forward
        and exactly replayable via the shared `applyEdit`.


        This makes a checkpoint cost the size of one edit-burst (~50-100x
        smaller than a full snapshot), so auto-checkpointing freely is cheap.
        `materialize(commitId)` does the reconstruction (used by
        `revertTo`/`diff`); `project.json` stays the O(1) working-state cache,
        so replay is only ever on the cold path.


        **Keyframes are not a durability mechanism** (the delta append is the
        durable write) - their only job is bounding load-time replay. That
        insight drove the count-primary cadence (HOST-4) and the
        one-keyframe-per-commit pinning (HOST-6).


        ## AI superpowers this unlocks


        Plain-language version summaries (AGENT-12), bisect the edit that made
        it muddy, time-travel debugging for music.


        ## Branching - deliberately deferred


        Branches ("Claude tries an arrangement on a branch, you compare and
        merge") were the original 15C follow-on. **Current lean: keep it
        deferred indefinitely.** The evidence says the demand is **linear revert
        and snapshot safety**, not branch-and-A/B - even sympathetic developers
        struggle to name a branching use case, and a branch you cannot merge is
        just a save-as with better manners (merge is explicitly not the pitch).
        Revert already shipped (HOST-6). Revisit only on direct evidence of a
        real branching use case. See `docs/RESEARCH.md` section 12.D.


        Also unbuilt from the original plan: **15D** a real disk folder via the
        File System Access API (+ optional git export). **15E** remote sync /
        collaboration became the whole HOST area.
      Project format and local-first data: >-
        ## The v1 bundle (built)


        Identical across storage backends (OPFS, remote, `.daw.zip` export):


        ```

        MyProject.daw/
          manifest.json        # formatVersion, project id, HEAD
          project.json         # materialized working snapshot (a fast-load cache of replay)
          edits.json           # the unified seq-ordered authored stream (edits + feed notes)
          history/
            commits/<id>.json  # { parents[], author, message, edits[], snapshotHash, time }
            keyframes/<seq>.json
            refs.json          # branch -> headCommitId, tags
          samples/<sha256>.wav # content-addressed binary (dedup + integrity)
          meta.json            # name-card index for the library listing
        ```


        A `ProjectRepository` interface abstracts the backend (OPFS, remote,
        memory-for-tests), so the same bundle logic serves local and remote, and
        sync becomes git-like push/pull of missing content-addressed objects.
        Every project is its own bundle under `projects/<id>/`; a **switch is
        the import-in-place flow** (flush -> repoint repo -> `projectStore.load`
        + `editLog.restore` + `versionStore.reload`), with the engine, MCP
        mirror, and autosave re-deriving via subscriptions and the AudioContext
        preserved.


        **Export / import of a portable `.daw.zip`** is a plain zip of the
        *readable* bundle (pretty-printed JSON + real `samples/*.wav`), so you
        can unzip and inspect a project. It is the shareable, commit-able
        artifact.


        ## The eventual tinker/IDE shape (not built)


        One file per track/clip so they diff and open in an editor:


        ```

        my-track/
          project.json        # tree of buses, tempo, lengthBeats, arrangement, selection, refs
          tracks/lead.json    # { instrumentType, params (patch), effects: [{type, bypassed, params}] }
          clips/lead-arpB.mid # standard MIDI so any tool can read it
          automation/lead-cutoff.json
          samples/kick.wav
        ```


        Notes: project structure, patches, automation -> stable, sorted JSON
        (diffable). MIDI -> standard `.mid` for interoperability; audio ->
        `.wav`/`.flac` referenced by path. An instrument *preset* is just its
        `PatchValues`; an instrument *definition* (the DSP) is app code today -
        custom-DSP-via-worklet later could let users drop in their own
        instrument code (INST-4/5/6). Keep ids stable and human-meaningful where
        possible so diffs read well.


        This per-track file explosion is a later refinement on top of the v1
        bundle, once the in-app file viewer / IDE-editing story is built.


        ## Local-first: the direction, and where reality landed


        The original recommendation was **local-first, project = a git-friendly
        folder of human-readable files** that is the source of truth, with an
        optional minimal server. The vision: **the web app, an in-app file
        viewer, and your own IDE are three editors over one synced folder.** A
        casual user never sees a file; a tinkerer lives in them; nobody is
        locked out. A file-watcher reloads disk changes into the store; app
        edits write back. ("App + IDE + agent editing one synced document" is
        the genuinely novel story, and it is how the project is already being
        developed.) A **file viewer panel** in the app (power-user, collapsed by
        default) shows the project tree, allows inline edits, and offers "open
        folder in your IDE".


        **What actually happened, and why.** Browser storage (OPFS/localStorage)
        was evicted by Chrome and wiped projects, so we graduated to
        **web-app-primary**: a server + Postgres is the durable source of truth,
        OPFS is the offline fallback, and `.daw.zip` export/import is the
        portability escape hatch. HOST-5 restores the local-first *feel* (always
        keep an OPFS working copy + a durable offline write-queue + runtime
        online/offline switching) without making the browser the system of
        record.


        **The honest constraint that shaped this.** The File System Access API
        (directory handles, read/write) is Chromium-only and permission-gated;
        Safari/Firefox barely support it. The robust "just point your tools at
        the folder" experience really wants a **desktop shell (Tauri)** for full
        filesystem + native audio (MOBILE-4). A real user-visible disk folder
        remains the durable follow-on.


        **A thin server earns its place even local-first:** to hold/proxy the AI
        API key (never ship it in the client) and for sharing/collab/backup -
        the git "local repo + optional remote" model.
      "The agent: pluggable, not either/or": >-
        The MCP tool surface is just a set of tools over the store. What drives
        them is interchangeable:


        - **In-app agent** (AGENT-2) - the Claude API with the same operations
        exposed as tool-use functions. This makes "agent front and center" real
        for a general user who just opens the app, no install. Build this; it is
        the product.

        - **Claude Code / Desktop over MCP** (AGENT-1, today's setup) - keep it.
        Perfect for the developer/tinkerer audience driving the same tools from
        a terminal or scripts. It already gives a capable agent on an existing
        subscription (no per-token API key).


        So: own in-app agent **and** the MCP server, sharing one tool/store
        layer. We do not build a bespoke agent from scratch; we reuse the tools
        and let the model reason, on the latest models.


        **Concretely:** the agent **loop runs client-side** - tool calls execute
        in the browser through the same `dispatch` seam (authored `claude`,
        coral in the feed) - and **one shared tool catalog** (zod -> JSON
        Schema) feeds both the MCP server and the panel (AGENT-6 is that
        consolidation; it is not done yet - the two surfaces declare their tools
        separately today, though the edit *semantics* are already shared).


        **The thin server is only a key-proxy.** Keep it **provider-agnostic**
        (an OpenAI-compatible base URL + model, so a free tier or a local model
        can drive tests; default Claude Sonnet), and keep the key **server-side
        only** - spend-capped, never `VITE_`-inlined into the client, with auth
        + rate-limiting before any non-localhost deploy.


        **The agent reasons on symbolic data and cannot hear its output.**
        Audio-analysis tools give it "ears" (AGENT-4). Play-an-idea (AGENT-5) is
        the mirror image: notes-in as the prompt, audio-analysis-out as the
        feedback, so the loop becomes play-an-idea -> agent develops it -> you
        hear it and keep or reject.


        **The genuinely novel surface is the activity feed itself** - a shared,
        two-voice timeline of the *edits* and the agent's *stated intent*, not a
        chat log. That holds whether the chat lives in Claude Desktop/Code or
        the embedded panel.


        **Note the distinct streams.** Agent chat (the reasoning transcript) is
        a *different* stream from the project's authored edit-log (what the
        reasoning produces). Do not fold agent turns into the project edit-log.


        ## Future / speculative notes


        Running ideas kept from design sessions: composite tools (coarser verbs
        that bundle several edits, so the model spends fewer round-trips),
        prompt patterns worth standardising, and giving the LLM ears via
        offline-render audio analysis (now AGENT-4, in flight).
      Collaboration - options and rationale: >-
        Captured so the tradeoffs are on record. The concurrency decision has
        since been **made and largely built** (HOST-1); this section keeps the
        reasoning and the roads not taken.


        ## Concurrency model - keep the diff log, add a sequencer


        A CRDT (Yjs/Automerge) is all-or-nothing: its value is *owning* the
        document and merging at that level, so adopting one means the store
        becomes a projection of its types and our authored command log stops
        being the source of truth. We want to **keep the diff model**, so the
        natural partner is not a CRDT but **server-authoritative event
        sourcing**: clients apply a command optimistically (instant local
        feedback, as today), a **sequencer** stamps it with a global order and
        rebroadcasts, and clients that had an in-flight optimistic op **rebase**
        it on top of the authoritative sequence.


        This is the smallest departure from what exists - the log just gains a
        server-assigned order plus a reconcile step - and it keeps one
        replayable, auditable log driving undo, history, and the two-voice feed.


        The architecture already had the two hardest prerequisites:
        **client-minted stable ids** (so concurrent inserts into a list never
        collide - the classic hard case) and coarse, intent-carrying commands.


        **The cost we take on** is owning the conflict *policy*: same-field
        edits resolve last-writer-by-sequence (intuitive), and the one genuinely
        hard case is an op referencing something another user just deleted
        (needs an explicit drop-or-resurrect rule - a small, enumerable set of
        command-vs-command interactions, not open-ended). Escalate to **OT**
        (keep our commands, add transform functions) only if last-writer proves
        too lossy; correct OT transforms are notoriously hard to build and test,
        so it is a later escalation, not a starting point.


        **The one thing this trades away.** Sequencing gives *consistency*
        (everyone converges to the same state) but not the *automatic,
        offline-tolerant merge* a CRDT gives for free. For a DAW - where edits
        mostly land on different tracks/clips and live/online collaboration is
        the target - that is a good trade. The single scenario that would
        justify revisiting the store-as-CRDT fork is if **long-offline divergent
        editing that must merge cleanly** ever becomes a core requirement.


        ## Libraries and the lock-in question


        Because we already own the command log (the expensive part), the
        sequencer itself is small - receive command, assign a monotonic seq,
        persist, fan out - so the honest ranking is by how much **data-model
        lock-in** each option imposes, which is a separate axis from the
        transport/hosting choice (transport is swappable; the framework is where
        lock-in lives).


        - **Least lock-in (the choice taken): own the protocol on a thin OSS
        layer.** A bare Node WebSocket server (`ws`), or **PartyKit** (MIT), or
        Cloudflare **Durable Objects** directly. One room = one project maps
        perfectly and hibernates when idle. The room handler is a standard
        socket handler, so the platform is *hosting we can re-point*, not a
        data-model we are married to.

        - **Middle - an OSS sync library that keeps ops: ShareDB (MIT).** The
        mature keep-your-own-operations + OT server, self-hostable. Downside: we
        adopt its JSON-OT type system and map commands onto it, and it is less
        actively maintained.

        - **Most turnkey, most lock-in - managed sync BaaS.**
        **Replicache/Zero** (Rocicorp) is the textbook optimistic-mutators +
        server-authoritative-rebase pattern and conceptually the closest match,
        but it is source-available/proprietary from one small vendor that has
        already moved to a successor - a real dependency risk. **Liveblocks**,
        **Convex**, **InstantDB** ship presence + storage fastest but each
        imposes its own data model (mostly a CRDT/store we do not need) and, for
        the proprietary ones, its platform.

        - *Transport/hosting cost:* a self-hosted `ws` process is cheapest if we
        run one small box; Durable Objects/PartyKit scale to zero at the cost of
        some Cloudflare hosting tie (not code tie). Avoid **raw AWS Lambda + API
        Gateway WebSockets** (room state lives nowhere; fan-out via DynamoDB +
        per-message billing is fiddly) and **WebRTC/`y-webrtc`** (needs
        signaling + TURN, no natural persistence, does not scale past tiny
        rooms).

        - *Presence needs none of this:* who-is-online + cursors is a small
        ephemeral broadcast over the same channel.


        ## First steps, ordered by risk


        Do the irreversible, foundational work first while it is cheap, prove
        each layer with no network risk before adding the next, and defer the
        one piece that can corrupt data until last:


        1. **Real identity on the log** (COLLAB-1, done). The keystone
        everything reads, expensive to retrofit, and it delivers value
        single-user immediately.

        2. **Blame overlay (local) + `dispatch` seam audit.** Render "last
        author" from the log with no network. The real payoff beyond the
        feature: it forces an audit that *every* mutation flows through
        `dispatch` - anything poking `ProjectStore` directly is invisible to the
        log and would be invisible to any future sync. Highest-value de-risking
        step, zero infrastructure.

        3. **Presence only** (COLLAB-2). Ephemeral, carries no document state,
        so a bug can flicker a cursor but never corrupt a project.

        4. **Sequenced shared editing** (HOST-1, done). Start with a small spike
        proving the rebase loop and the edit-vs-delete policy, then wire
        per-user undo (undo *my* edits, not everyone's).
      Sync service - scaling and sharding: >-
        **The project is the shard unit at every layer.** A project's edit
        stream is a single ordered log, so multiplayer needs exactly **one
        authority per project** (assigns order/`seq`, applies, broadcasts). That
        same `projectId` partitions all three layers:


        1. **WS routing** - a stateless gateway routes a client for project P to
        P's owning instance (consistent hashing on `projectId`, or a directory;
        Durable Objects/PartyKit do this natively via `idFromName(projectId)`).

        2. **In-memory authority** - the owner holds P's replay state and fans
        out to P's peers, with **failover** cheap because any instance can
        reload P from Postgres (keyframe + replay - the path already built) and
        take ownership.

        3. **DB sharding** - only when a single vertically-scaled PG (with
        pooling, read replicas, and `edits` partitioned by `projectId`) is
        outgrown, shard by `projectId`/`ownerId`; a project never spans a shard.


        This is clean **only because** the schema is already
        owner-/project-scoped with no cross-project joins ("multi-user later is
        a change of principal, not of queries"). Ephemeral state (presence,
        cursors, live MIDI) stays in the room's memory / a pub-sub bus, never
        the DB - so PG write load stays proportional to authored edits. The one
        code change scaling assumes - the **server** assigns `seq`, not the
        client - is already made.


        **A project is single-region at a time (consequence, acceptable).** One
        authority per project means that authority - and ideally its DB shard -
        lives in **one region** at any instant. The *service* is multi-region
        (different projects homed in different regions; a project's ownership
        can **migrate** regions on failover/rebalance, e.g. toward its active
        collaborators), but a single project is **not** simultaneously
        authoritative in two regions - that would break the single total order.


        This is not a latency problem in practice: with **optimistic local
        apply**, the authority's region only affects when the authoritative
        order/conflict-resolution *confirms*, not the felt responsiveness of
        editing. The only way to make one project genuinely multi-region
        (multi-primary, no central order) is a **CRDT**, which drops the
        single-`seq` authority for conflict-free merge - a real fork we are
        deliberately *not* taking. Revisit only if globally-distributed
        collaborators on one project become a real need.


        **How well it scales.** The model scales *on the axis that matters* and
        is naturally bounded on the risky one:


        - **Total projects** is embarrassingly parallel: rooms are
        shared-nothing (a room never talks to another room), so they shard
        across processes / Durable Objects and scale to zero when idle. This is
        the axis a hosted product grows along, and it is the easy one.

        - **Users per room** is the fan-out axis, and for a DAW it is naturally
        small (a band / session, single-digit to low-tens, not
        hundreds-in-one-file), so broadcasting each command to every peer is
        trivial and the single-threaded per-room sequencer is a feature, not a
        bottleneck - it is what buys a clean total order cheaply.

        - **Per-room write rate** is low because commands are coarse and
        intent-carrying (a 64-note fill is *one* `add_notes`, not 64 ops) and
        human/agent editing is bursty-but-slow; continuous gestures (a knob
        drag) coalesce before they hit the wire.

        - **The one genuine concern is unbounded log growth per project**, and
        the mitigation already exists: **snapshot keyframes + keyframe/delta
        commit storage** mean a late joiner loads the latest snapshot and
        replays only the tail since it, never the whole history - so catch-up
        bandwidth and memory are bounded by snapshot cadence, not project age.


        **The ceiling, named honestly:** if a *single* project ever needed
        hundreds of simultaneous editors, the one-sequencer-per-room design
        would bottleneck and want something fancier - but that is not the DAW
        use case. Net: the primitives that make it scale (shared-nothing rooms,
        snapshot + replay-the-tail) are ones we already have for versioning, so
        concurrency reuses them rather than inventing them.
      Sync service - foundations and deferred notes: >-
        Cross-cutting done infrastructure and deferred notes that do not belong
        to a single HOST ticket.


        ## Done


        - **Typed storage + a "don't trust the client" boundary.** JSON bundle
        files are stored as Postgres **`jsonb`** (readable and queryable in
        Drizzle Studio / psql, not opaque bytes; samples stay `bytea`, a CHECK
        enforces exactly one). Every JSON write is **shape-validated** against a
        per-path zod schema (`server/api/bundleSchemas.ts`) before it reaches
        the DB - malformed JSON is 400, wrong shape is 422. The validation is
        deliberately **structural** (top-level type + always-present fields,
        with zod's default key-stripping so evolving fields don't break saves);
        deep per-parameter validation stays at the client/MCP boundary where the
        param schema lives.

        - **Canonical shared project schema (slice 63).** A single pure-`zod`
        module, `src/audio/project/schema.ts`, is the source of truth for the
        document types: the client derives its TS types via `z.infer` (the
        hand-written `ProjectData` interfaces are gone), and the sync server
        validates writes against the *same* `validateBundleFile` -
        `project.json` is deep-validated down the tree, with no drift. It
        composes `graph/zod`'s device schemas for embedded custom devices and
        cooperates with the `documentMigration` upcasters. The `EditCommand`
        union stays structural for now (a ~50-variant wire-coupled union).

        - **Contract-first API (slice 64), superseding Hono RPC (`hc`).** The
        server's destination is a WebSocket realtime service, not fixed HTTP
        endpoints, so the API type story moved to a **plain-data zod contract**
        in `src/contract/`: route descriptors (`http.ts`) + WS message
        discriminated-unions (`ws.ts`) + shared param/error schemas
        (`errors.ts`), plus a browser client (`client.ts`). Both client and
        server import the definition normally (no
        type-import-through-the-server-graph, so the DOM-free-boundary hack is
        gone). The server *mounts and validates from* the contract. **Why `hc`
        was dropped:** it types HTTP routes but not bidirectional WS payloads
        (the actual destination), and contract-first also removes the
        type-import coupling. ts-rest does contract-first for HTTP but has no
        WS; tRPC has WS but is inference-shaped/heavy - so the thin contract
        layer is ours.

        - **Document-schema drift detection (slice 68).** Two version axes exist
        and only one is covered by DB migrations: drizzle-kit versions *table
        shape* (DDL), but the `project.json` / command payloads live in `jsonb`
        blobs it cannot see. Two guards close that: (a) **detectability** -
        `findStaleProjects(db, currentVersion)` reads the
        `projects.project_schema` column (backfilled from `manifest.json` on
        every write) and the API logs a startup warning listing any below the
        current version; (b) **build-time honesty** - `firstMissingUpcaster`
        asserts the upcaster registry chains contiguously up to
        `PROJECT_SCHEMA`, so bumping the schema without the matching upcaster
        fails in CI instead of stranding old data.

        - **The three code-level gaps (slice 65).** (1) Validation is no longer
        bypassable via `Content-Type` - the PUT decides JSON-vs-binary by
        **path** (`isBinaryPath`: `samples/*` = binary, everything else =
        JSON-to-validate) rather than the client-supplied header, so a JSON path
        can never be smuggled in as opaque `bytea`. (2) Request body size is
        **capped** - `hono/body-limit` with per-path limits, so an oversized
        upload is refused with 413 before the body is buffered whole. (3)
        Write-once history is **race-safe** - the commit guard is an atomic
        `insert(...).onConflictDoNothing().returning()`: the `(projectId, path)`
        unique constraint lets exactly one concurrent insert win, and the loser
        is a 409.


        ## Deferred deliberately


        - **A generated OpenAPI doc.** The shared contract already gives
        TypeScript consumers types + validation + a readable spec, so OpenAPI
        only earns its place for a *non-TS* consumer (a future mobile app, a
        partner, a public API); it is a ~10-line generator (`z.toJSONSchema`
        over `routes`) to add when one appears.

        - **Deepening validation is gated on catalog versioning (sequence
        matters).** Deep per-param and built-in-device validation are deferred:
        built-in instrument/effect schemas live in the client catalogs (not the
        document), and the client is coercion-tolerant and versionless by
        design, so strict server-side param validation would risk rejecting data
        the client considers valid. The safe path is a **`catalogVersion`**
        stamped in the manifest on write; the server ships the catalogs + its
        version and deep-validates params only when versions align, else falls
        back to structural (skew becomes detectable and handled, never a silent
        wrong rejection). This has independent value (reproducibility; a "your
        app version lacks this sound" UX). **Order:** custom-device params (zero
        coupling - the schema is embedded in the document) -> catalog versioning
        -> built-in params -> deep `EditCommand`.

        - **An eager data-migration** that heals stored blobs by reusing the
        upcasters (there is nothing to heal until the first actual bump;
        upcasting stays lazy-on-load).

        - **Agent-session persistence.** Agent chat (`ChatTurn` via
        `src/ui/agentSessions.ts`) is `localStorage`-only and **global**
        (cross-project) today - the same evictable storage that motivated the
        sync service, so it is the next durability gap after project data. Move
        it behind the sync seam as its own session-scoped store
        (`agent_sessions` + `agent_turns`, keyed by session id, not by the
        project's edit `seq`). Two decisions to settle when picked up:
        per-project vs global scoping (currently global - the agent re-reads
        project state each turn, so a conversation can span projects), and
        transcript size/privacy (tool-call payloads get large and are more
        sensitive than project data). This is a **distinct** stream from the
        project's authored edit-log.

        - **Object storage** (S3/R2) for large samples instead of `bytea` - fits
        behind the current seams.

        - **Client-side, inherent to shallow validation:** the loader must treat
        loaded project data as untrusted (defensive coercion on load; no unsafe
        deep-merge of loaded keys - a stored `__proto__` key is a
        prototype-pollution vector only if the client merges it carelessly).
      Recording and input (design): >-
        The honest constraint first: **the browser cannot reach ASIO-class
        round-trip latency.** On Windows the browser drives audio through WASAPI
        (usually shared mode), never ASIO, and there is no web API to reach an
        ASIO driver. macOS/CoreAudio is decent; Windows is mediocre.


        So the strategy is not "beat the latency" - it is **"don't depend on it
        for tracking, and null it out for timing accuracy."** That is also how
        pros track in any DAW once buffers get large.


        ## The capture path (web-first)


        - **Input** via `getUserMedia({ audio: { deviceId, echoCancellation:
        false, noiseSuppression: false, autoGainControl: false, channelCount,
        sampleRate } })`. Disabling the voice-DSP is mandatory or Chrome mangles
        the signal. Enumerate/select interfaces with `enumerateDevices()`
        (labels need permission; HTTPS/secure-context required).

        - **Into the graph** via `MediaStreamAudioSourceNode`, then a capture
        **AudioWorklet** that runs on the render thread at 128-frame quanta.
        *(The design called for a SharedArrayBuffer ring buffer + a Worker
        drain, needing cross-origin isolation via COOP/COEP; what shipped is
        simpler - per-quantum float32 via `postMessage`, no SharedArrayBuffer.
        Revisit the ring buffer if long takes strain memory.)*

        - **Sample-rate alignment:** run the `AudioContext` at the interface's
        native rate (request 48k, read back `sampleRate`); resampling a
        getUserMedia stream adds latency and artifacts.


        ## Monitoring (what the performer hears while recording)


        - **Hardware/direct monitoring is the default recommendation** - the
        interface mixes input to output internally, zero added latency, the
        computer only captures. This sidesteps the whole latency problem for
        tracking and is what ASIO users do anyway when buffers are big.

        - **Software monitoring** (through our graph) is offered only where the
        round-trip is low enough (macOS + good interface); read
        `context.outputLatency`/`baseLatency` and warn.


        ## Timing accuracy = recording latency compensation (the real answer)


        We don't need low latency to record *accurately*; we need to know the
        offset and shift the recorded region back by it so it lands where the
        performer actually played. Captured frames are timestamped against
        `context.currentTime`; the round-trip offset = input + output + worklet
        buffering.


        A one-time **loopback calibration** (play a click, record it back
        through a physical/virtual loop, measure the sample offset) gives an
        exact per-device compensation value - Logic/Ableton call this
        driver-error compensation. Store the offset on the recorded region;
        everything downstream stays sample-accurate. *(Shipped so far: a fixed
        `outputLatency + baseLatency` estimate. Real calibration is still a
        DAW-6 follow-up.)*


        ## Fit with the model


        - A **recorded clip is just another clip type** alongside note clips: a
        reference to an audio buffer (content-addressed OPFS file) + the
        compensation offset, sitting on an **audio track** whose "instrument" is
        a buffer player. It flows through the same ProjectStore/persistence/MCP
        keystone; playback schedules `AudioBufferSourceNode.start(when)` via the
        existing lookahead scheduler.

        - **MCP stays a control-plane:** it can arm/disarm tracks, start/stop
        capture, set the compensation, and place/trim recorded regions - never
        the realtime sample path.


        ## The escape hatch


        For true low-latency monitored tracking: the **Tauri desktop backend**
        (MOBILE-4). A Rust audio backend (CPAL, or WASAPI-exclusive / CoreAudio,
        even ASIO) could own capture/monitoring natively while the same web
        UI/model rides on top. Staged plan: web-first with hardware monitoring +
        latency compensation (covers most recording), then the native backend
        for users who need monitored low-latency input.
      Mobile editing surfaces (design): |-
        How the phone and tablet edit, decided 2026-07-31 against a working gesture prototype rather than on paper. The prototype is a self-contained page (Pointer Events, one canvas, no framework) iterated on a real device across a session: **https://claude.ai/code/artifact/9072c7ef-cebf-4ba2-a344-689cea364e22**. Where a decision below says something "felt wrong", that is what it means.

        Built by MOBILE-5 (the sheet), MOBILE-6 (the sections), MOBILE-7 (touch editing), MOBILE-8 (safe areas), DAW-28 (note names).

        ## The sheet replaces the tabs

        MOBILE-1 shipped four bottom tabs - Arrangement, Edit, Clips, Devices - on the argument that they are *the desktop's four surfaces*, not navigation invented for mobile. That argument was right, and it points somewhere better: the desktop does not tab between them, it **occludes**. `CenterWorkbench` is editor-above-rack floating over the timeline.

        So the editor becomes a **bottom sheet over the arrangement**, thrown between three detents:

        - **Peek** - parked; the grabber and the Edit/Rack switch only.
        - **Half** - edit and arrange at once. The detent the whole idea is for.
        - **Full** - covers everything but the selected lane.

        Consequences, all of them simplifications:

        - **`LaneStrip` stops being a special case.** It existed only because the Edit tab took the arrangement away, so the selected lane had to be smuggled back above it. Now the detents are a continuum of *how much arrangement you can see*, and Full is what `LaneStrip` was.
        - **The tab bar goes**, reclaiming ~56px plus the safe area on a phone. Edit and Rack become a segmented control in the sheet header; Arrangement is the background; Clips is a section (below).
        - **Mobile stops being "the desktop split four ways" and becomes "the desktop, occluded"** - a better story than the one in `MobileShell`'s header comment, which should be rewritten to it.

        **The sheet is non-modal, and that is load-bearing.** You must be able to tap a track in the arrangement while it is up. Every off-the-shelf bottom sheet (`vaul` and friends) is built on a modal dialog primitive, so it traps focus and `inert`s the background - exactly backwards. It is also why this must not share an implementation with `Sheet.tsx`, whose library and agent sheets genuinely *are* modal.

        ## The throw gesture is ordinary web

        No native mechanics involved. What iOS and Android supply (`UISheetPresentationController.detents`, `BottomSheetBehavior`) is a tuned spring curve and a velocity threshold, not a capability. The parts:

        - Pointer Events with `setPointerCapture`; `touch-action: none` on the drag surface - the single most important line, because without it iOS claims the gesture before the first event arrives.
        - Velocity from ~100ms of `(y, timestamp)` history. A single frame delta is far too noisy to threshold at 120Hz.
        - **The throw is one line:** `landing = release + velocity * ~130ms`, snapped to the nearest detent. That projection *is* the feel; at 0 flicking stops working and it only ever snaps to whichever detent is nearest.
        - **Seed the settle spring with the release velocity.** A CSS transition discards it and restarts from rest; carrying it through is what people recognise as "native". A/B'd in the prototype, and the difference is much larger than expected for about ten lines of rAF.
        - Transform while moving, **commit layout once on settle**. Animating height would relayout the piano roll every frame. Same discipline as `useSharedGridScroll`: write the transform straight to the node during the drag, touch app state only at rest.
        - Nested scrolling: a scroller inside the sheet keeps the drag unless it is already at `scrollTop` 0 and you are pulling down. Find the scroller from the event target rather than assuming one - the roll has its own.

        ## Sections, not tabs, under the roll

        Clips and pads are **collapsible sections beneath the piano roll**, in that order, sharing one drawer component.

        **A section's height is a function of its content, never a drag.** Adding a pad row grows it by exactly one row and the roll gives up exactly that much. An earlier prototype let the roll resize as the keyboard appeared, and it was confusing precisely because the amount was unpredictable.

        Clips are the thin horizontal chip rail. Visibility is the section's disclosure and nothing else - an earlier version tied it to the detent as well, and two mechanisms fighting over one thing means you collapse it and the detent reopens it.

        ## Pads, not keys

        An on-screen piano keyboard on a 390px phone gives ~27px keys, which is unplayable. Pads give 50px+ and a legible note name. The layout generalises the piano rather than imitating it:

        - **In-scale notes take the full-width row; everything else sits above, between them.** In C major that lands the accidentals exactly where the black keys are. Because the gaps derive from *the scale's own interval pattern*, the shape holds for any key or mode with only the labels moving.
        - **Each row closes on the next tonic**, exactly as a piano octave ends on C. Without it the leading tone has no gap to sit in and silently disappears - found by testing the layout across six scales, not by looking at it.
        - Every pad carries its **interval to the tonic** (`1`, `2`, `b3`, `5`), which is what you think in once a key is set. This is the first real consumer of a project-level key/scale.
        - Accidentals can be switched off, for a row you cannot play a wrong note in. On a phone this may be the better default.
        - A tablet fits **two octaves per row**, a phone one. Below ~44px per pad the layout is wrong, not merely tight.

        ## Touch editing: select, then handles and a kebab

        Touch has no hover, no modifiers, and a 44px finger, so the desktop roll's 4px drag-edges cannot transfer. **Selection is the substitute for hover:** only the selected object grows handles, so they can be finger-sized without turning every neighbour into a grab target. One model for notes in the roll and clips in the timeline.

        - Drag the body to move, drag an end handle to resize or trim.
        - **Actions hang off a kebab pinned to the object's right edge**, not a bar pinned to the screen. It costs no permanent space (which landscape cannot spare), and it means the actions are ordinary `MenuItem`s, so `Menu.tsx` is reused rather than a bespoke toolbar grown. Clamp it to the visible edge; an affordance you have to scroll to find is one you stop reaching for.
        - **Velocity lives in that menu as an inline row of values, not a submenu.** `Menu.tsx` opens submenus on hover, which does not exist on touch, and a nested flyout near a screen edge is a cramped thing to aim at. Velocity also renders as note fill strength, which is what earns the right to drop the velocity lane on a phone.
        - **Split at the playhead, not at a tap point.** Splitting where you tap needs precision; the playhead is already positioned and already on screen. The touch version is the *easy* one, so it belongs in the first slice rather than a later one.

        **Creating differs by surface, deliberately** (settled 2026-07-31). A note has an obvious default and a clip does not: tap a grid cell and you have stated pitch and position, and one beat is a fine length, whereas a clip's length and position *are* its substance.

        - **In the roll, tap to create.** A tap on empty space means *deselect if something is selected, otherwise create a note there*. The ordering is the point - you cannot fat-finger a note into existence while editing one, and creation is still one tap the rest of the time. MOBILE-2's explicit draw/select tool model is **not** adopted.
        - **In the timeline, drag a range then pick from a menu.** Highlighting empty lane space raises a kebab offering **Create clip**, and **Paste** when the clipboard holds something. The range states what a tap could not.
        - **The playhead is a valid target on its own** - paste should work with no selection at all, at the ticker. Same reasoning as split-at-playhead: something already positioned and already on screen beats asking for precision.

        Worth keeping straight: this makes an empty-space drag mean *scroll* in the roll and *define a range* in the timeline. The roll scrolls in the axis it creates in; the timeline does not.

        ## Sustain by drag-down

        Press a pad, drag down past a threshold, and the note latches on; drag up on it to release. **Playing a new note releases the held ones** - decided 2026-07-31, knowing the limitation.

        The limitation, recorded so it is not rediscovered: that rule means you can only hold *instead of* playing, never *while* playing, which is the main reason to want sustain. The alternative (latches persist, release is explicit) was prototyped alongside it and is one flag away. Ship the simple form, expect to revisit.

        ## Safe areas: sit below the notch

        `index.html` already sets `viewport-fit=cover`, with a comment saying the shell pads itself back with `env(safe-area-inset-*)` - but only `safe-area-inset-bottom` was ever implemented. So the top bar's ☰ and ✦ sit under the corner radius and, in landscape, the notch takes a column off the arrangement. **Decision: keep `cover` and pad all four sides** rather than dropping it, because landscape is where the app is most starved of width.

        **The trap:** an absolutely positioned box resolves against its containing block's *padding box*, so padding on the container is ignored by exactly the children that need it. The insets must go on the positioned boxes themselves. This looks correct in review and does nothing - it caught the prototype, and `MobileShell`'s sheets are positioned the same way.

        The top bar also loses its readouts. Tempo and meter do not fit at 390px and already live in the ⋮ menu; the position counter is on the timeline ruler, which is on screen at every detent but Full. Controls only, which buys back roughly what the notch costs.

        ## Landscape phone

        Still the weak spot: ~390px tall *and*, with the insets, ~94px narrower. Half-and-half may not survive there, in which case the detent set becomes a function of `shape` rather than a constant. Deliberately not designed around yet - it needs real use first.
      MIDI effects (design): >-
        A **MIDI effect** transforms the stream of note events *before* it
        reaches the instrument - the symmetric counterpart to an audio effect,
        which transforms the signal *after*. First targets: an **arpeggiator**
        (turn held/overlapping notes into a rhythmic sequence) and an
        **octavator** (double each note up/down one or more octaves). Both are
        now registered in `src/audio/midi/device/catalog.ts`.


        They are not instruments and not audio effects; they are a **third
        device class on the note path**.


        ## Where they sit in the architecture (the keystone, reused)


        - **Catalog + registry, same as everything.** A MIDI effect is declared
        once as a param schema + catalog entry and realized by a pure transform
        factory in a registry. UI, MCP, automation, and persistence are
        projections of the schema, exactly like instruments/audio effects - no
        per-type branching. The library's add menus, the MCP palette, and the
        device rack pick them up by iterating the catalog.

        - **A per-track MIDI-effect chain**, ordered, living on the
        `InstrumentTrack` alongside `params` + the audio `effects` chain. Audio
        tracks have no note path, so no MIDI chain. Each entry is `{ id, type,
        bypassed, params: ParamStore }`, the same shape as `EffectInstance` -
        reuse the chain CRUD (add/remove/move/bypass) and the `EffectChain` UI,
        just over a different host list. *(That duplication is what ARCH-2
        proposes to factor into a shared device-chain abstraction.)*

        - **Pure functions on notes, not on the audio graph.** Unlike audio
        effects (Web Audio nodes bound by the engine), a MIDI effect is a pure
        `(notes, ctx) -> notes` transform. The DOM-free Node MCP server can hold
        the catalog *and* the transforms (they touch no Web Audio), which keeps
        the engine/registry split clean and lets the agent reason about note
        output.

        - **Where they run (the seam):** the scheduler already reads a
        placement's clip notes as pure data per tick and emits onsets to the
        instrument. A MIDI effect chain is applied to that per-clip note list as
        a fold - `chain.reduce((notes, fx) => fx.bypassed ? notes :
        transform[fx.type](notes, ctx), clipNotes)` - *before* the onset math.
        `ctx` carries tempo, beats-per-bar, the loop/clip length, and the
        placement window, so an arpeggiator can quantize to a rate and a swing.


        ## Two honest subtleties designed around


        - **Time-expanding transforms vs the lookahead window.** An arpeggiator
        emits notes that did not exist in the clip, at rates finer than the
        source notes. The scheduler's bounded lookahead means the transform must
        be a *function of an absolute beat range* (produce all arp steps whose
        onsets fall in `[fromBeats, horizonBeats)`), not a stateful streaming
        filter - otherwise notes straddling a tick boundary get dropped or
        doubled. Model each MIDI effect as `notesInRange(clipNotes, range, ctx)
        -> notes`, mirroring how audio onsets are already computed, so it
        composes with looping/tiling.

        - **Note-offs / held chords.** The arpeggiator needs to know which notes
        are held together at a given beat to cycle them. Clip notes already
        carry `start` + `length` (so a "held chord" is notes overlapping a
        beat), which is enough to compute arp steps purely from the clip - no
        live note-on/off state required for *playback*. **Live keyboard input
        through a MIDI effect** (real-time arpeggiation of what you play) is a
        later extension that needs the held-set state and reuses the same
        transforms.


        ## Fit with the rest


        - **MCP** arms the same catalog-driven verbs as audio effects
        (`add_midi_device`, `set_midi_device_parameter`, `bypass_midi_device`,
        `move_midi_device`, `list_midi_devices`), validated at the boundary from
        the schema (`specToZod`). The agent can build an arpeggiated part by
        adding the device and setting params, not by writing out every note.

        - **Persistence / history / undo:** the chain serializes like the audio
        chain (type + params + bypass); every add/remove/param change is a
        durable authored edit.

        - **Automation:** because params are schema-driven `ParamStore`s, arp
        rate/gate/swing automate through the same automation lane work as any
        other parameter.

        - **Offline render** routes notes through the MIDI-device chain via an
        offline transport clock, so arps/octavators render exactly as live
        (AGENT-21).


        ## Roadmap beyond the two shipped devices


        A **harmonizer** and **project-key-aware** transforms are the natural
        next devices (they pair with DAW-12's key model). Live-input
        arpeggiation lands once the held-set state is added.
      Open decisions: >-
        Deferred, not blocking. These are deliberately kept as questions rather
        than tickets.


        - **Web-only-with-FS-API vs Tauri desktop, and when to make the jump.**
        (See MOBILE-3/MOBILE-4: the PWA validates webview audio cheaply first.)

        - **Bus-tree grouping vs also modelling song sections as a hierarchy.**
        Current lean: bus tree structural, sections on the timeline.

        - **How prominent the conversation is by default** (status strip -> dock
        -> co-equal panel).

        - **In-app agent hosting:** client-side with a server key-proxy vs more
        server-side reasoning.

        - **Whether agent edits ever gate behind a propose / preview / accept
        step, or always land-then-undo** (the current model). The activity panel
        is already halfway to a propose/accept loop; land-then-undo keeps
        creative flow, but a gate may build trust for large or destructive
        batches. AGENT-11's approval gate is the concrete version of this if we
        take it.

        - **Finishing vs optionality: do we need a deliberate "constraint /
        finishing mode" that narrows choices?** Producers report finishing
        tracks by *deleting* plugins and options ("less stuff, more creativity"
        worked "like magic"), yet the axis principle, clip variants, and
        AI-generated takes all *manufacture* optionality - the #4 reported
        struggle at 7.0%. Open because it hedges against our own
        fearless-iteration thesis and there is no concrete design yet, only a
        direction. (Surfaced as a proposed ticket in `docs/RESEARCH.md` section
        12; deliberately kept a question.)

        - **Branching: current lean is to keep it deferred indefinitely.** The
        evidence says the demand is **linear revert and snapshot safety**, not
        branch-and-A/B - even sympathetic developers struggle to name a
        branching use case, and a branch you cannot merge is just a save-as with
        better manners (merge is explicitly not the pitch). Revert already
        shipped (HOST-6). Revisit only on direct evidence of a real branching
        use case. See `docs/RESEARCH.md` section 12.D.

        - **Third-party plugins (a WAM host): do we allow it at all? Leaning no;
        keeping an eye on it.** WAM would bring ~50 browser plugins and unblock
        the semi-pro segment, but a WAM plugin's full state is an opaque
        `getState()` blob beyond its declared parameters, so it **reopens the
        completeness hole** that makes our projects diffable, self-contained
        JSON (the constraint is the moat). A schema bridge is *partly* possible
        - WAM's `getParameterInfo()` is close to our `ParamSpec`, so a plugin's
        *parameters* could be automated and agent-addressed like a built-in
        device - but that describes the control surface, not the whole state
        (opaque blob, bespoke UI, out-of-schema samples/IRs remain). A
        **params-only host** (persist only the declared params, refuse the
        opaque blob) would stay complete but reset stateful plugins, surviving
        cleanly only for simple effects (EQ / comp / filter), the mixing
        category. Current lean: **do not build the full host**; the params-only
        subset is the version to revisit first, and only on direct evidence that
        plugin absence is what is actually blocking adoption. See
        `docs/RESEARCH.md` section 12.E.
      Licensing and business model: >-
        Direction as the project goes from disposable local tool to a hosted
        product with an ideal of being the **sole provider**. Current state:
        **AGPL-3.0-or-later** (`package.json` + a full `LICENSE`), a **DCO** in
        `CONTRIBUTING.md`, SPDX headers crediting **Alden Laslett** (sole
        copyright), repo public (`alden12/web-daw`). *Not legal advice -
        decisions to revisit at launch.*


        ## The keystone insight: three different tools solve three different
        problems


        - **The licence (AGPL vs BSL)** governs what *users* may do. This is
        where any "traction cost" lives.

        - **A trademark** governs who may use the *name/brand*. Compatible with
        open source (Firefox/WordPress model). This is the real "sole provider"
        lever.

        - **A CLA/DCO** governs what *contributors* grant *you*. Invisible to
        users; costs nothing in adoption. This is what preserves (or fails to
        preserve) your ability to relicense later.


        | Threat | AGPL | Trademark | Source-available (BSL/SSPL) |

        | --- | --- | --- | --- |

        | Competitor forks, improves privately, out-hosts you | **blocks** (must
        publish changes) | - | blocks |

        | Someone hosts your code & charges, under *their* name | allows | - |
        **blocks** |

        | Someone hosts it and calls it *your* product | - | **blocks** | - |


        The "host my code and charge as their own" cell is the one **AGPL +
        trademark leaves open**. Only a source-available licence closes it, and
        that means giving up the OSI "open source" label (the OSI definition
        forbids field-of-use restrictions, so no OSI licence can bar hosting).


        ## Why AGPL now (not BSL)


        AGPL is *more* valuable once hosted: it closes the SaaS loophole (anyone
        running a modified version as a service must publish their changes),
        which deters the *dangerous* competitor - a funded, closed,
        differentiated fork. The naive "rehost verbatim and charge" copycat is
        not a real threat pre-traction: they run a stale snapshot with no
        roadmap, support, brand, or your users (accounts/multiplayer/sync are
        the actual moat), always behind your HEAD. Strip-mining targets
        proven-demand infrastructure (DBs/search), not a pre-revenue creator
        app.


        **Timing is inverted - the reason not to "BSL during development."** The
        intuition "protect while building, open up at launch" is backwards on
        both axes: rehosting **risk is ~zero pre-launch and grows with
        traction**, while BSL's **cost (contributor friction, non-OSS label,
        credibility) is highest during the growth phase**. BSL-during-dev buys
        protection you don't need and pays for it when it hurts most. The
        industry playbook is the reverse: start open, and *if* you become a
        genuine strip-mining target, apply BSL to **new versions then**
        (Sentry/CockroachDB/HashiCorp). That works despite old versions staying
        open, because stale forks don't compete - so "AGPL is forever" is much
        softer in practice than it sounds.


        **BSL, if ever adopted**, is the MariaDB BSL 1.1 template with an
        *Additional Use Grant* carving out "no competing hosted service"
        (self-hosting/non-prod/forking still allowed) and a *Change Date*
        converting each version to AGPL after ~4 years. `package.json` would use
        the SPDX id `BUSL-1.1` (or `"SEE LICENSE IN LICENSE"`), with the
        Additional Use Grant + Change Date living in the `LICENSE` file - the
        SPDX id alone does not encode those parameters.


        ## Contributions: DCO preserves provenance, NOT relicensing


        The DCO certifies a contributor had the right to submit under AGPL
        (inbound = outbound); it gives *you* no right to relicense their code.
        So DCO does **not** keep the BSL door open. What does is a real **CLA**
        (copyright assignment or a broad grant including the right to
        relicense).


        **But while sole author you already have full relicensing freedom** -
        you own everything - so no CLA is needed yet; DCO is correct
        low-friction hygiene. The **trigger** to decide is the *first
        non-trivial outside contribution*, at which point that slice becomes
        AGPL-locked unless you first: (a) add a lightweight "CLA-lite" clause to
        `CONTRIBUTING.md` (inbound under AGPL **plus** a grant to relicense
        under future project licences - middle path, low friction), or (b) adopt
        a full CLA + signing bot (max optionality, max friction), or (c) accept
        AGPL-lock and move on. Keep the SPDX copyright as the sole holder (not
        "contributors") to keep this clean.


        **The extension SDK (INST-5) is the related structural lever:** the
        intended growth model is extension, not modification - the core stays a
        single-owner, dual-licensable unit, and a permissive SDK package lets
        extensions be owned by their authors under any licence.


        ## Trademark: territorial, defer to traction


        A trademark is national/regional - a UK mark protects only the UK; there
        is no world trademark. You don't register everywhere up front, and
        waiting is safe because of two treaties: **Paris Convention priority**
        (file UK, then within 6 months foreign filings can back-date to the UK
        date) and the **Madrid Protocol** (one WIPO application off the UK
        "home" mark, add countries later).


        Meanwhile there is free/cheap cover: UK "passing off", US
        **first-to-use** common-law rights, and grabbing the domain + handles at
        naming time (the real early squatting vector). UK IPO: ~£170 first class
        + £50/extra, classes 9 (software) + 42 (SaaS) (+ maybe 41), ~3-4 months
        if unopposed. EU is efficient (one EUTM covers all 27, ~€850+); US via
        USPTO (~$250-350/class).


        **Sequencing:** cheap brand hygiene now (a distinctive,
        invented/arbitrary name - descriptive marks like "web-daw" are largely
        unregistrable/unenforceable; grab domain + handles) -> file UK at public
        launch under the brand -> within 6 months add EU/US *if traction
        warrants* -> Madrid for further countries reactively.


        ## Decisions / triggers (deferred, not blocking)


        - **Licence:** stay AGPL through development and launch. Revisit BSL
        only on real traction + genuine rehosting-target status, applied to new
        versions.

        - **CLA:** none needed while solo. Decide at the first non-trivial
        outside PR (CLA-lite vs full CLA vs accept AGPL-lock). Preserve
        sole-copyright SPDX headers until then.

        - **Trademark:** no action until public launch under the brand.
        Actionable now only: pick a distinctive name and grab domain + handles
        at naming time.
      Slice history: >-
        The build order, kept because the sequencing rationale is itself the
        record of how the thesis was tested. Slice numbers appear throughout
        ticket bodies and code comments.


