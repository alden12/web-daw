      - ref: HOST-16
        area: HOST
        title: "Offline UI flickers: the banner shifts the whole app, and the chip
          oscillates"
        status: to-do
        sort_path: "000016"
        priority: 0
        body: >-
          Reported by the user, 2026-07-30, on the deployed build with **no
          internet**: the top bar and the sync chip flash while the client tries
          to connect, and the result reads as the app being broken rather than
          as "you are offline".


          Being offline is a **supported, benign state** here - edits are saved
          locally and flush on reconnect (HOST-5), and the copy already says so.
          So the UI should settle into a calm offline state, not strobe.


          ## One mechanism is structural and readable from the code


          `AppShell.tsx:375` renders the banner as a **conditional sibling in
          the flex column above the shell**:


          ```tsx

          {syncStatus === "offline" && <OfflineBanner shared={!!isSharedProject}
          />}

          ```


          So every time the status enters or leaves `offline`, the banner mounts
          or unmounts and **the entire app below it shifts by the banner's
          height** (~29px) - top bar, workspace, timeline, all of it. That is a
          whole-window jump, which is exactly what "looks broken" describes, and
          it happens no matter how small the underlying status change was.


          **Fix direction:** take the banner out of the layout flow (overlay it,
          or reserve its height and slide/fade it in). A transient connection
          state should never resize the workspace.


          ## The oscillation itself needs reproducing before fixing


          Not yet confirmed - worth reproducing with DevTools offline before
          changing the transport. What the code shows:


          - `setStatus` (`client.ts:246`) already no-ops on an unchanged value,
          so a plain retry loop should *not* churn: `drop()` sets `offline`, and
          the retry path (`client.ts:311-325`) calls `connect()` without setting
          `connecting`, so repeated failures stay on `offline`.

          - The path that *does* return to `connecting` is
          `IdleController.onWake` (`client.ts:294-297`). If idle/hidden wake
          fires while there is no network - plausible on a phone, where
          visibility and resize events are frequent - the status cycles `offline
          -> connecting -> offline` on every wake, with backoff capped at
          `RECONNECT_MAX_MS = 10s`. That would produce exactly the observed
          repeating flash.

          - `connecting` also carries `animate-pulse` on the chip dot
          (`ConnectionStatus.tsx:13`), so any visit to that state pulses rather
          than sitting still.


          **Fix direction, once confirmed:** add hysteresis so short-lived
          transitions do not reach the UI - suppress `connecting` for the first
          few hundred ms of an attempt, and once `offline` has been entered,
          stay there visually until genuinely `online` rather than flipping back
          on each attempt. The transport's state machine can stay as it is; this
          is about what the UI is allowed to render.


          ## Check the touch shell specifically


          The report came from a phone. The banner sits *above* the shell, so on
          the touch shell it also shifts the pinned transport and pushes the
          bottom tab bar - worth confirming the fix on both shells (MOBILE-1).
        id: 019fb3dc-761a-76ab-8e81-017f725ed09d
        created_at: 2026-07-30T16:29:57.658Z
        updated_at: 2026-07-30T16:29:57.658Z
      - ref: HOST-17
        area: HOST
        title: A project has a link
        status: review
        sort_path: "000017"
        priority: 0
        deps:
          - HOST-2
        body: >-
          Sharing grants access by email (HOST-2), and then there is nothing to
          send: the URL never mentioned the project, so the only way to tell
          someone which one you meant was to describe it. Noticed while trying
          to share one, 2026-08-06.


          **Deliberately the smallest thing that works, and knowingly ahead of
          the design.** How routing and sharing should really work is not
          decided - link-based access, invite links, a project index, addressing
          a version or a clip - so this does not build a router or take a
          position on any of it. The URL is a *reflection* of which project is
          open, written with `replaceState` and read once at boot. `/p/` is
          claimed as the prefix so a real route can own the rest of the space
          later.


          - **The id is the identity, the name is decoration**, separated by `~`
          (a slug can never contain one, so parsing stays unambiguous whatever
          an id looks like - they are not all the same shape, the first project
          on a fresh install is `default`). A link survives a rename, and two
          projects may share a name.

          - **A link's project only wins if it is really there.** Opening a link
          to a project you cannot see falls back to your own; it must not seed a
          local project under someone else's id, which is what a naive "adopt
          the id from the URL" would do on a fresh install.

          - `replaceState`, not `pushState`: opening a project is not navigation
          here, and a history entry you can go "back" from without the app
          switching projects would be a lie.


          **Signing in returns to the origin, and the path is remembered
          separately** - `sessionStorage`, consumed on the next boot. The
          obvious version (`redirectTo: window.location.href`) is wrong, and
          wrong *quietly*: Supabase matches `redirectTo` against its allow-list
          and falls back to the project's configured **Site URL** when it does
          not match, so a signed-out localhost tab opening a project link was
          sent to the deployed site. Found by testing it, 2026-08-06. The same
          trap was waiting in production - `/p/<project>` would have matched no
          allow-list entry there either and dropped the project on the way
          through the provider - so the fix is not "add `/**` to the allow-list"
          but to stop asking the provider to carry a path at all. The origin is
          allow-listed by definition: it is how signing in works today.


          Not here, and each wants the design this deferred: a copy-link
          affordance (the address bar is the link for now), link-based *access*
          (a link still only works for someone the project is shared with), and
          anything else worth addressing.


          ## When this is designed properly


          The questions it should answer: whether a link grants access or only
          names a project; whether project ids should be unguessable if they
          ever do grant access (`p-` + 8 hex is not); what else deserves a URL
          (a version, a mix, a clip) and therefore what the route shape is; and
          whether the back button should mean anything.
        id: 019fd716-70c0-737c-863e-d13aa5ceb908
        created_at: 2026-08-06T12:39:59.936Z
        updated_at: 2026-08-06T12:53:40.587Z
      - ref: INST-1
        area: INST
        title: Built-in instruments
        status: done
        sort_path: "000001"
        priority: 0
        deps:
          - DAW-1
        body: >-
          The instrument catalog and the two frameworks under it. Adding an
          instrument is a three-touch extension (catalog entry + factory +, for
          worklets, the module URL), after which it appears in the library, the
          knob panel, the MCP palette, automation, and persistence for free.


          **Node-graph instruments.** Subtractive + FM, built from native Web
          Audio nodes.


          **Custom-DSP AudioWorklet framework (slice 36), part A of the worklet
          intro.** The ceiling of the node-graph approach (no per-sample logic /
          block algorithms) is lifted by a worklet authoring + loading seam:
          worklet processors are authored in **TypeScript** under
          `src/audio/worklets/` and bundled by Vite via the `?worker&url` import
          suffix (which transpiles + inlines the worklet's imports and returns a
          URL for `addModule`); the pure DSP they run lives in shared,
          unit-tested modules under `src/audio/dsp/` (the worklet is a thin
          realtime shell). `worklets/index.ts` is the single module registry;
          `AudioEngine.start()` awaits `loadWorklets` before building the graph
          so worklet-backed effects construct synchronously. Worklet-scope
          globals are declared in a tiny ambient `worklets/audioworklet.d.ts`.


          **Worklet *instrument* framework + wavetable synth (slice 39), part
          B.** A `WorkletInstrument` base implements the `Instrument` interface
          over an `AudioWorkletNode`: note events post to the processor with
          their absolute `when` (the scheduler's lookahead delivers them ahead
          of time, so the processor places them **sample-accurately**), and
          params bind **generically** - every number param in the schema binds
          to the processor's same-named `AudioParam` via `rampParam`, so a
          worklet instrument needs no per-param code, just a processor name +
          matching `parameterDescriptors`. Shipped on it: a polyphonic
          **wavetable synth** (a morphing bank of single-cycle tables in pure
          `dsp/wavetable.ts`; a 16-voice pool with linear attack/release
          envelopes, a one-pole tone control, and sample-accurate dispatch).


          **Flagship synth "Nimbus" (slice 56).** A warm, Juno-inspired
          **polyphonic subtractive synth** on the worklet-instrument framework.
          Each of 16 voices mixes band-limited **saw + pulse (PWM) + sub +
          noise** (PolyBLEP, pure `dsp/oscillators.ts`) through a four-pole
          **resonant Moog-style ladder filter** (pure, unit-tested
          `dsp/ladder.ts` - the "the filter is the sound" investment, reusable
          by future synths), shaped by a full **ADSR** (the amp env also
          modulates the filter by an amount) with **key-track**, one global
          **LFO** (rate + delay/fade-in, to pitch / filter / PWM), and subtle
          per-voice **drift**. Continuous osc-level knobs (rather than on/off
          switches) keep every param a *number*, so `WorkletInstrument` binds
          them all generically. Continuous modulation (pitch/PWM/cutoff)
          refreshes per block; the VCA envelope runs per sample. Its signature
          lushness comes from the existing Chorus effect (bundled into the
          patches). **Remaining in the arc:** a **Minimoog-style mono**
          lead/bass voice reusing the ladder filter. Nimbus is the test-bed for
          the tonic-relative display (DAW-12).


          **Sampler (slice 50, PR 1 of the drum arc).** A single-voice, one-shot
          Sampler plays an audio buffer chromatically (keytracked playback rate
          around a root note). It is the first consumer of a new keystone
          **`sample` param kind** (a tagged-string ref: `builtin:<id>`,
          `asset:<id>`) - so the picker, MCP, persistence, and patches all
          project off the schema with no per-instrument branching. The shared
          voice was generalized from `oscillators` to
          `AudioScheduledSourceNode[]` so a buffer source reuses the base
          envelope.


          **Drum machine - `drumkit` instrument + step grid (slice 58).** A bank
          of one-shot sample players (up to `DRUMKIT_PADS`) where a played MIDI
          note *selects a pad* rather than pitching one sample. **Which note
          fires a pad is itself a param** (`pad{n}.note`, defaulting to a
          contiguous octave up from `DRUMKIT_BASE_NOTE`), so the mapping is data
          - visible in the panel, settable over MCP, remappable to a GM/hardware
          layout - and `Drumkit` resolves note -> pad from those params at play
          time (no hardcoded inverse). Each pad is a `sample` ref + note + level
          + tune (tune snaps to whole semitones via a new `step` on the number
          spec), all schema-driven, so it needs no per-pad code. The rack gives
          the kit its own `DrumkitPanel`: a compact pad-per-cell layout
          (note-name selector in the title, sample picker, horizontal Level/Tune
          faders) showing only pads in use plus an **Add pad** button. A
          drum-kit track edits notes as a **pad x step sequencer grid** or the
          ordinary **piano roll** via a per-track **Pads | Keys** toggle -
          "Keys" is the exact same `PianoRoll` via a thin `DrumRoll.tsx` wrapper
          passing one optional `rows` prop (rows map to pads, so a reserved left
          gutter reads "C4 Kick" beside the notes, loaded pads are tinted, and
          it frames to the assigned notes). Both drive the **same note-clip
          model**, so a beat is just notes. *Follow-ups: per-pad velocity/choke,
          a 16-step clip default.*


          **MIDI devices (note-transform pipeline).** A third device class on
          the note path, transforming notes *before* the instrument - the
          symmetric counterpart to an audio effect. Cataloged + schema-driven +
          per-track chain like audio effects; pure `(notes, range, ctx)`
          transforms run in the scheduler. **Octavator** and **arpeggiator** are
          both registered in `src/audio/midi/device/catalog.ts`. Design detail
          in the "MIDI effects (design)" context section; the chain-code
          duplication is ARCH-2.


          Deps: DAW-1.
        id: 019fae07-58b5-73d6-89f6-6d45b4f7dfc8
