      - ref: AGENT-11
        area: AGENT
        title: Interactive plan artifact + approval gate
        status: to-do
        sort_path: "000011"
        priority: 0
        deps:
          - AGENT-10
        body: >-
          *Deps: AGENT-10.*


          A living plan the agent drafts, the user approves, and the loop
          executes against.


          For anything bigger than a one-shot edit, the agent first drafts a
          plan from the prompt (intent, key/tempo/mood, instrumentation, a
          section-by-section arrangement, and the concrete actions it will
          take); the user reviews and edits it; the approved plan becomes
          **both** the spec the loop executes and the checklist it reflects
          against (does the render match the key, is the arrangement too dense,
          is loudness in range).


          This doubles as the **human-in-the-loop gate** - approval before the
          agent starts mutating the project, especially for destructive ops.


          Strongly on-thesis: a plan is structured, diffable, commit-able data,
          so it rides the same history/notes machinery as edits (AGENT-3) - pin
          the approved plan as an artifact, mark steps done as the loop
          proceeds, and the version timeline reads as intent -> plan -> edits.


          Decomposes directly into existing `dispatch`/MCP tool calls; no new
          engine surface, mostly panel UX plus a plan schema.


          Related open decision: whether agent edits ever gate behind a propose
          / preview / accept step, or always land-then-undo (the current model).
          See the "Open decisions" context section.
        id: 019fae0b-03d4-712a-8515-cd0287d5759e
        created_at: 2026-07-29T13:23:05.300Z
