      - ref: AGENT-12
        area: AGENT
        title: Auto-generated version summaries
        status: to-do
        sort_path: "000012"
        priority: 0
        deps:
          - AGENT-2
          - AGENT-3
        body: >-
          *Deps: AGENT-2.*


          The agent writes the commit message the user won't.


          Plain-language version summaries are already called an "AI superpower"
          in the versioning design, and AGENT-3 (done) shipped the commit-notes
          machinery they attach to - this ticket fills the gap between them.


          On a save/commit the agent summarises what changed in plain language
          ("36 tracks: 12 audio, 24 instrument"; "added a breakdown, widened the
          pad"), **tiered by importance**: a minor save gets a one-line note,
          the day's last (or a larger) save gets a fuller summary.


          It sits in the **librarian** tier of AGENT-8 (it describes, it does
          not author), and it is the most specific unprompted user request found
          in the research - an Ableton user asks for commit metadata, then
          immediately says he will not write it himself. See `docs/RESEARCH.md`
          section 7.
        id: 019fae0b-1a0d-71cb-8ec9-d90f9f2c61a5
        created_at: 2026-07-29T13:23:10.989Z
        updated_at: 2026-07-29T16:01:06.935Z
      - ref: AGENT-13
        area: AGENT
        title: "Blank page: where do I start"
        status: to-do
        sort_path: "000013"
        priority: 0
        deps:
          - AGENT-2
          - AGENT-8
        body: >-
          *Deps: AGENT-2.*


          Beat the blank page - the librarian's flagship job. The **#1 reported
          struggle at 19%** (roughly 2.3x the next item), and the agent's
          strongest *evidenced* use case.


          On an empty (or stuck) project the agent scaffolds a starting point -
          picks and configures instruments, lays out a few tracks, suggests a
          direction or a groove - so the user has something to react to instead
          of silence.


          Crucially this is the **librarian** framing, not the co-author
          framing: it sets things up, it does not write your music, so it lives
          squarely in AGENT-8's librarian tier. The clearest strategic
          recommendation in the research is to **lead with the librarian** and
          let authorship be something users discover, which makes this the tip
          of that spear.


          See `docs/RESEARCH.md` section 7 (and the librarian in section 4).
          (Promoted from a research proposal originally numbered AGENT-10, which
          is now the agentic loop.)
        id: 019fae0b-316e-757c-a1f1-ab6417ec07cc
