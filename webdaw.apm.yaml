      - ref: ARCH-1
        area: ARCH
        title: Split projectStore / state management
        status: to-do
        sort_path: "000001"
        priority: 0
        body: >-
          `projectStore.ts` has grown oversized (the repo conventions already
          flag it as a file to chip away at, alongside `AudioEngine.ts` and
          `ArrangementTimeline.tsx`).


          To be clear on one question that comes up: it has **not** moved
          server-side - the sync service persists project *data* through the
          storage seam, but the in-memory `ProjectStore` (tracks / params /
          clips plus the mutators the reducers call) stays client-side and is
          the app's central store.


          Two ways to tame it, both keeping the `dispatch` / edit-log seam
          intact:


          (a) **split into focused sub-stores** by responsibility (tracks,
          transport, selection, devices, ...) behind the same seam; or

          (b) **adopt a store library (zustand)** for selectors + fine-grained
          subscriptions, shrinking the bespoke wiring and re-render surface.


          Prefer whichever keeps the reducers / `applyEdit` boundary unchanged
          so persistence and history are unaffected.


          Sibling concern: AGENT-19 chips away at the oversized `AudioEngine.ts`
          by extracting a shared graph builder.
        id: 019fae0d-20f3-7238-8e12-40ca9b89b01f
        created_at: 2026-07-29T13:25:23.827Z
        updated_at: 2026-07-29T13:25:23.827Z
      - ref: ARCH-2
        area: ARCH
        title: Share MIDI and audio device-chain code
        status: planning
        sort_path: "000002"
        priority: 0
        deps:
          - INST-1
          - INST-2
        body: >-
          The MIDI device chain (the note-transform pipeline for the arpeggiator
          / octavator) looks to **duplicate parts of the audio effect-chain
          code**: an ordered chain of devices with add / remove / reorder,
          per-device param stores, and host-addressing are common to both.


          Investigate a shared **"device chain"** abstraction the two families
          reuse - the chain container, ordering, and param plumbing are likely
          the shared core; only the payload differs (a note transform vs an
          audio node).


          Would cut the duplication and keep the two device families consistent
          (one place to fix a chain bug, one addressing scheme).


          Needs a look at the MIDI-device (`src/audio/midi/device/`) and
          effect-chain code to confirm the shared surface before committing to
          the abstraction.
        id: 019fae0d-3a4a-727a-8d2a-2be55efb30f7
        created_at: 2026-07-29T13:25:30.314Z
        updated_at: 2026-07-29T16:00:50.188Z
      - ref: COLLAB-1
        area: COLLAB
        title: Real identity on the log
        status: done
        sort_path: "000001"
        priority: 0
        deps:
          - HOST-2
        body: >-
          *Deps: HOST-2.*


          **Authorship colour model - a projection of the log, not a stored
          field.** The keystone already stamps every edit with its author (that
          is how the two-voice colouring works), so "who last touched this
          clip/track/param" is a *query over the command log* and the colour is
          a *view*, never a property saved on the object. This composes with
          versioning for free (the overlay at any commit is just the log up to
          that point) and needs no format change.


          **Done:** per-user identity on the log plus perspective-relative
          colours have shipped (slices 73-75, 80 - see HOST-2 for the slice
          detail). `author` generalised from a 3-role enum to a bounded free
          string (`claude`/`agent` reserved AI voices, `you` the default; any
          other value a human user id). Colour is **perspective-relative**:
          `colorForAuthor(author, config, self)` paints the viewer's OWN edits
          with the teal "you" hue (whoever they are) and every collaborator in
          their own stable hashed hue; `agent`/`claude` stay absolute voices.
          The Authors settings tab lists collaborators seen in the feed, each
          with its own swatch picker.


          **One view this unlocks: historical blame** - a toggleable git-blame
          overlay tinting objects by last author, off by default (a permanent
          border on everything is noise), decaying or on-demand so the
          arrangement stays readable. The ephemeral *live-presence* view is
          COLLAB-2.


          **Open question - role vs identity are two axes.** Today's colours
          encode *role* (you / agent / claude); multi-user adds an *identity*
          axis (an open set of people). An option is to keep the
          teal/violet/coral accents for role and assign each human a stable hue
          (hashed id into a curated palette) for presence/blame, defaulting the
          overlay to track/clip granularity and drilling to note/param on demand
          so a busy piano roll does not turn to confetti.


          Note the `dispatch` seam audit this implies: building the blame
          overlay forces a check that *every* mutation flows through `dispatch`
          - anything poking `ProjectStore` directly is invisible to the log and
          would be invisible to any future sync. Finding those holes offline is
          far cheaper than debugging them later as merge desyncs.
        id: 019fae0c-1ac2-70cf-9f2e-02870bcd4b5f
        created_at: 2026-07-29T13:24:16.706Z
        updated_at: 2026-07-29T16:00:50.994Z
      - ref: COLLAB-2
        area: COLLAB
        title: Presence and live cursors
        status: to-do
        sort_path: "000002"
        priority: 0
        deps:
          - COLLAB-1
          - HOST-1
        body: >-
          **Live presence - an ephemeral per-person hue on a cursor /
          selection.** Showing what someone is touching *now* (the Figma /
          Google-Docs experience, where most of the "easy to follow who's doing
          what" value lives).


          It carries no document state, so a bug can flicker a cursor but never
          corrupt a project - which is why it is the natural first networked
          step. It also validates the transport + identity plumbing before any
          data rides on them. Presence needs none of the concurrency machinery:
          who-is-online + cursors is a small ephemeral broadcast over the same
          channel, never persisted (it lives in the room instance's memory / a
          pub-sub bus).


          The **concurrency model for shared editing is already decided and
          largely built** - see HOST-1: server-authoritative total order +
          optimistic apply + rebase, LWW by `seq`, not OT and not CRDT. The
          rationale, the library/lock-in survey, and the scaling analysis are
          recorded in the "Collaboration - options and rationale" context
          section.


          **Remaining for shared editing after presence:** per-user undo (undo
          *my* edits, not everyone's), and the explicit drop-or-resurrect rule
          for an op referencing something another user just deleted.


          Deps: COLLAB-1, HOST-1.
        id: 019fae0c-3a96-705e-b07b-5500904a988a
        created_at: 2026-07-29T13:24:24.854Z
        updated_at: 2026-07-29T16:00:51.951Z
      - ref: COLLAB-3
        area: COLLAB
        title: Comments and review flow
        status: to-do
        sort_path: "000003"
        priority: 0
        deps:
          - COLLAB-2
          - HOST-6
        body: >-
          A candidate collaboration surface: threaded comments anchored to
          objects (a clip, a track, a param, a point in time) plus a lightweight
          review flow over the commit DAG, so collaborators can discuss and sign
          off on changes rather than only editing them directly.


          Not designed in detail; captured as a follow-on once real identity
          (COLLAB-1) and live presence (COLLAB-2) are in place.


          Deps: COLLAB-2.
        id: 019fae0c-4ee3-71df-8b8d-d3b0de2a5ee6
        created_at: 2026-07-29T13:24:30.051Z
        updated_at: 2026-07-29T16:00:52.983Z
      - ref: DAW-1
        area: DAW
        title: Param-schema keystone and catalogs
        status: done
        sort_path: "000001"
        priority: 0
        body: >-
          The foundation everything else projects from.


          `src/audio/params/` - `ParamSchema` (a discriminated union of
          number/enum/boolean/sample specs), `ParamStore` (single source of
          truth: get/set/subscribe/snapshot/load, coerce + validate), and
          `binding.ts` (`ParamBinding`, `rampParam`, `bindParams` - the seam
          that keeps the store transport-agnostic, so native audio nodes can
          become worklets later).


          `src/audio/instruments/` and `src/audio/effects/` are each a pure,
          DOM-free `catalog.ts` (labels + schemas, so the Node MCP server
          type-checks without the DOM) plus a DOM `registry.ts` of factories.
          The catalogs and factory tables are Map-backed registries -
          `registerInstrument({ type, label, family, schema })` +
          `registerInstrumentFactory(type, factory)` and the effect equivalents
          - with built-ins self-registering at module load, so adding a device
          needs no edit to any central object or switch. Consumers iterate
          `instrumentInfos()` / `effectInfos()` and test membership with
          `hasInstrument()` / `hasEffect()`.
        id: 019fae00-b1f5-746d-bdc0-146f0b9ea3c6
        created_at: 2026-07-29T13:11:48.981Z
        updated_at: 2026-07-29T13:11:48.981Z
      - ref: DAW-2
        area: DAW
        title: Tracks, groups, mixer
        status: done
        sort_path: "000002"
        priority: 0
        deps:
          - DAW-1
        body: >-
          The structural top: `src/audio/project/projectStore.ts` - the project
          as a **tree of buses**, not a flat list. Every track is born into a
          group; a group is structurally a track-of-tracks with its own gain and
          effect chain, so solo/mute/volume/automation/FX all work at the group
          level and groups are MCP-addressable like tracks.


          Grouping later simplified from per-instrument-family groups (the old
          "librarian" filing) to a **single default `main` group** every new
          track files into (slice 54); manual grouping via drag is a follow-on
          in the DAW-8 batch.


          A track can also be created with **no instrument yet** and assigned
          one later (slice 55): the engine gained a hidden `none` sentinel
          instrument (`Silent.ts` - empty schema, silent factory, excluded from
          the library/search/MCP palette via a `hidden` flag), and a
          `setInstrument` command rebuilds the track's ParamStore from the new
          schema (shared param ids carry over) while keeping
          clips/placements/effects; the engine reconcile diffs
          `TrackNode.instrumentType` and swaps the node when it changes.


          Mixer controls shipped: track + group headers carry an adjoined
          Mute/Solo group (solo is a per-track/group flag; the engine silences
          anything not solo-active - `engine/mix.ts`) and a low-profile fader (a
          line with a triangle ticker; `ui/MixerControls.tsx`). The pending live
          level meter + input monitoring live in **DAW-8.5**.
        id: 019fae00-cdc6-7490-a5f5-5ffce48963c5
        created_at: 2026-07-29T13:11:56.102Z
        updated_at: 2026-07-29T16:02:45.346Z
      - ref: DAW-3
        area: DAW
        title: Clips, variants, launch
        status: done
        sort_path: "000003"
        priority: 0
        deps:
          - DAW-2
        body: >-
          The clip model, arrived at over three slices.


          **Clip variants (slice 10, superseded).** An instrument track owned a
          stack of variants, each bundling clip notes + instrument params +
          effect chain, so switching morphed the devices too. "Try"/fork was
          non-destructive. Slice 13 superseded the variant *stack* with a
          track-level sound + a **pool of clips** (the v6 variant format
          migrates to it: one clip per variant, sound from the active variant).
          The fearless-iteration intent survives as the clip pool +
          non-destructive editing; "Try"/fork became duplicate (drag-loop /
          copy-paste).


          **Arrangement clip model (slice 13).** A track owns a **pool of
          clips** (each its own ClipStore) and an **arrangement of placements**
          `{clipId, startBeat, offset, length}` along time; the sound
          (instrument params + effect chain) is track-level, so a clip is just
          notes. The scheduler flattens placements into events and **tiles a
          clip whose window outruns it** (drag-out loop); audio re-triggers per
          clip-length. This rippled through the command vocabulary, MCP tools,
          and persistence.


          **Mode-less clip launching (slice 14).** A persisted per-track
          `launchedClipId` loops over the transport and **overrides** that
          track's placements, so a track can loop a clip without dragging it
          across the timeline. Launch from the clip rail (auto-starts the
          transport); the lane greys with a "now playing" badge and the
          arrangement header shows a **Clip mode / Back to timeline** control.
          The scheduler treats a launched clip as one full-region placement
          (reusing the loop tiling); the state flows through the same
          dispatch/MCP seam (`launch_clip` / `stop_all_clips`), so it is
          undoable, in the feed, two-voice, and saved - no separate Session
          mode/view, just a visible override state. Same slice added clip
          copy/paste in the rail: a `pasteClip` command carries kind-tagged clip
          content through a module clipboard, so clips copy within a track and
          **across same-kind tracks** (audio reuses the source OPFS file;
          cross-type paste is refused).


          **Remaining in this theme:** the optional multi-track **Session grid
          view** + scenes on the same launched-clip model (each track a column
          of its clips, scenes launching a row across tracks). One model, two
          views - a view, not a model change.


          Deps: DAW-2.
        id: 019fae02-e437-74ac-8464-f94bd7bcaf7a
        created_at: 2026-07-29T13:14:12.919Z
