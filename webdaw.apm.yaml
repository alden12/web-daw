      - ref: DAW-8.3
        area: DAW
        title: Per-track timeline row height
        status: to-do
        sort_path: "000008.000003"
        priority: 0
        parent: DAW-8
        deps:
          - DAW-4
        body: >-
          Confirmed **per-track** (each lane its own height + bottom-edge
          handle, persisted by track id), not a uniform lane height.


          Not a plain `ResizeHandle` reuse: the arrangement bakes a fixed
          `ROW_PX` into its lane layout (`contentH = RULER_H + rows.length *
          ROW_PX`), placement offsets, playhead, and ruler math, so variable row
          heights ripple through all of that. **[foundational]**


          **Resize handles: keep `ResizeHandle`, don't build a heavyweight
          `ResizableBox`.** The pointer-drag/axis/body-cursor primitive
          (`ResizeHandle`) is the right shared layer; what sits above it (where
          the size lives - grid offset vs flex child vs scroll-anchored divider
          - and persistence) genuinely differs per site, so one box would
          accrete props. Low-hanging cleanup instead: fold the arrangement
          header-column divider (still bespoke) onto `ResizeHandle`, and
          optionally extract a tiny `useResizable` hook pairing
          `usePersistentNumber` with the `clientPos - rect.left/top` math that
          repeats across the workbench handles.
        id: 019fae99-7b3f-760d-a0e9-7b1389e6774b
