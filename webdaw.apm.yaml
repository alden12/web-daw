      - ref: AGENT-4.4
        area: AGENT
        title: "Scoped render: a subset of tracks or a bar range"
        status: to-do
        sort_path: "000004.000004"
        priority: 0
        parent: AGENT-4
        deps:
          - AGENT-4.1
        body: >-
          `renderProjectOffline` currently renders the whole arrangement and
          full mix. Add `RenderOptions` for a **track subset** (solo one or a
          few - dry, or through their group/master bus) and a **bar/beat
          window**, and expose them as optional `analyze_mix` args.


          So on a large project the agent renders only what a question needs
          ("is `track_3` clipping?", "how do bars 33-48 sound?") instead of the
          whole song - cheaper and more targeted.


          **Edges to handle:** a note starting before the window but still
          sounding, and effect tails bleeding in from earlier.
        id: 019fae9a-37fd-759d-8305-d572974058e4
        created_at: 2026-07-29T15:59:30.301Z
        updated_at: 2026-07-29T15:59:30.301Z
      - ref: AGENT-4.5
        area: AGENT
        title: Unify the live and offline graph build
        status: to-do
        sort_path: "000004.000005"
        priority: 0
        parent: AGENT-4
        deps:
          - AGENT-4.1
          - ARCH-1
        body: >-
          The DSP is already shared (one set of factories drives both live and
          offline), but the wiring *around* it is duplicated in three places:


          1. **Per-track routing** - `renderProjectOffline`'s `connectChain`
          mirrors `AudioEngine.reconcile`'s `rewireChain` + `parentInput`.

          2. **The master bus + limiter** - the same magic numbers in two spots.

          3. **Note flattening** - `flattenTrackNotes` vs `Scheduler.tick`'s
          placement -> notes pass.


          **Extract the two cheap ones first:** a shared pure
          `flattenArrangement(track, range)` and a `createMasterBus(ctx)`
          helper.


          **The real work** is a graph builder parameterized by
          `BaseAudioContext` that both the live (incremental) `reconcile` and
          the offline (one-shot) render drive, so routing + limiter config
          cannot diverge - and it chips away at the oversized `AudioEngine.ts`
          (see ARCH-1's sibling concern).


          Its own focused engine slice, not folded into a feature.
        id: 019fae9a-4a66-7268-a1b1-98a2ea312a37
        created_at: 2026-07-29T15:59:35.014Z
        updated_at: 2026-07-29T16:01:10.191Z
      - ref: AGENT-4.6
        area: AGENT
        title: Expose analyze_mix over MCP via the bridge
        status: to-do
        sort_path: "000004.000006"
        priority: 0
        parent: AGENT-4
        deps:
          - AGENT-1
          - AGENT-4.1
        body: >-
          `analyze_mix` is registered only in the in-app `createAgentTools`; the
          Node MCP server is DOM-free and its tools are registered separately,
          so external clients (Claude Code / Desktop) cannot call it yet.


          Add an MCP tool + a bridge handler that forwards to the live tab,
          where `renderProjectOffline` + analyze run and return the `MixSummary`
          (plain JSON, crosses the wire fine) - the same round-trip every MCP
          edit already uses.


          Needs a live tab open (Web Audio is browser-only); a tab-less
          server-side render is the separate deferred epic (portable DSP core,
          pairs with HOST-7).
        id: 019fae9a-59a3-713a-b53a-440da3551755
        created_at: 2026-07-29T15:59:38.915Z
        updated_at: 2026-07-29T16:01:10.853Z
      - ref: AGENT-4.7
        area: AGENT
        title: "Render fidelity: match the live output"
        status: review
        sort_path: "000004.000007"
        priority: 0
        parent: AGENT-4
        deps:
          - AGENT-4.1
        body: >-
          Closed the deliberate v1 gaps so `renderProjectOffline` is faithful to
          playback, so `analyze_mix` measures what the user hears (slice-91):


          - Renders **audio tracks** (pre-decodes clip buffers, schedules the
          audio-clip loop regions via `audioPlayWindow` like the scheduler).

          - Routes notes through each track's **MIDI-device chain** via an
          offline transport clock (arps / octavators self-schedule from it, so
          they render exactly as live).

          - Applies **groove**.


          The region plays once, which IS the arrangement (live just loops it).
          Samples already pre-decode (AGENT-4.1).


          Status: built and working, in an open PR, not yet on `main`.
        id: 019fae9a-6819-768a-b897-03124af1720a
        created_at: 2026-07-29T15:59:42.617Z
        updated_at: 2026-07-29T15:59:42.617Z
      - ref: AGENT-5
        area: AGENT
        title: "Play-an-idea: notes as a prompt"
        status: to-do
        sort_path: "000005"
        priority: 0
        deps:
          - AGENT-2
          - DAW-6
        body: >-
          The DAW's native language is notes, so let the user *perform* a short
          MIDI phrase and attach it to a message rather than describe it in
          words: "add this idea to the organ track", "make a breakdown that goes
          like this", "harmonize this", "continue this for 8 bars".


          The agent already speaks this vocabulary (`addNotes`/`editNotes`,
          pitches + beats), so an attached phrase is structured input it can
          transpose to key, quantize, harmonize, voice as chords, or place as a
          new clip/section, then narrate the why in the feed.


          **Capture paths:** an **idea/scratch capture** in the agent panel
          (arm, then play the on-screen keyboard or a Web MIDI device into a
          scratch buffer), or select existing notes / a clip and **"send to
          agent"**. A lightweight version already works over MCP: play into a
          scratch clip, then ask Claude to read it (`list_notes`) and act.


          This pairs with the agent's **ears** (AGENT-4) as the mirror image:
          notes-in as the prompt, audio-analysis-out as the feedback, so the
          loop becomes play-an-idea -> agent develops it -> you hear it and keep
          or reject.


          On-thesis: it makes the keystone note vocabulary an input modality for
          the agent, reusing the exact shapes already flowing through
          `dispatch`/MCP. Especially strong on mobile (MOBILE-1), where
          describing intent beats precise touch editing.
        id: 019fae0a-2ed1-71ad-8a9b-71853a501a34
        created_at: 2026-07-29T13:22:10.769Z
        updated_at: 2026-07-29T16:01:00.794Z
      - ref: AGENT-6
        area: AGENT
        title: MCP/agent tool consolidation
        status: to-do
        sort_path: "000006"
        priority: 0
        deps:
          - AGENT-1
          - AGENT-2
        body: >-
          *Deps: AGENT-1, AGENT-2.*


          Converge on **one tool catalog + one dispatch**. Today the MCP server
          (`server/mcpServer.ts`) and the in-app agent
          (`src/audio/agent/tools/`) declare their tools *separately* - two sets
          of names + schemas + handlers.


          The **edit semantics are already shared** (both route through
          `dispatch` -> `applyEdit` and validate against the same catalogs), so
          the duplication is only in the tool *declarations*. They diverged
          because they execute in different processes: the agent calls the store
          directly in-browser, while MCP runs in Node and forwards each edit
          over the WS bridge to a live tab.


          **The consolidation** is a single declarative tool catalog (name +
          description + zod args + the `EditCommand` it produces) that
          *projects* to both surfaces - MCP registration (handler = forward over
          WS) and agent tool (handler = direct dispatch) - matching the
          param-schema keystone pattern.


          Non-trivial mainly because the **read paths** differ (MCP reads query
          the tab over the bridge; agent reads hit the local store
          synchronously) and the toolsets aren't strictly 1:1 today. A real
          refactor, not a quick change, but it removes a standing source of
          drift.


          **This converges with HOST-7** (MCP as a headless sync client):
          browser-agent and server-MCP become the same core - one tool catalog +
          `dispatch` -> `applyEdit` + a `SharedSession` - differing only in
          frontend (LLM loop vs stdio) and host (browser vs Node). It is also
          the seam AGENT-8's mode policy gates on.
        id: 019fae0a-5d9d-74b8-a5af-71b5fe9476af
        created_at: 2026-07-29T13:22:22.749Z
        updated_at: 2026-07-29T16:01:01.699Z
      - ref: AGENT-7
        area: AGENT
        title: zod validation of model responses
        status: review
        sort_path: "000007"
        priority: 0
        deps:
          - AGENT-2
        body: >-
          The provider layer (`src/audio/agent/provider.ts`) used to pull apart
          the model's HTTP response imperatively - `JSON.parse(raw)` then a
          chain of `(data as { choices?: unknown }).choices` casts and `typeof`
          guards to reach `finish_reason`, `usage`, and `tool_calls`.


          A model response is an **untrusted boundary** like any other (MCP
          inputs, loaded bundles), so `parseReply` now runs the payload through
          a zod `completionSchema.safeParse` - a clear message on a malformed
          reply instead of an `undefined`-shaped crash downstream.


          This matches the keystone rule: the tool-call `arguments` string is
          already validated against the tool's zod schema on dispatch, so
          validating the *envelope* the same way closes the last hand-parsed
          gap.


          **General rule: parsing any unknown/untrusted object shape uses zod**
          (`safeParse` at the edge, typed value inward), never `as`-cast +
          `typeof` ladders.


          Landed folded into AGENT-10, where the provider layer was already
          open. (The streamed-fragment parsing it also mentioned moves to
          AGENT-22, which introduces streaming.)


          Status: built and working, in an open PR, not yet on `main`.
        id: 019fae0a-7c2b-75b8-982a-ffa850d63fc3
        created_at: 2026-07-29T13:22:30.571Z
        updated_at: 2026-07-29T16:01:02.232Z
      - ref: AGENT-8
        area: AGENT
        title: "Agent modes: off / librarian / full"
        status: to-do
        sort_path: "000008"
        priority: 0
        deps:
          - AGENT-2
          - AGENT-6
        body: >-
          *Deps: AGENT-2.*


          A capability setting for **how much** the agent can do, not just
          whether it runs. Three modes:


          - **Off** - no agent at all: no calls, no background analysis. The DAW
          stands on its own as a plain DAW, for anyone who wants that.

          - **Librarian** - assist without authoring. The agent can create and
          configure instruments and effects, help with the mix, run analysis
          (its ears, AGENT-4), answer questions and scaffold a project, but it
          **cannot write musical content** (notes, clips, sections,
          arrangement). This is the research's evidenced use case, and a safe
          default that gives real help without the agent ever "writing your
          track for you". Blank-page (AGENT-13) and mixing-assist (AGENT-14)
          live here.

          - **Full** - the complete two-voice co-author: the agent may author
          musical content too, its edits landing coral through the same
          `dispatch` seam.


          **Implementation is a permission policy over the one tool catalog, not
          per-mode branching.** The agent drives the project through a single
          tool catalog dispatched over one seam (converging on AGENT-6); a mode
          is just which tool *categories* that seam admits - off = none;
          librarian = everything except the content-authoring writes (`addNotes`
          / `editNotes` / clip / section / arrangement); full = all.
          Keystone-friendly: modes stay data (a category tag per catalog entry +
          a policy), so a new tool inherits its gating for free.


          **Why it matters (evidence + a decided override).** It contradicts a
          current design stance - "the agent is never fully gone", with Produce
          mode collapsing it to a thin presence rail - and the only
          conditional-acceptance voice in the research corpus asks for exactly
          the opposite: *"as long as we can turn it off."* Off honours that;
          librarian answers the sceptic who wants help but not a co-author. Low
          cost (a setting + a catalog policy), direct evidence, so decide it
          deliberately rather than by default. (User-facing labels for the three
          modes are TBD; "librarian" is the research's term of art.) See
          `docs/RESEARCH.md` section 4.
        id: 019fae0a-a5eb-71a8-8976-2c50cf6ed383
        created_at: 2026-07-29T13:22:41.259Z
        updated_at: 2026-07-29T16:01:03.139Z
      - ref: AGENT-9
        area: AGENT
        title: Local-by-default provenance, strip authorship on export
        status: to-do
        sort_path: "000009"
        priority: 0
        deps:
          - AGENT-3
          - DAW-13
        body: >-
          *Deps: AGENT-3.*


          Keep the authorship trail a **working aid, never an evidence trail
          against the user.** AGENT-3 shipped, so the authored-edit log and
          agent-intent notes already exist; this ticket is about not weaponising
          them.


          The two-voice colour, AI cursor and activity feed are framed as trust
          features, but they are also a durable record of "AI touched this", and
          industry AI-labelling is standardising. Stance:


          - **Provenance is local by default and never exported.** Export /
          bounce / `.daw.zip` strips authorship and agent-intent metadata unless
          the user explicitly opts in. (This is the export path of DAW-13 - the
          strip happens where the mixdown leaves the app.)

          - Teal/coral is a **working** aid, not a permanent property of the
          artifact: it lives in your project, not in what you ship.

          - Any server-side or shared provenance stays explicit and opt-in.


          **Why (evidence + caveat).** A producer of 30 years had a demo
          **auto-rejected by a record label** for ticking "Did you use AI?" on a
          submission form, having used AI only for supplementary drum patterns.
          The evidence is n=1 and self-reported, but the mechanism is plausible
          and the fix is nearly free. See `docs/RESEARCH.md` section 4 (Hazard
          2: provenance is a liability).
        id: 019fae0a-c227-71ac-a2cf-d2b52473e28c
        created_at: 2026-07-29T13:22:48.487Z
        updated_at: 2026-07-29T16:01:04.139Z
      - ref: AGENT-10
        area: AGENT
        title: Agentic loop, run-until-done
        status: review
        sort_path: "000010"
        priority: 0
        deps:
          - AGENT-2
        body: >-
          *Deps: AGENT-2.*


          `runAgent` (`src/audio/agent/loop.ts`) was already a *run-until-done*
          ReAct loop (iterate up to `maxSteps`, run tool calls, feed results
          back, stop on a text-only reply or the cap) - the "call-and-response"
          framing was stale. This slice hardened it into a real agent loop along
          the two axes that were actually missing:


          1. **User interrupt** - an `AbortSignal` threads panel -> loop ->
          provider -> `fetch`; a **Stop** button cancels the in-flight request
          and the loop returns the work done so far (`stopped: true`) instead of
          throwing.

          2. **Legibility** - each act round (the model's narration + the tools
          it ran) is surfaced as an `AgentStep`, live via `onStep`, so the panel
          grows the think-act-observe trail as it unfolds (expanded while
          running, auto-collapsed to an "N steps" disclosure once finished).
          This is where the model's **interleaved thinking** becomes visible; it
          becomes *grounded* reflection once the loop can call the AGENT-4
          analysis tools on its own render.


          Also folded in AGENT-7 (zod-validate the response envelope).


          **This is the spine the other agent tickets hang off** - the ears
          (AGENT-4), play-an-idea (AGENT-5), and the plan artifact (AGENT-11)
          are all tools/inputs the loop drives.


          Kept a **single** agent loop - a composition-critic sub-agent is a
          later split only if one loop stops scaling. Token-by-token streaming
          is split out as AGENT-22.


          Status: built and working, in an open PR, not yet on `main`.
        id: 019fae0a-e417-73bb-bef2-0c2d8d949ee0
        created_at: 2026-07-29T13:22:57.175Z
        updated_at: 2026-07-29T16:01:04.995Z
      - ref: AGENT-10.1
        area: AGENT
        title: Streaming replies + reasoning capture
        status: to-do
        sort_path: "000010.000001"
        priority: 0
        parent: AGENT-10
        body: >-
          Swap the provider transport from a whole-body `response.text()` to
          **streaming SSE** (`stream: true`; parse `choices[].delta`, assembling
          tool-call `arguments` fragments by index, `finish_reason`, and
          trailing `usage`).


          A pure, heavily-tested SSE->reply assembler isolates the fragile part;
          the loop prefers a `chatStream` seam and feeds `onStep` live partial
          text, so **Stop becomes instant** (cancel the reader) and the trail
          types out as it arrives.


          Capture provider **reasoning** deltas where the OpenAI-compat surface
          exposes them (`reasoning_content`); full thinking-token capture on
          Anthropic/OpenAI may need their native endpoints - an honest limit,
          otherwise lean on the interleaved narration from AGENT-10.


          Throttle UI re-renders (rAF / N-char batches) so markdown does not
          re-parse per token.


          Per AGENT-7's general rule, the streamed-fragment parsing is
          zod-validated at the edge too.
        id: 019fae9a-9dbc-7468-84c9-0ca33d1d2266
