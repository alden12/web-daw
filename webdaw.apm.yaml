      - ref: DAW-4
        area: DAW
        title: Arrangement timeline
        status: done
        sort_path: "000004"
        priority: 0
        deps:
          - DAW-3
        body: >-
          The bottom timeline as an editable arrangement (slice 13 + follow-ups)
          - the third of the three "real DAW" pieces.


          Zoom + scroll (reusing the piano roll's beats<->px + ruler primitive
          in `src/ui/timeline/`), place / select / move / resize / split /
          delete placements, drag an empty lane to create a clip,
          copy-cut-paste, snap-to-grid, a bar/beat ruler owning the loop region,
          a sticky-header spreadsheet scroll, and inline rename of tracks /
          groups / clips. The top toolbar was removed in the same slice -
          transport moved to the arrangement header, undo/redo to the activity
          panel, the brand to the library.


          Follow-ups landed: clicking a lane drops a **paste marker**
          (copy/paste lands there), dragging a clip from the rail places it onto
          **any same-kind track** (copying it into that track's pool), a **"+"
          add-effect menu** at the end of the chain, and **Space** toggles the
          transport from anywhere.


          *Still pending in this theme (model-independent), now carried by the
          DAW-8 batch:* track reorder by drag, track-height resize, track
          colors, a richer visual summary of grouped tracks, split-at-playhead,
          and library drag-and-drop.


          Deps: DAW-3.
        id: 019fae03-02e5-734b-82fc-cc3d7b57c5c3
