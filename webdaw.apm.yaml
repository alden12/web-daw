      - ref: DAW-22
        area: DAW
        title: "Bug: clip playhead ignores arrangement position"
        status: to-do
        sort_path: "000022"
        priority: 0
        body: >-
          *Part of DAW-8. Formerly `DAW-8.9`.*


          The piano roll / step grid draw a playhead in the selected clip
          whenever the transport is playing, even when playing from the timeline
          and the global playhead hasn't reached (a placement of) this clip yet
          - so a clip that isn't sounding still shows a moving cursor.


          The clip playhead should track the arrangement: only show (and only
          advance) while the transport is inside a placement of *this* clip,
          offset by where in the clip that placement is playing, and hidden
          otherwise.


          Today `PianoRoll` / `StepGrid` derive it straight from
          `scheduler.getPositionBeats() % clip.lengthBeats`, which assumes the
          clip is always the thing playing.
