        status: in-progress
        sort_path: "000015"
        priority: 0
        body: >-
          *Part of AGENT-4. Formerly `AGENT-4.1`. The tier-1 foundation the rest
          of the ears deps on.*


          Loudness / LUFS, spectral balance / masking, and clipping detection
          (e.g. Meyda). The first and most tractable tier: cheap, deterministic
          measures the agent can act on directly.


          **Shipped (slice-90):** the offline render (`renderProjectOffline`,
          reusing the exact instrument/effect factories + worklets, with samples
          pre-decoded) plus peak/headroom, RMS loudness, and clipping via the
          `analyze_mix` tool.


          **Remaining:** integrated LUFS and spectral balance / masking (the
          FFT-based measures).
