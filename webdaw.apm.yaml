        (storage refactor, no UI change); 15B commits & durable history +
        `.daw.zip` export/import; 15B-storage keyframe + delta commits.
        Follow-ons **15C** (branches - deferred indefinitely, see Open
        decisions), **15D** (a real disk folder via the File System Access API -
        still open), **15E** (remote sync / collaboration - became the whole
        HOST area). **15F** multi-project library + switcher landed as slice 52.


        **24-42, content and UI.** Patches (24); kebab context menus (26);
        metronome (27); live audio capture (28); record arm + into-track (29);
        recording UI polish (30); workbench signal-flow layout (31); audio
        waveform overview (32); audio clip beat grid + loop region (33); audio
        clip panel feedback (34); slide audio under the grid (35); the
        custom-DSP AudioWorklet framework + bitcrusher (36); audio bug batch
        (37); worklet instrument framework + wavetable synth (39); MIDI
        recording (40); adopt Prettier - repo-wide config, double quotes,
        `printWidth: 120`, `yarn format` + a CI format-check (41); UI bug batch
        (42).


        **50-58, the drum + synth arc and the editor spine.** Sampler instrument
        (50); sample library + local import (51); multi-project library +
        switcher (52); the VSCode-style spine - activity rail + in-panel chrome
        (53); project explorer tree (54); empty tracks + full-height rail (55);
        flagship synth Nimbus (56); patch bank + auditioning (57); drum machine
        - drumkit instrument + step grid (58).


        **63-70, the sync-service foundations.** Canonical shared project schema
        (63); contract-first API (64); the three code-level gaps closed (65);
        delta sync (66-67); document-schema drift detection (68); keyframe
        cadence (69); feed + edit-log unification (70).


        **71-82, multiplayer, auth, deploy, server history.** Room authority A1
        (71); client `SharedSession` A2 (72); per-user identity + colours A3a
        (73); per-surface tinting + perspective-relative colouring A3d (74);
        project name as project state A3b (75); reconnect gap-fill A3c (76);
        server-side principal Auth-A (77); browser login Auth-B (78);
        membership/sharing Auth-C (79); auth cleanup (80); first deploy on Fly +
        Neon (81); server-side keyframes + compaction, Phase B1 (82).


        **90-91, agent ears.** Offline render core + `analyze_mix` tier 1 (90);
        render fidelity - audio tracks, MIDI devices, groove (91).


        **In flight at migration time (2026-07-29):** the time-signature slices
        (DAW-10) on branch `slice-94-time-signature-denominator`.


        ## A note on "no legacy formats"


        Two eras, and the boundary matters:


        - **While projects were disposable local-only data:** don't carry legacy
        formats. Bump the snapshot/storage version freely; a format change
        simply discarded the old saved project. This is why several slices (e.g.
        70's `log.json` retirement, 75's dev-DB clear) took a one-time discard
        by explicit consent rather than writing transition code.

        - **Once projects are hosted server-side:** retired. We can no longer
        discard users' saved data, so **forward migration is required** - a pure
        `fromVersion -> fromVersion + 1` upcaster in
        `src/audio/project/documentMigration.ts` per project-document bump,
        chained by `ProjectRepository.load`; DB schema changes go through
        `drizzle-kit generate`. Still forward-only (no downgrades), just a
        continuous upgrade path.
