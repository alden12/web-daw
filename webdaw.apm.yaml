    items:
      - ref: AGENT-1
        area: AGENT
        title: MCP and Claude Desktop/Code control
        status: done
        sort_path: "000001"
        priority: 0
        deps:
          - DAW-1
          - DAW-7
        body: >-
          The shipped power-user surface: a Node MCP server (`server/`,
          `src/audio/mcp/`) lets Claude Desktop or Claude Code drive the DAW. It
          mirrors a `ProjectStore` and forwards validated, track-addressed edits
          to the browser over a WebSocket; the browser mirrors its own edits
          back. `protocol.ts` is a shared typed union so the two ends cannot
          drift. Edits land through the shared `dispatch` seam and are narrated
          in the activity feed.


          **This is the differentiator in miniature.** Whether the chat lives in
          Claude Desktop / Code over MCP (today) or the embedded panel
          (AGENT-2), the genuinely novel surface is the activity feed itself: a
          shared, two-voice timeline of the *edits* and the agent's *stated
          intent*, not a chat log. Treat Desktop/Code-over-MCP as a first-class
          *supported* workflow, not just a dev convenience - it is the best
          demo, costs nothing per token, and self-selects technical early
          adopters for the richest feedback.


          Its limits are exactly why the embedded panel still matters: two
          windows breaks creative flow, and MCP setup is a non-starter for a
          general user. So MCP-in-a-second-window is the prototype + power
          workflow; the embedded panel is the consumer shape; both ride the same
          `dispatch` seam and the same feed.


          **Transport - local now, remote later.** Today the MCP loop is
          entirely *local*: the Node MCP server runs on the user's own machine
          (started by their MCP client over stdio) and listens on
          `ws://localhost:8765`; the browser tab connects *out* to it. This
          keeps working after the web app is deployed - a hosted `https://` tab
          may still open `ws://localhost` (browsers treat localhost as a
          secure-context exception), so a user running the local server drives
          their open tab as before. Server-side / hosted MCP is HOST-7 (MCP as a
          headless sync client). Guard against the anti-pattern: a new
          per-feature HTTP write endpoint for MCP is a smell - reach for the WS
          authority + shared tool catalog instead.


          Deps: DAW-1, DAW-7.
        id: 019fae09-a863-728b-99f9-f5523276c05f
        created_at: 2026-07-29T13:21:36.356Z
        updated_at: 2026-07-29T16:00:57.925Z
      - ref: AGENT-2
        area: AGENT
        title: In-app agent panel
        status: review
        sort_path: "000002"
        priority: 0
        deps:
          - AGENT-1
        body: >-
          An embedded chat driving the model via a **client-side tool loop** + a
          thin, provider-agnostic **key-proxy**.


          The agent loop runs client-side - tool calls execute in the browser
          through the same `dispatch` seam (authored `claude`, coral in the
          feed). One shared tool catalog (zod -> JSON Schema) is intended to
          feed both the MCP server and the panel (AGENT-6 is that
          consolidation). The thin server is only a **key-proxy**: keep it
          **provider-agnostic** (an OpenAI-compatible base URL + model, so a
          free tier or a local model can drive tests; default Claude Sonnet),
          and keep the key **server-side only** - spend-capped, never
          `VITE_`-inlined into the client, with auth + rate-limiting before any
          non-localhost deploy.


          Claude Code / Desktop over MCP already covers this for the tinkerer at
          no per-token cost; the panel adds the embedded UX and the general
          "just open the app" user.


          Agent chat (`ChatTurn` via `src/ui/agentSessions.ts`) is
          `localStorage`-only and **global** (cross-project) today - see the
          "Sync service - deferred notes" context section for the persistence
          plan.


          Status: built and working, in an open PR, not yet on `main`.


          Deps: AGENT-1.
        id: 019fae09-c641-72af-9ad0-f578a85d135b
        created_at: 2026-07-29T13:21:44.001Z
        updated_at: 2026-07-29T16:00:58.886Z
      - ref: AGENT-3
        area: AGENT
        title: Persist agent intent into history
        status: done
        sort_path: "000003"
        priority: 0
        deps:
          - DAW-7
        body: >-
          The agent's intent notes (the `note` feed annotations) used to be
          session-only and vanished on reload. They now persist two ways, both
          mirroring how edit `entries` already work:


          1. The **working stream** rides along in the bundle as a parallel
          notes stream (and in the `.daw.zip` export), restored on load so the
          feed comes back.

          2. On commit, the **uncommitted notes are swept into the commit**
          (`Commit.notes`, by seq range), so the version timeline reads as a
          narrated changelog and an exported project is self-contained.


          A note alone never creates a commit (it is not an edit); it rides into
          the next real commit. Crucially notes stay **out of the replayable
          edit stream** - `materialize`/`applyEdit` never touch notes, so replay
          is still edits-only and exact. Autosave also subscribes to the edit
          log, so a note posted with no following edit is still saved. The
          Versions tab shows a commit's notes on expand (a coral count glyph
          when collapsed). No format-version bump: an absent notes file loads as
          `[]`.


          *(Later unified further - slice 70 folded notes and edits into one
          seq-ordered authored stream, a `kind:"note"` entry carrying its text
          on `command`. See DAW-7.)*


          Deps: DAW-7.
        id: 019fae09-e371-753a-b737-9fa738af11a4
        created_at: 2026-07-29T13:21:51.473Z
        updated_at: 2026-07-29T16:00:59.916Z
      - ref: AGENT-4
        area: AGENT
        title: Agent ears - offline audio analysis
        status: in-progress
        sort_path: "000004"
        priority: 0
        deps:
          - AGENT-2
        body: >-
          The agent reasons on symbolic data and cannot hear the output. Render
          offline (`OfflineAudioContext`) and expose **analysis tools** that
          mirror the `list_*` reads, built in three tiers of increasing
          sophistication. Closes the perception loop for mixing/arrangement;
          human auditioning still decides taste.


          The offline-render core (`renderProjectOffline`, reusing the exact
          instrument/effect factories + worklets) and the first analysis tier
          landed on slice-90. The sub-tickets AGENT-4.1 - AGENT-4.7 carry what
          remains; **AGENT-4.1 is the tier-1 foundation the others build on.**


          **Where it runs - client-side first.** Rendering the graph offline
          uses `OfflineAudioContext` in the browser, which reuses the *exact*
          DSP the user hears - no second engine to keep in sync (the shared-DSP
          thesis). The analysis math (LUFS, FFT, MIR) is pure `Float32Array`
          crunching via WASM libs (Meyda, essentia.js) that run in-browser fine.
          So tiers 1-2 live client-side, next to the in-app loop (AGENT-10); the
          MCP surface reaches them the same way it reaches every other tool -
          round-tripping to the live tab via the bridge, which does the render +
          analysis and returns top-line features.


          Node has no Web Audio and can't run the custom worklets, so an
          all-Node render would mean a second DSP implementation - exactly the
          divergence to avoid. A headless/server-side (tab-less) render only
          earns its keep when tab-less operation matters (pairs with HOST-7) and
          needs a portable DSP core first - a real epic, deferred. Python enters
          only at tier 3, where best-in-class perceptual models (CLAP, audio
          tagging) live; expose them as a remote `describe_sound` call rather
          than standing infra.


          **Shares the offline-render core with DAW-13 (audio export and
          mixdown)** - build the offline render once and both draw on it.
        id: 019fae0a-0f95-746b-90a5-2f06f65908cb
        created_at: 2026-07-29T13:22:02.773Z
        updated_at: 2026-07-29T16:01:59.926Z
      - ref: AGENT-4.1
        area: AGENT
        title: Objective DSP analysis
        status: in-progress
        sort_path: "000004.000001"
        priority: 0
        parent: AGENT-4
        body: >-
          *The tier-1 foundation the rest of the ears depend on.*


          Loudness / LUFS, spectral balance / masking, and clipping detection
          (e.g. Meyda). The first and most tractable tier: cheap, deterministic
          measures the agent can act on directly.


          **Shipped (slice-90):** the offline render (`renderProjectOffline`,
          reusing the exact instrument/effect factories + worklets, with samples
          pre-decoded) plus peak/headroom, RMS loudness, and clipping via the
          `analyze_mix` tool.


          **Remaining:** integrated LUFS and spectral balance / masking (the
          FFT-based measures).
        id: 019fae9a-174b-756d-9aa1-d3c1b6772de1
        created_at: 2026-07-29T15:59:21.931Z
        updated_at: 2026-07-29T15:59:21.931Z
