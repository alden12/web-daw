      - ref: AGENT-18
        area: AGENT
        title: "Scoped render: a subset of tracks or a bar range"
        status: to-do
        sort_path: "000018"
        priority: 0
        body: >-
          *Part of AGENT-4. Formerly `AGENT-4.4`. Deps: AGENT-15.*


          `renderProjectOffline` currently renders the whole arrangement and
          full mix. Add `RenderOptions` for a **track subset** (solo one or a
          few - dry, or through their group/master bus) and a **bar/beat
          window**, and expose them as optional `analyze_mix` args.


          So on a large project the agent renders only what a question needs
          ("is `track_3` clipping?", "how do bars 33-48 sound?") instead of the
          whole song - cheaper and more targeted.


          **Edges to handle:** a note starting before the window but still
          sounding, and effect tails bleeding in from earlier.
        id: 019fae0b-9079-76fb-b7f8-45423934c457
