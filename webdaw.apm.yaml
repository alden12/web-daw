      - ref: DAW-20
        area: DAW
        title: Timeline and clip editing gaps
        status: to-do
        sort_path: "000020"
        priority: 0
        body: >-
          *Part of DAW-8. Formerly `DAW-8.7`.*


          A set of arrangement / piano-roll interaction gaps and small features.
          Several are touch-shaped by design (see the mobile touch-and-pointer
          ticket): every new action wants a right-click menu *and* a
          tap-reachable equivalent.


          - **Drag placements between tracks.** Today `movePlacement` only
          changes `startBeat`, so a placed clip can move along its lane but not
          onto another track. Extend it (or add a cross-track move) so a MIDI /
          audio placement drags onto any same-kind track's lane, mirroring the
          existing rail-drop copy path.

          - **Split from a lane context menu.** Splitting is double-click-only
          today. Add a "Split here" item to a lane's right-click (and touch
          three-dots) menu, acting at the lane's selection marker. This needs
          **clicking a track to also drop the selection marker on it** (today a
          click only selects the track), so the marker is where the split lands.

          - **Clip layering / stacking (promote the overlap).** Overlapping
          placements on one lane already "just work"; make it an intended
          feature - MIDI / audio clips may stack on the same track, drawn
          **semi-transparent** so lower clips / notes / audio read through.
          Needs: a **replace-vs-stack prompt on clip drop**; **multi-select of
          tracks** (shift-click, plus a multi-select mode in the
          timeline-options menu for touch); and a **merge / combine-tracks**
          action (right-click / three-dots) that flattens the selected tracks'
          clips into one.

          - **Draw-to-length note creation.** A press-drag on the piano roll
          should place a note and set its length in one gesture (today a click
          adds a fixed-length note).

          - **Clip start / loop-start handle.** The roll has an end / length
          handle but no clip-start handle, so a placement's `offset` (where the
          clip starts) can't be moved off 0 from the UI. Add a start handle so
          the clip's start point is draggable.

          - **Don't auto-place a blank clip.** Creating a track / instrument
          should not drop an empty clip on the timeline; the pool clip exists,
          and the user drags it onto a lane intentionally.

          - **Context menus on clips + tracks.** Both the timeline and the panel
          give clips and tracks a right-click context menu, plus a **persistent
          three-dots (⋮) affordance** (not hover-only) so the same actions are
          reachable by touch.
