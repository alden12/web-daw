      - ref: INST-3
        area: INST
        title: Factory patches and sample library
        status: done
        sort_path: "000003"
        priority: 0
        deps:
          - INST-1
          - INST-2
        body: >-
          **Patches - instrument presets (slice 24).** Save an instrument
          track's sound - its instrument type, parameter values, and effect
          chain - as a named patch in the library tree, then add a new track
          from it like a built-in instrument. Patches are **global**
          (cross-project), so they live in localStorage
          (`src/audio/patches/library.ts`), not the project bundle. Applying one
          is a single authored `createTrackFromPatch` edit carrying pre-minted
          effect ids, so it is undoable, two-voice, and replay-deterministic;
          `ProjectStore.addTrackFromPatch` loads the values through the same
          coercing setters. **MCP patch tools** let the agent drive the library:
          `list_patches` / `save_patch` / `apply_patch` ride a
          `patchRequest`/`patchReply` RPC (the same shape as the history RPC,
          since patches live in the tab's localStorage).


          **Factory patch bank + auditioning (slice 57).** A shipped factory
          bank for Nimbus (`patches/factory.ts`, pure read-only data reusing the
          `Patch` shape) - categorized "inspired-by" presets (bass / lead / pad
          / keys / pluck / brass / fx) with original names, chorus bundled where
          apt; a unit test validates the whole bank against the schemas. Factory
          + saved patches appear in the Patches view, search, and **nested under
          their instrument** in the Instruments view (a collapsed-by-default
          disclosure with a count). **Clicking** an instrument/patch **applies
          it to the selected track** (audition in place) via an `applyPatch`
          edit - which mutates the existing ParamStore on a same-instrument
          apply so the engine's live bindings keep working, and replaces it on
          an instrument change - while a per-row **"+"** adds it as a new track.
          A `get_patch` MCP tool returns one patch's full params + effect chain,
          so the agent can inspect a sound or promote a user patch into the
          factory bank.


          **Built-in CC0 kit (slice 50).** A small kick/snare/hats/clap/rim/tom
          kit synthesized from scratch (`src/audio/samples/assets/generate.mjs`,
          unambiguously CC0) and bundled via Vite `?url`.


          **Sample library + local import (slice 51).** Imported samples get an
          **asset-record layer**, the lesson from how Unity/Godot/Git-LFS/Bazel
          separate identity from bytes from derived artifacts: a project-level
          `SampleAsset { id; name; contentHash; source? }` where the stable `id`
          (not the hash) is what a `sample` param references (`asset:<id>`), so
          trimming or re-encoding a sample never breaks references. The content
          hash is just the current bytes in the OPFS blob store (dedup +
          integrity); decoded buffers are a regenerable cache keyed by hash.
          Local import (Samples view + inline in the Sampler picker) stores the
          file, dedupes by hash, and adds an asset record; instruments resolve
          `asset:<id> -> hash` through a small `sampleRegistry` the engine syncs
          on reconcile. MCP `list_samples` reports built-ins + the project
          library; import is browser-only (Node can't read local files / hash /
          write OPFS).


          **Follow-ups:** **remote sample browsing** (Freesound CC0 et al via a
          same-origin proxy on the Node server - their media servers send no
          CORS headers and downloads need OAuth2; pulling a remote sample hashes
          + stores + records license/source); **waveform peaks + tags/search**
          over the library index; doing the OPFS bytes I/O + hashing + peak
          generation in a **Worker** (the AudioWorklet can't touch OPFS,
          `crypto.subtle.digest` is one-shot, `decodeAudioData` detaches its
          buffer); `navigator.storage.persist()` + a quota meter (OPFS is
          evicted LRU); and surfacing the **built-in kit as a "Built-in" group
          in the Samples view** (it currently lists only imported assets).


          Deps: INST-1.
        id: 019fae07-bf8f-71dd-97d7-ecb04e161f47
        created_at: 2026-07-29T13:19:31.215Z
        updated_at: 2026-07-29T16:00:44.037Z
      - ref: INST-4
        area: INST
        title: User-authored declarative DSP
        status: review
        sort_path: "000004"
        priority: 0
        body: >-
          **The direction in one line.** Make the **declarative primitive graph
          the primary instrument/effect format** (data, not code), cover as much
          as possible by **growing a curated primitive vocabulary**, and provide
          a **WASM escape hatch** for custom DSP that is still safe to share.
          **Never run untrusted AudioWorklets on the hosted platform** - raw
          worklets are for first-party DSP (via PR, reviewed) or local
          self-hosting only.


          **The maturity ladder (tiers)**, safe-but-limited to
          powerful-but-guarded:


          1. **Presets over rich instruments (params only).** The AI picks
          parameter values against existing schemas. No new format, works today
          over MCP. Safe, limited ceiling.

          2. **Declarative primitive graph (data). <- the layer we invest in.**
          An instrument/effect is a JSON graph of curated primitives
          (oscillators, noise, filters, envelopes, LFOs, shapers, mixers,
          samplers, plus our own DSP primitives) with connections and a derived
          param schema. The trusted engine instantiates it (native Web Audio
          nodes + our WASM/worklet primitives). Pure data: safe online with no
          sandbox, validatable with zod, shareable/persistable as-is (nothing to
          execute), and a natural fit for the param-schema keystone.

          3. **WASM custom DSP (the safe escape hatch).** For algorithms the
          vocabulary can't express, author custom DSP that compiles to a
          sandboxed WASM guest and appears as a primitive/leaf node in the
          graph. See INST-6 for the security reasoning.

          4. **Raw AudioWorklet (first-party / local only).** Genuinely exotic
          DSP needing worklet capabilities: authored by us via PR (reviewed,
          trusted) or run by a user on a locally-hosted instance. Never accepted
          as untrusted user-generated content on the hosted platform.


          **Why declarative is the keystone-fit composition layer.** The
          architecture treats the param schema as the keystone (UI, MCP,
          automation, persistence are projections). A JSON primitive graph fits
          exactly: introspectable data with first-class params, the AI emits
          structured data against a schema (which LLMs do well), and it
          persists/shares as pure data with **nothing to sandbox**. It also
          unifies local and online: first-party instruments can be expressed in
          the same format, so Claude-in-Claude-Code and online-Claude produce
          the same artifact; compiling a graph to a hand-written class becomes
          an optional performance path, not a separate feature.


          **Principle to adopt now (zero-cost).** Bias new DSP work this way
          today: **grow the reusable, composable primitive vocabulary rather
          than writing a one-off worklet per instrument, and keep DSP as pure,
          parameterized modules** (as `dsp/ladder`, `dsp/oscillators`,
          `dsp/wavetable` already are - thin realtime shells over pure DSP).
          Prefer general primitives that compose (a pitch shifter + a pitch
          detector + a scale quantizer) over special-purpose features (an
          "autotune node"), because the general ones recombine into many
          devices.


          **Adoption & sequencing.** Adopt the model as direction, but do not
          big-bang it:

          - **Prove with a vertical slice, not a rewrite:** build the graph
          runtime + schema + auto-UI and express one or two of the simplest
          existing instruments in it (Subtractive, FM - purely native nodes),
          validating format + UI projection + params + persistence + MCP end to
          end on real instruments. A declarative instrument is just another
          cataloged type whose factory is the graph interpreter, so the two
          systems coexist behind the `Instrument` interface.

          - **Grow demand-driven:** convert more instruments (and grow the
          vocabulary) only as the format earns it. Populate primitives from real
          instruments + Faust's stdlib, not a speculative list.

          - **Defer the heavy bits** (WASM/Faust pipeline, UI layout language,
          sandboxing) until the hosted platform and sharing are actually on the
          table.


          **Not recommended:** converting all instruments now. The current ones
          work; conversion is churn and regression risk with no user-facing
          benefit today; and Nimbus/wavetable need the WASM-primitive path
          regardless.


          Code lives in `src/audio/graph/` (types, zod schemas, the interpreter,
          `GraphMidiDevice`). Status: built and working, in an open PR, not yet
          on `main`.
        id: 019fae08-0604-778c-9969-16ce3b4f438e
        created_at: 2026-07-29T13:19:49.252Z
        updated_at: 2026-07-29T13:19:49.252Z
      - ref: INST-5
        area: INST
        title: Extension SDK for third-party devices
        status: to-do
        sort_path: "000005"
        priority: 0
        deps:
          - INST-4
        body: >-
          *Deps: INST-4.*


          The intended growth model is **extension, not modification**: people
          add instruments and effects without touching the core, so ownership of
          each piece is clear - the core stays a single-owner, dual-licensable
          unit; each extension is owned by its author under the license they
          choose. The catalogs + registries are already *the* single extension
          points, and because the parameter schema is the keystone, a registered
          instrument shows up in the UI, the MCP palette, automation, and
          persistence for free. Promoting the static catalogs to a
          **registration API is done** (see INST-1).


          **Carve out a small permissive SDK package** (e.g. `web-daw-sdk`,
          MIT/Apache) holding only the stable contract a plugin imports: the
          param-spec types, the `specToZod` derivation (`params/zod.ts`), the
          instrument/effect definition interfaces, and the pure-`Float32Array`
          worklet/DSP contract. Plugins depend on the SDK, not the AGPL core, so
          they are **not** forced to be AGPL - that is what keeps the ecosystem
          open (incl. closed or differently-licensed extensions) while the core
          stays protected. (Alternative: keep one repo and add a GPL linking
          exception scoped to the plugin interface; the SDK split is cleaner and
          forces a good boundary.) The SDK surface becomes the thing we promise
          not to break; everything behind it stays free to refactor.


          **Distribution tiers (how a user installs an extension).** The
          registration API is deliberately **loader-agnostic** - it only cares
          that something calls `registerInstrument`/`registerEffect` + the
          factory - so these are loading + trust layers on the same seam, not
          separate architectures. The shaping fact: an extension here is
          **executable JS** (+ optional AudioWorklet / Wasm), not a native
          binary, so for the dynamic tiers the hard part is *trust*, not the
          mechanics.

          - **In-code (build-time) - available now.** An npm package whose
          import makes the register calls; the bundler includes it. For
          self-hosters who build. No dynamic loading, no trust problem.

          - **By-name remote, version-pinned** (like a GH Actions `uses:`). A
          resolver maps name+version to an artifact (npm/CDN/own registry); the
          app `import()`s the ES module and calls `audioWorklet.addModule(url)`
          for DSP. Reuses the sha256 content-addressing already used for samples
          to pin/verify. Needs CORS/CSP config + the dynamic-load path.

          - **Store UI.** The above plus discovery and **curation** - and
          curation doubles as the trust model. The natural commercial surface.

          - **Drop-in folder (game-mod style).** Cleanest in the desktop/Tauri
          build (a real `plugins/` folder the shell loads). Possible in a
          browser tab via the File System Access API + dynamic import, with the
          same origin-trust caveat.


          Two properties of the current design help the dynamic tiers: the
          **data/code split** lets the server receive a plugin's *schema* (plain
          JSON) for param validation without running its code; and
          **schema-as-keystone** means the more behaviour lives in the
          declarative schema (and DSP in sandboxable Wasm), the harder the
          factory can be sandboxed.


          **The shell contract determines what is precluded - design it
          richly.** Because WASM matches worklets on DSP algorithms, the only
          things "no untrusted worklet" costs us are capabilities we choose not
          to expose through the trusted shell's fixed contract. So invest in a
          rich contract: **params in** (the schema); **musical/transport context
          in** (tempo, beat/bar position, time signature, sample rate, block
          time) so tempo-synced devices work; **note/event in**; **multi-channel
          audio in/out including a sidechain/keyed input**; a **bounded
          analysis/visualization out** region (meters, scopes, tuners, spectrum)
          the shell forwards to the trusted UI; and **control-rate signals +
          modulation routing** in the graph (analysis -> param, LFO -> param,
          envelope -> param), not just audio flow.


          What remains genuinely precluded from untrusted content (routes to
          PR/local): bespoke bidirectional UI protocols beyond the contract,
          exotic I/O, anything needing SharedArrayBuffer / threads /
          self-timing, and GPU/neural inference (inherent to the audio thread).
          These are plumbing, not sounds: any instrument or effect algorithm is
          expressible; an arbitrary plugin-with-its-own-runtime is not.


          **Custom UI: also declarative, a projection of the schema.** Three
          levels mirroring the DSP tiers:

          - **Auto-generated from the schema (default).** A user instrument
          declares its params (name, range, unit, kind, grouping, control-type
          hint) and the app renders a consistent, accessible panel
          automatically. Pure data - the same reason MCP, automation, and the AI
          can all see and drive the instrument. (Faust's own UI metadata maps
          straight onto this.)

          - **Declarative layout + a curated widget palette.** A layout
          description (sections, positions) referencing trusted widget types:
          knob, fader, XY pad, envelope editor, step sequencer, wavetable /
          scope / meter display. Live-data widgets bind to the **bounded
          analysis-out channel** from the shell contract.

          - **Arbitrary UI code: same policy as worklets.** Hand-written
          HTML/JS/canvas is untrusted code touching the DOM - out for
          hosted/shared instruments. Beyond safety, arbitrary UI would fracture
          the keystone: a custom panel could hide params from MCP/automation/the
          AI.


          Symmetry worth keeping: **DSP is a graph of curated primitives; UI is
          a layout of curated widgets; both bind to the same param schema; both
          are pure data; both grow by adding trusted building blocks.**
        id: 019fae08-8709-766c-a537-af39cd55e360
        created_at: 2026-07-29T13:20:22.281Z
        updated_at: 2026-07-29T16:00:44.890Z
      - ref: INST-6
        area: INST
        title: WASM DSP and Faust factory
        status: planning
        sort_path: "000006"
        priority: 0
        deps:
          - INST-5
        body: >-
          *Deps: INST-5.*


          **Security: why worklets are out (for sharing) and WASM is in** - the
          trust model in three parts:


          - **AudioWorklet is capability-reduced, not isolated.** Its global
          scope has no DOM, no network, no storage - so it can't directly
          exfiltrate or touch the page. But it still runs in *our* origin and
          likely *our* process, with a high-resolution sample clock (a
          side-channel / fingerprinting foothold), a realm shared across all
          processors on a context (prototype pollution / interference), a
          real-time thread it can busy-loop to DoS the whole mix, and a message
          port whose safety depends on our main-thread handling. Acceptable for
          self-authored personal code; unacceptable for one user's code running
          in another's browser.

          - **WASM is deny-by-default by design.** A module operates on its own
          bounds-checked linear memory - no pointers outside its own buffer, so
          it cannot reach the JS heap, DOM, storage, or other instruments. Zero
          ambient authority: it can only call the imports we inject.
          Architecture: a small **trusted worklet shell** (we author, audit
          once) instantiates the **untrusted WASM guest**, copies audio + params
          into its sandboxed memory and audio back out, and grants a minimal
          import set (math only; no message port, no clock, no
          SharedArrayBuffer). The user/AI writes only the guest, never the
          shell. That inversion (deny everything, grant a tiny explicit surface)
          is the "can't access anything by design" property.

          - **Residual risks WASM doesn't fix, and how we contain them.**
          CPU/DoS (a bad guest can still glitch audio) - run untrusted
          instruments on a **dedicated AudioContext**, route their output back
          into the mix, and watchdog the render, tearing the guest down on
          overrun/throw. Timing side-channels - **withhold the high-res clock
          and SharedArrayBuffer** from the guest. Net: WASM makes data access
          safe by construction; isolation + watchdog handle CPU; withheld
          imports handle timing.


          **Faust: the factory and compile target, not the user-facing format.**
          The declarative graph (INST-4 tier 2) and Faust (a mature functional
          DSP language compiling to WASM) are different layers, easy to
          conflate:

          - **Keep our own declarative format** as the
          composition/sharing/keystone layer. It is data (shareable with nothing
          to sandbox), introspectable, param-schema-native, and gives us control
          over UX, automation, and how instruments compose - none of which a
          compiled Faust blob offers (params bolt on via metadata; it is opaque
          code, one monolithic WASM per instrument, a parallel runtime to our
          node graphs).

          - **Lean on Faust as the primitive factory.** Rather than hand-writing
          each custom primitive (ladder filter, reverb, pitch-shifter) as a
          bespoke worklet, author them in Faust and compile to WASM primitives
          that slot into the vocabulary. Faust's standard library already holds
          a huge, battle-tested catalog (filters incl. Moog ladder / SVF,
          oscillators, reverbs, physical models, effects), so this fills the
          vocabulary far faster and safer than bespoke worklets, without users
          ever seeing Faust.

          - **Faust is also the natural tier-3 compile target** for user/AI
          custom DSP: a constrained DSP language (it can't even express I/O - a
          safety layer above the WASM sandbox) that LLMs write competently.
          Compile server-side in a hardened build sandbox to a validated
          `.wasm`; clients only download and run the finished module.

          - Option to revisit later: compiling our graph format down to Faust
          (one WASM runtime, two authoring levels) unifies the runtime but
          couples the simple path to the compiler and loses the native-node /
          pure-data-no-compile properties. Deferred; the hybrid (native nodes +
          WASM primitives, our own format) is the current lean.


          **Worked example: autotune.** Autotune = pitch detection +
          snap-to-scale + pitch shifting. None of these are native Web Audio
          nodes, so it is **not** expressible in a native-only graph. It **is**
          expressible once the vocabulary includes three reusable primitives: a
          **pitch detector** (autocorrelation / YIN or FFT) emitting a
          control-rate f0; a **scale/pitch quantizer** (control-rate: detected
          pitch + key/scale + retune-speed -> target shift); and a **pitch
          shifter** (phase vocoder or PSOLA). Wired: input -> pitch-detect ->
          quantize(key, scale, speed) -> pitch-shift(amount) -> output, with
          params for key, scale, retune speed, and mix. This needs the
          control-rate connections above, and it is the poster child for the
          principle: those same three primitives also compose into a harmonizer,
          an octaver, formant correction, and a vocoder - so we add capabilities
          that recombine, not a bespoke autotune device. Each primitive is a
          WASM leaf (Faust-authored), safe to ship and share.


          **Status:** direction and options, not committed scope; deferred until
          the hosted platform and user libraries exist.
        id: 019fae08-d78c-7382-be06-aace3907a535
        created_at: 2026-07-29T13:20:42.892Z
        updated_at: 2026-07-29T16:00:45.888Z
      - ref: INST-7
        area: INST
        title: Audio pitch and time
        status: to-do
        sort_path: "000007"
        priority: 0
        deps:
          - DAW-6
        body: >-
          Its own slice, and a harder one. Two capabilities:


          (a) **Pitch-shift** - change a clip's key while keeping its speed.

          (b) **Time-stretch** - change speed while keeping pitch (also the
          basis for warp / tempo-following audio).


          Web Audio's `playbackRate`/`detune` couple the two, so both need a
          real pitch/time algorithm (phase vocoder / WSOLA).


          **Pragmatic path:** integrate a JS/WASM library (SoundTouch.js for a
          first cut; signalsmith-stretch / Rubber Band for quality), run it
          **offline** over the decoded buffer to produce a derived buffer cached
          by `(fileId, semitones, ratio)`, and point the clip at it; a ±semitone
          + tempo-ratio control on the clip.


          Realtime worklet shifting + Ableton-style **warp markers** (align
          transients to the grid) build on this later. Full DSP via AudioWorklet
          is already in place (INST-1), which is what makes sample-accurate
          audio work tractable.


          Keep the **shifter core as a swappable node** (a quality JS/WASM
          stretch lib, or Faust) behind our effect interface if CPU/quality
          demands it.
        id: 019fae08-fe5d-70a5-a910-3850c50b3c7a
        created_at: 2026-07-29T13:20:52.829Z
        updated_at: 2026-07-29T16:00:46.808Z
      - ref: INST-8
        area: INST
        title: Autotune / pitch correction
        status: planning
        sort_path: "000008"
        priority: 0
        deps:
          - DAW-12
          - INST-7
        body: >-
          *A follow-on to INST-7 (audio pitch and time). Pairs with DAW-12
          (project key/scale).*


          Detect a recorded vocal's fundamental-frequency (f0) contour and remap
          it toward the nearest scale note. This is the **same shifting engine**
          as clip pitch-shift, driven by a *dynamic, time-varying* shift ratio
          (`target note / detected f0`) instead of one constant ±semitone - so
          do clip pitch-shift first and autotune becomes a layer on top, not a
          from-scratch build.


          The added layers are the JS-friendly, Claude-fluent parts:

          1. **Pitch detection** - YIN/autocorrelation over `Float32Array`
          (offline; go further with pYIN + Viterbi smoothing for a clean track;
          unit-testable with synthetic tones).

          2. **Musical control** - snap to scale/key with a retune *amount* and
          *speed* (slow natural correction vs hard-snap), reusing the planned
          project key/scale work (DAW-12).


          Frame it as an **offline clip processor** (recorded clip in ->
          corrected clip out via `OfflineAudioContext` + the sample store), like
          audio pitch & time; a realtime worklet effect is much harder and a
          later step.


          **Engine caveats vs constant pitch-shift:** autotune needs an engine
          supporting a **time-varying** ratio (phase vocoder with per-frame
          ratio, or pitch-synchronous PSOLA - a plain stretch-then-resample only
          does a constant ratio), and **formant preservation** matters far more
          for a voice; caching is by `(fileId, settings-hash)` since the result
          is content-derived, not a tiny param key.


          **Faust note:** it does *not* meaningfully ease this - detection and
          the musical layer are awkward in Faust and fluent in JS, and its stock
          `ef.transpose` shifter is the artifacty, non-formant-preserving kind.
          Build detection + control in JS.


          See also INST-6's worked example: in the declarative-graph world
          autotune decomposes into three reusable primitives (pitch detector,
          scale quantizer, pitch shifter) that also compose into a harmonizer,
          an octaver, formant correction, and a vocoder.
        id: 019fae09-25ec-757e-aca6-04e708fdceda
        created_at: 2026-07-29T13:21:02.956Z
        updated_at: 2026-07-29T16:00:47.314Z
      - ref: INST-9
        area: INST
        title: Drum-kit sourcing and synthesized voices
        status: to-do
        sort_path: "000009"
        priority: 0
        deps:
          - INST-1
          - INST-3
        body: >-
          Two complementary paths, not either/or. The Sampler + the `drumkit`
          instrument (INST-1) are the shared substrate for the sampled path.


          **Synthesized classic voices (preferred for
          808/909/707/606/LinnDrum).** The analog machines are very
          synthesizable (sine + pitch-drop kick; noise + bandpass snare/hats),
          so model each voice as a schema-driven instrument in the
          catalog/registry rather than shipping static WAVs. This fits the
          parameter-schema keystone (tunable + automatable + MCP-drivable for
          free), reuses the synth engine, and **sidesteps sample licensing
          entirely** - the legendary Roland recordings have murky rights.


          **Sampled kits via the Sampler instrument, for acoustic / character
          kits.** The constraint for a (possibly distributed) web app is a
          license permitting **redistribution inside software**, not just "free
          to use in your music": prioritize **CC0** (public domain, zero
          friction) then **CC-BY** (keep a CREDITS file); avoid CC-BY-NC and
          "royalty-free for music only" packs. Verify the actual license text
          per pack before bundling - terms drift. Curate small for the web (one
          velocity layer per voice; OPFS content-addressed storage already
          exists).


          Clean, openly-licensed sources to lean on: **DrumGizmo** kits (Black
          Pearl / MuldjordKit / Crocell, CC-BY-SA / some CC0; full
          multi-velocity acoustic), **AVLDrumkits** (same lineage), **Salamander
          Drumkit** (CC-BY), **Hydrogen** drumkits (GPL/CC, incl. some
          electronic kits), **Freesound** filtered to CC0, and the **TidalCycles
          Dirt-Samples** one-shot collection (GitHub; mixed licensing, check per
          folder).


          Also deferred here: the **per-track groove override** (pairs with the
          drum machine, where "swing the hats not the kick" matters) and groove
          **extraction** (analyze a clip's deviations into a template).
        id: 019fae09-4e84-7231-8f24-338bced8717c
        created_at: 2026-07-29T13:21:13.348Z
        updated_at: 2026-07-29T16:00:48.223Z
      - ref: INST-10
        area: INST
        title: In-app IDE and user-authored components
        status: planning
        sort_path: "000010"
        priority: 0
        deps:
          - INST-5
        body: >-
          An embedded editor (Monaco / CodeMirror) for **custom
          instruments/effects via AudioWorklet** - declared by a param schema,
          so UI, MCP, automation, and persistence come for free (the
          catalog/registry are already the extension point, game-engine style) -
          plus generative **scripts** over the `dispatch` API, alongside the
          in-app file viewer (see the local-first context section).


          Pairs with the shareable/community device format; running user code
          needs **sandboxing + a trust model** (resource limits, Worker/iframe
          isolation, capability-limited APIs) before any sharing - which is what
          INST-4/5/6 work out. The agent can author components too.


          Builds on the custom-DSP-via-worklet path; the fullest workflow wants
          the Tauri shell + local-first files (MOBILE-4).


          Related: an **open-source instrument & effects library** - grow the
          catalogs, possibly with a shareable / community device format (open
          question).
        id: 019fae09-6e91-763e-b0c9-f627aaa52615
        created_at: 2026-07-29T13:21:21.553Z
        updated_at: 2026-07-29T16:00:49.121Z
      - ref: MOBILE-1
        area: MOBILE
        title: Responsive shell, tier by device
        status: to-do
        sort_path: "000001"
        priority: 0
        body: >-
          An epic; direction settled 2026-07-14. The four-region video-editor
          grid assumes a wide screen; touch devices need a different shape. A
          concept mockup of the phone + tablet layouts lives at
          `docs/mockups/mobile-ux.html` (self-contained, open in a browser).


          **Guiding decisions:**


          - **Swap the shell, not the app.** The stores (`projectStore`,
          `editLog`, the param schema) and the leaf components (`PianoRoll`,
          `Knob`, `LibraryPanel`, mixer, agent) are already UI-agnostic. Only
          the desktop `[grid-area:...]` shell doesn't map. So below a
          breakpoint, render a `MobileShell` that re-hosts the same panels -
          mobile is another projection of the same stores, not a fork.

          - **Tier by device, don't build one "mobile."** Phone = play / tweak /
          **agent-driven** creation (not full arrangement editing by finger);
          tablet (esp. landscape + Pencil) = a genuine editing surface
          approaching desktop. Detect with `pointer: coarse` / `pointerType`,
          not just width.

          - **Navigation:** a thumb-reachable **bottom tab bar** (reuse the
          data-driven `ActivityRail` view list: Arrange / Edit / Mix / Library /
          Agent) + a **persistent transport bar** pinned top + **slide-up
          sheets** for transient tasks (add instrument, edit a param) so you
          don't lose your place. **Long-press replaces right-click** (no hover,
          no secondary click).

          - **Agent-forward is the mobile superpower.** Precise multi-track
          touch editing is inherently painful; describing intent is not. On
          mobile the agent shifts from assistant to the **primary creation
          path** ("add a four-on-the-floor kick", "harmonize in the project
          key"), with touch for auditioning and fine-tuning. Notes-as-prompt
          (AGENT-5) is especially strong here.

          - **Platform gotchas:** iOS Safari / WKWebView has **no Web MIDI**
          (the on-screen keyboard/pads become the only input - invest there,
          velocity via touch-y/force); **AudioContext needs a user-gesture to
          unlock**; handle safe-area insets.


          **Suggested sequencing:** (1) spike - render + navigate at phone width
          (`MobileShell` + tabs + transport); (2) the Pointer Events refactor
          (MOBILE-2, no desktop behaviour change); (3) touch gesture + tool
          layer; (4) agent-forward flow + on-screen keyboard/pads; (5) PWA
          packaging (MOBILE-3).
        id: 019fae0c-8f83-7472-86e9-e1e8f5f0c6cd
        created_at: 2026-07-29T13:24:46.595Z
        updated_at: 2026-07-29T13:24:46.595Z
      - ref: MOBILE-2
        area: MOBILE
        title: Touch and pointer layer
        status: to-do
        sort_path: "000002"
        priority: 0
        deps:
          - MOBILE-1
        body: >-
          *Deps: MOBILE-1.*


          **Touch-first affordances (a design principle to apply now, not just
          for mobile).** Even before a full responsive layout, build
          interactions so they also work by touch, because retrofitting hover-
          and right-click-only UI later is expensive. Concretely:


          - prefer **persistent ⋮ menus over hover-only kebabs**;

          - always pair a **right-click context menu with a tap-reachable
          equivalent** (a ⋮ button, a long-press, or a mode);

          - keep **hit targets generous** (glyph icons sized up, not tiny -
          ~16-18px with a ~`w-6`/`w-7` hit area).


          This is the cheap groundwork that keeps the tablet / mobile goal
          reachable without a rewrite, and it is why DAW-20 (timeline & clip
          editing gaps) specifies a touch path for each new action.


          **The editing surfaces are the real work, and the keystone is
          migrating drag logic to the Pointer Events API**
          (`pointerdown/move/up`, one path for mouse/touch/Pencil,
          `touch-action: none` to own gestures) - do it once and every pointer
          surface benefits. Then layer:


          - **pinch-zoom + two-finger pan** on both axes;

          - an **explicit tool model** (draw / select / erase) to disambiguate a
          drag without modifier keys;

          - **hit-target floors** (min note height + resize handles, fixed
          keyboard edge);

          - heavier reliance on **grid snap/quantize**.
        id: 019fae0c-b32a-724c-bad1-b354de720785
        created_at: 2026-07-29T13:24:55.722Z
        updated_at: 2026-07-29T16:00:53.403Z
      - ref: MOBILE-3
        area: MOBILE
        title: "PWA packaging: manifest, service worker, icons"
        status: to-do
        sort_path: "000003"
        priority: 0
        deps:
          - HOST-5
        body: >-
          *Deps: HOST-5 (offline foundation).*


          **PWA first, because it validates webview audio.** The real gating
          risk is not the shell tech but whether an **OS webview can deliver
          acceptable real-time AudioWorklet audio** on mobile - and that risk is
          shared by every webview approach (PWA, Tauri, Capacitor), since all
          three use WKWebView / Android WebView.


          So ship a **PWA first** (installable, zero native shell, free) to
          validate webview audio on real devices and get an offline-capable app
          now. It is the cheapest way to learn whether the webview can carry the
          audio before committing to a native shell (MOBILE-4).


          The service worker + manifest is item (4) of HOST-5's work list, so
          the two tickets meet here.
        id: 019fae0c-ce5c-710d-908f-6a5903ee3c26
        created_at: 2026-07-29T13:25:02.684Z
        updated_at: 2026-07-29T16:00:54.343Z
      - ref: MOBILE-4
        area: MOBILE
        title: Tauri v2, desktop and mobile
        status: planning
        sort_path: "000004"
        priority: 0
        deps:
          - MOBILE-3
        body: >-
          *Deps: MOBILE-3.*


          Once the PWA has proved webview audio, reach for **Tauri v2** for
          app-store presence + native niceties - it added first-class
          iOS/Android targets, so one Tauri project can cover desktop *and*
          mobile (a point in its favour over a native rewrite, which would
          abandon the shared web codebase).


          Tauri-mobile is younger than its desktop story and its mobile plugin
          ecosystem is thinner, so **Capacitor** is the fallback if Tauri-mobile
          plugins fall short (more proven web-to-mobile wrapper, same webview +
          audio caveats). Only reach for React Native / Flutter / native if the
          webview proves it can't carry the audio - which the PWA step
          (MOBILE-3) will tell us cheaply.


          **The desktop shell is also the home for two other things:**

          - **Native low-latency monitored tracking.** A Rust audio backend
          (CPAL, or WASAPI-exclusive / CoreAudio, even ASIO) could own
          capture/monitoring natively while the same web UI/model rides on top.
          See the "Recording and input (design)" context section - the browser
          cannot reach ASIO-class round-trip latency, and this is the escape
          hatch.

          - **The fullest in-app IDE / local-first file workflow** - a real disk
          folder and a `plugins/` drop-in directory the shell loads (see
          INST-5's distribution tiers and INST-10).


          Related open decision: web-only-with-FS-API vs Tauri desktop, and when
          to make the jump.
        id: 019fae0c-fc9e-77fe-ae9f-e17f910bf35f
        created_at: 2026-07-29T13:25:14.526Z
        updated_at: 2026-07-29T16:00:54.810Z
