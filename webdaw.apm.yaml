      - ref: HOST-7
        area: HOST
        title: B3 headless MCP sync client
        status: to-do
        sort_path: "000007"
        priority: 0
        deps:
          - AGENT-6
          - HOST-6
        body: >-
          *Deps: HOST-6.*


          **MCP as a headless sync client, NOT per-feature HTTP endpoints.**


          The original B3 ("give MCP HTTP history endpoints") is **dropped**: it
          only half-delivers "MCP without a tab" (history would be headless
          while *edits still forward to the tab*), and it starts an
          endpoint-sprawl pattern where every future capability wants its own
          endpoint.


          **The insight:** MCP is *already shaped like a sync client* -
          `server/mcpServer.ts` keeps a `mirror` `ProjectStore` fed by sync
          messages and emits edits; its peer today is just the **tab** (over the
          local bridge), not the server. "Server-side MCP" done right = **swap
          the peer**: run a headless `SharedSession` (Node) against the `Room`,
          authenticated by the same JWT and addressed by `projectId`.


          Then reads are local to the synced store, edits + commits + reverts
          ride the same WS authority the browser uses, and it needs
          **essentially no new endpoints** - only the stateless bootstrap
          `createApiClient` already provides (list/open projects, file reads).


          **This converges with AGENT-6** (tool-surface consolidation):
          browser-agent and server-MCP become the same core - one tool catalog +
          `dispatch` -> `applyEdit` + a `SharedSession` - differing only in
          frontend (LLM loop vs stdio) and host (browser vs Node).


          Until then MCP stays tab-coupled (fine for the tinkerer audience).
          **Guard against the anti-pattern:** a new per-feature HTTP write
          endpoint for MCP is a smell - reach for the WS authority + shared tool
          catalog instead.


          A tab-less server-side *render* (for AGENT-20's ears over MCP) is a
          separate deferred epic needing a portable DSP core, but it pairs with
          this direction.
        id: 019fae0f-3314-704d-ba08-7e79fa6e7026
