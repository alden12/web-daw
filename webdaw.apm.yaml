      - ref: HOST-1
        area: HOST
        title: Multiplayer authority
        status: review
        sort_path: "000001"
        priority: 0
        body: >-
          **Motivation for the whole HOST area:** browser storage
          (OPFS/localStorage) was evicted by Chrome and wiped projects. We
          graduated to **web-app-primary**: a server + Postgres is the durable
          source of truth, OPFS is the offline fallback, and bundle
          export/import (`.daw.zip`) stays as the portability escape hatch.


          **Server + DB behind the `BundleStore` seam - DONE (slice
          sync-service).** A Hono + Drizzle + Postgres service (`server/api`,
          `server/db`) is a thin, owner-scoped `(projectId, path) -> content`
          store; the client's `RemoteBundleStore`/`RemoteProjectStorage`
          (`src/audio/remoteStore.ts`) plug in via `getProjectStorage()` when
          `VITE_DAW_API_URL` is set, so nothing above the seam (repository,
          library, autosave) changed.


          **Conflict resolution: server-authoritative total order + optimistic
          apply + rebase** (NOT OT, NOT CRDT). The client applies a command
          optimistically to its local replica and sends it tagged with the last
          authoritative `seq` it saw + a client op-id; the server appends it at
          the next `seq`, applies to HEAD, and broadcasts; a client that had
          in-flight ops **rebases** (roll back optimistic ops, apply the
          authoritative ones in order, re-apply its pending ops on top).


          *Rationale:* our edits are coarse **semantic** commands that mostly
          target *different* objects, so they commute and the authority need
          only *order* them; the rare **same-target** clash (two users on one
          knob/note) resolves **last-writer-wins by `seq`**, which matches
          expectation. OT is rejected (a ~50x50 transform matrix); CRDT is
          rejected *for now* because its value is authority-free multi-primary
          merge, which we do not need (single authority per project, single
          region at a time) and which would reshape `ProjectStore` and lose
          semantic intent. CRDT stays the escape hatch only if
          offline-collaboration or multi-region-per-project ever becomes a hard
          requirement.


          *Two requirements this imposes:* (1) **`applyEdit` must no-op
          gracefully on a stale target** (e.g. `addNote` to a track another user
          just deleted) instead of throwing; (2) **client op-ids** so
          reconnect/retry never double-applies.


          **Ephemeral vs durable split.** Presence (cursors, who's online) and
          live MIDI are **never persisted** - they live in the room instance's
          memory / a pub-sub bus. Only authored `EditCommand`s hit Postgres, so
          write load stays proportional to real edits.


          **Offline stance: solo-offline kept, live-collab requires a
          connection.** Solo editing stays local-first (OPFS working copy, queue
          commands, flush on reconnect - one writer, so the server sequences the
          queue with nothing to conflict against). Live collaboration requires a
          connection; brief disconnects are absorbed by the optimistic queue. We
          do **not** go Onshape-online-only nor full offline-first (that
          effectively demands CRDT). **Offline *during* active collaboration is
          deferred** - when wanted, prefer **branch-and-merge** (an offline
          session becomes a branch, reconnect does a 3-way semantic merge via
          the commit DAG we already have) over CRDT.


          **Build progress - Phase A landed in three slices:**

          - **A1 (slice 71):** the server-side per-project authority - a `Room`
          (`server/api/rooms.ts`) holds a headless `ProjectStore`, assigns the
          single monotonic `seq`, applies via `applyEdit`, persists through
          `appendEdits`, and broadcasts `editApplied`; a `WebSocketServer` on
          the same HTTP port (`/ws`, token at the upgrade) is the transport
          glue. Idempotent by `opId`; reloads HEAD from Postgres by replay on
          restart.

          - **A2 (slice 72):** the client `SharedSession`
          (`src/audio/sync/sharedSession.ts`) - optimistic apply + total-order
          rebase. It keeps a confirmed `base` (advanced by `applyEdit` in `seq`
          order) and a `pending` list of unconfirmed local ops; the live store
          is `base + pending`. Its own `editApplied` just retires the pending
          op; a peer's advances `base` and **rebases**. Wired through a single
          `EditLog` remote-sink so UI / MCP / recorder / agent edits all forward
          automatically. Undo/redo stay **local best-effort** in a shared
          session (their snapshots predate a rebase).

          - **A3c (slice 76):** reconnect gap-fill - a dropped connection
          self-heals. `createWsClient` reconnects with capped exponential
          backoff and exposes an `onOpen` hook. `SharedSession.resync`
          re-subscribes (the authority's `snapshot` folds any edits missed while
          away) and re-sends every still-pending optimistic op. Re-sends are
          idempotent by `opId`: the room *broadcasts* an already-applied re-echo
          so the originator retires its pending op, and peers drop it via their
          reorder guard.


          *(The collaboration-identity slices A3a/A3b/A3d are grouped with
          HOST-2.)*


          **Hosting & scaling.** The authority is **per-project** (the shard
          unit). The full scaling analysis - WS routing, in-memory authority +
          failover, DB sharding, and why a project is single-region at a time -
          is in the "Sync service - scaling and sharding" context section.


          Status: built and deployed, in an open PR, not yet on `main`.
        id: 019fae0d-8d24-714f-b315-a5ce84ee63f3
        created_at: 2026-07-29T13:25:51.524Z
        updated_at: 2026-07-29T13:25:51.525Z
      - ref: HOST-2
        area: HOST
        title: "Auth: principal, login, sharing"
        status: review
        sort_path: "000002"
        priority: 0
        deps:
          - HOST-1
        body: >-
          Real multi-user accounts, replacing the stubbed single owner. Done
          **before** Phase B/C because it changes the ownership/principal model
          both build on.


          **Decision: Supabase Auth as an identity provider only.** It runs
          login and issues a JWT; our Hono+Postgres owns all domain data and
          just *verifies* the token to get the principal. Lock-in is kept low
          deliberately: the DB stays plain Postgres (Drizzle unchanged), we keep
          our **own `users` table** keyed by the auth subject (never FK into
          Supabase's tables), verification is a standard JWKS check behind a
          one-function seam, and we use none of Supabase's
          realtime/storage/data-API - so moving to AWS (RDS + Cognito or
          self-hosted GoTrue) later is a contained swap.


          **Trust & durability guarantees.** Projects **soft-delete** (a
          `deletedAt` stamp, never a hard `DELETE`) so an accidental delete is
          recoverable; `history/commits/*` is **write-once** (append-only).


          **Collaboration identity (slices 73-75):**

          - **A3a (slice 73):** per-user identity + colours. `author`
          generalised from the 3-role enum to a bounded free string
          (`claude`/`agent` reserved AI voices, `you` the default; any other
          value a human user id) - backward compatible, no schema bump. A
          `currentUser` store sets `EditLog`'s local-author default. A peer's
          `editApplied` posts an append-only feed entry via
          `EditLog.recordRemote` (narration, no re-apply), and the feed colours
          each entry by `colorForAuthor`.

          - **A3b (slice 75):** project name is now project state - a
          `renameProject` edit (an optional `name` on `projectDataSchema`)
          instead of a bare `meta.json` write, so a rename syncs live across a
          shared session, rides undo/redo + history, and the authority's
          headless replay reconstructs it. `meta.json` keeps a name copy as the
          library's list index. A document with no `name` defaults to
          "Untitled".

          - **A3d (slice 74):** full per-surface tinting +
          **perspective-relative colouring**. The author-tinted surfaces
          (piano-roll notes, knob/fader fills + pointers, arrangement placement
          blocks + note-summary bars, track-row accents, clip rail, patch list,
          version timeline, feed) moved off the fixed 3-voice Tailwind classes
          onto per-author inline hex (`authorStyle.ts`), fed a live `{config,
          self}` presence through an `AuthorColorsProvider` context. This
          removed the asymmetry where whoever kept the default `you` was a
          privileged always-teal identity - now two users are symmetric.


          **Auth epic (slices 77-80):**

          - **Auth-A (slice 77):** the server-side principal, end to end.
          `server/api/principal.ts` (`makeJwtResolver` verifies a Supabase JWT
          via `jose`/JWKS - issuer + `authenticated` audience, principal =
          `sub`; `makeDevResolver` keeps a dev stub). Both the HTTP middleware
          (`app.ts`) and the WS upgrade (`wsServer.ts`) resolve identity through
          it (WS is now a *per-connection* owner; the message handler awaits the
          resolved principal so an early `subscribe` is held, not dropped). A
          resolved principal is JIT-provisioned into a `users` table;
          `projects.ownerId` is an FK to `users.id`. Tests mint tokens against a
          local JWKS (no network/live Supabase).

          - **Auth-B (slice 78):** the browser login. `src/auth/session.ts` (the
          only importer of `@supabase/supabase-js`) wraps Supabase Auth behind
          two seams: `getAccessToken()` and a `readAuthState`/`subscribeAuth`
          store fed by `onAuthStateChange`. `src/ui/AuthGate.tsx` wraps
          `AppShell`: when `authEnabled` it shows a loading card / a login
          screen (Continue with Google/GitHub) / the app by session status -
          gating *above* AppShell so the audio engine doesn't build behind the
          login. The token became a lazy `TokenSource` on `createApiClient` and
          `createWsClient` (URL rebuilt inside `connect()`, so a reconnect picks
          up a refreshed token).

          - **Auth-C (slice 79): membership/sharing** end to end. A
          `project_members` table (`(projectId, email)` PK, role, invitedBy) - a
          member is keyed by **email** (stored lowercase), never a FK into
          `users`, so an owner can invite someone who hasn't signed up yet and
          the grant takes effect the moment they sign in with a provider account
          whose verified email matches. The single-owner filter in
          `server/db/store.ts` became **owner-or-member**: an `accessibleWhere`
          predicate drops in wherever a query was `eq(ownerId)`; writes gate the
          same way. Owner-only member endpoints (`GET/POST/DELETE
          /projects/:id/members`, zod `z.email()` at the boundary) + a
          `SharePanel`. This **closed the WS room-authorization gap** flagged in
          Auth-A: `RoomRegistry.get` now takes the principal, resolves the
          project's real owner, authorizes owner-or-member before handing back
          the room, and loads/persists under that real owner. The **project
          index moved onto the `projects` table**: `GET /projects` returns `{
          id, name, modifiedAt, role }[]`, killing the per-project `meta.json`
          read on the remote path.

          - **Auth cleanup (slice 80):** (a) **retired `DAW_API_TOKEN`** end to
          end - `makeDevResolver` keeps only the `"local"` dev principal;
          `VITE_DAW_API_TOKEN` is gone. (b) **Email-based edit identity** -
          `author` (the colour key + feed label) is now the signed-in **email**,
          not the display name, so two logins of the same person stay distinct;
          the feed shows "You" for your own edits. (c) **Rename propagates
          live** - the authority calls `setProjectName` when it applies a
          `renameProject` edit, and a peer patches its library-list label via
          `SharedSession.onRemoteEdit` -> `patchProjectName`. (d) **Account
          avatar + panel** - a rail avatar opens an account panel (name, email,
          sign out).


          **Still deferred:** the fuller server-side `meta.json` retirement
          (keep it only as the OPFS/offline fallback index).


          Status: built and deployed, in an open PR, not yet on `main`.


          Deps: HOST-1.
        id: 019fae0d-ec8b-7338-97ba-2ee175770ef7
        created_at: 2026-07-29T13:26:15.947Z
        updated_at: 2026-07-29T16:01:16.195Z
      - ref: HOST-3
        area: HOST
        title: Deploy on Fly and Neon, single-origin
        status: review
        sort_path: "000003"
        priority: 0
        deps:
          - HOST-1
          - HOST-2
        body: >-
          **First deploy (slice 81).** The recommended shape is now a concrete,
          repeatable deploy (runbook in `docs/DEPLOY.md`).


          **Single origin:** one Node process serves the built client (`dist/`),
          the Hono API, and `/ws` from one URL (the server gained static +
          SPA-fallback serving in `server/api/index.ts`; the auth gate is scoped
          to `/projects` so static assets aren't 401'd).


          **Fly.io** runs it as a **scale-to-zero** machine (`fly.toml`: one
          `shared-cpu-1x`/256 MB, `max_machines_running = 1`, no volume - bounds
          cost to ~$2-3/mo worst case, near-$0 idle) + **Neon** free Postgres;
          migrations apply on boot. Scale-to-zero is safe here because a room
          rebuilds by replaying the `edits` table and clients reconnect/gap-fill
          (HOST-1's A3c) - the only cost is a few-second cold start after idle;
          flip `min_machines_running = 1` for a live session. Deployed with
          **auth on** (the Supabase JWT stack, HOST-2).


          **Why serverless is out:** the realtime server holds **WebSocket**
          connections - long-lived, stateful - unlike a stateless HTTP API. That
          rules out request/response serverless (Vercel/Netlify functions, plain
          Lambda) for the socket layer; it needs an always-on process.
          Alternatives considered: **Railway** for both if one dashboard is
          preferred; **Cloudflare Durable Objects / PartyKit** (purpose-built
          stateful per-key rooms, the cleanest fit for the model, but a
          Cloudflare tie and a non-Node runtime - reach for it only if
          per-project rooms dominate). Avoid API-Gateway-WebSockets-on-Lambda.


          **Migrations - the paradigm shifted, and it is now in force.** The old
          "discard old data on a format change" shortcut was scoped to
          disposable local-only data. With the app deployed to a live hosted
          database, that shortcut is **retired**: there is real persisted user
          data, so every schema change must carry it forward. **Migrations are
          forward-only and additive-preserving.** Two independent axes:

          - **DB schema (Drizzle):** edit `server/db/schema.ts` -> `yarn
          db:generate` (versioned SQL in `drizzle/`) -> deploy.
          `applyMigrations` runs pending SQL **on boot**, idempotently. Because
          a migration runs while the previous machine is still serving (rolling
          deploy), new SQL must be safe against the running code too, so a
          destructive change (drop/rename) is done **expand -> contract** across
          two deploys, never in one.

          - **Project document (`project.json` / command blobs, opaque to
          Drizzle):** bump `PROJECT_SCHEMA` + add a `fromVersion -> fromVersion
          + 1` upcaster in `src/audio/project/documentMigration.ts`;
          `ProjectRepository.load` chains them and heals each bundle lazily on
          load. CI fails on a gap (`firstMissingUpcaster`); `findStaleProjects`
          flags stored docs below the current version.

          - **Safety:** Neon keeps point-in-time history; take a **Neon branch**
          (copy-on-write clone of prod) as a rollback point and test a risky
          migration against it before deploying. Operational runbook:
          `docs/DEPLOY.md` ("Migrations on a live database").


          Status: built and deployed, in an open PR, not yet on `main`.


          Deps: HOST-1, HOST-2.
        id: 019fae0e-27e4-7497-abd3-c7313abfbc2a
        created_at: 2026-07-29T13:26:31.140Z
        updated_at: 2026-07-29T16:01:17.139Z
      - ref: HOST-4
        area: HOST
        title: B1 server keyframes and compaction
        status: review
        sort_path: "000004"
        priority: 0
        deps:
          - HOST-1
        body: >-
          *Deps: HOST-1.*


          **Delta sync (slices 66-67).** Autosave no longer re-uploads the whole
          `project.json` on every edit; it **appends the delta** to a durable,
          append-only edit log and rewrites `project.json` only as a throttled
          **keyframe** (recording, via a `headSeq` marker, the seq it reflects).
          Load reconstructs HEAD by replaying the log tail after the keyframe
          through `applyEdit` (the same keyframe+delta shape the commit DAG
          uses). The edit log is exposed through the storage seam
          (`BundleStore.appendEdits`/`readEdits`): local backends back it with
          an `edits.json` file, the sync server with an `edits` table, so
          per-edit network cost is proportional to the edit, not the document.
          The log is a MUTABLE working stream (append upserts by `seq`) so a
          coalescing edit (a knob drag) re-syncs; undo/redo force a keyframe so
          the replayed tail is always pure-forward. *Known limit:* a coalescing
          edit still in the un-keyframed tail may reload at an intermediate
          value after a hard crash mid-drag; the next keyframe heals it.


          **Keyframe cadence (slice 69).** The initial cadence fired a
          full-bundle keyframe ~1.5s after edits stopped, re-introducing
          whole-bundle writes after nearly every editing pause. The rework rests
          on one insight: **keyframes are not a durability mechanism** (the
          delta append is the durable write) - their *only* job is bounding
          load-time replay. So the cadence is **count-primary**: `project.json`
          is rewritten every `KEYFRAME_EDIT_INTERVAL` edits (100 to start, a
          single tunable constant), plus undo/redo-forces-keyframe; the periodic
          idle timer is gone. The small files are **unbundled** from the
          keyframe: `notes.json` on the fast cadence, `meta.json` on the
          keyframe cadence. A **page-hide flush**
          (`visibilitychange`/`pagehide`) sends whatever the debounce is still
          holding; it deliberately does *not* keyframe.


          **Server-side keyframes (slice 82, Phase B1).** Now that the realtime
          authority (`server/api/rooms.ts`) already owns the reducer, it writes
          a keyframe itself: every `KEYFRAME_INTERVAL` (100) edits
          `Room.persistKeyframe` writes `project.json` (HEAD snapshot + embedded
          `headSeq`) and then compacts the working `edits` log via
          `deleteEditsBelow`, pruning entries below `headSeq - SNAPSHOT_WINDOW`
          (kept strictly below the keyframe so `Room.load`'s tail replay stays
          exact, and retaining the 2000-entry feed window). This bounds
          cold-start replay under scale-to-zero. `meta.json` sync was retired
          server-side at the same time - `projects.name`/`modifiedAt` is
          maintained by the authority.


          *Why this waited for multiplayer:* server-side keyframing would
          otherwise break the deliberately-dumb `(projectId, path) -> content`
          blob store (the server would have to own the command/reducer layer
          *and* the document upcasters). It becomes worth it exactly with
          realtime multiplayer, where an authoritative server must replay and
          merge edits anyway - the replay engine stops being extra coupling and
          becomes core.


          **Deferred within this ticket:**

          - **Commits referencing edit ranges instead of embedding entries** -
          resolved by HOST-6's marker-in-log model. (Rationale: the two layers
          had *opposite* lifecycles - the `edits` table is a mutable, prunable
          working stream while commits are write-once and kept forever - so
          embedding is what made a commit self-contained. The right time was
          when the log became authoritative.)

          - **Snapshot-anchor dedup (low priority).** Full `ProjectData`
          snapshots live in three places: `project.json` (the HEAD keyframe),
          `undo.json` (the delta-encoded stacks' anchors), and keyframe commits.
          These are *materialized state*, not edits, so they are the real weight
          in a bundle - but they are mostly not literal duplicates: each is a
          distinct point in time. They exist as stored anchors because
          `applyEdit` is **forward-only** - with no inverse you cannot derive a
          past state by walking HEAD backward. A future "anchor management" pass
          could share anchors where points coincide, but the win is small.

          - **Sample GC** (drop `samples/*` unreferenced by any commit or the
          working project) and including the `history/` DAG in the `.daw.zip`
          export.


          Status: built and deployed, in an open PR, not yet on `main`.
        id: 019fae0e-6bca-758e-989a-8d797ad94986
        created_at: 2026-07-29T13:26:48.522Z
        updated_at: 2026-07-29T16:01:17.527Z
      - ref: HOST-5
        area: HOST
        title: Offline foundation
        status: review
        sort_path: "000005"
        priority: 0
        deps:
          - HOST-1
        body: >-
          *Deps: HOST-1.*


          **Offline-first / PWA + backend interchangeability** (direction firmed
          up 2026-07-15). The north star: online and offline are the *same app*
          degrading gracefully, with local and remote storage **almost
          interchangeable** and a **trivial sync on reconnect** - not two
          builds.


          **Where we were.** All project data goes through one seam
          (`BundleStore`/`ProjectStorage`, `getProjectStorage()`), with three
          backends: **RemoteProjectStorage** (HTTP + WS authority ->
          Postgres/Neon), **OpfsBundleStore** (browser OPFS bundle), and
          **MemoryBundleStore** (tests). But the backend was chosen **at build
          time** by `VITE_DAW_API_URL`, so it was online-*or*-offline: remote
          mode wrote **no** OPFS cache, so a server it couldn't reach just
          failed; local mode synced nowhere. (Small non-project state -
          `currentUser`, current-project key, author colours, agent chat - lives
          in `localStorage` regardless.)


          **Why we are well-positioned.** The **edit log is the universal
          currency**: both backends model persistence as "append `seq`-ordered
          `EditCommand`s + replay to materialize HEAD", identical in
          `edits.json` (OPFS) and the `edits` table + WS (remote). Sync is
          therefore a *sequencing* problem, and the hard part is already solved
          - the authority is **`opId`-idempotent** and `SharedSession` already
          does optimistic apply + rebase + reconnect gap-fill. So **an offline
          session is just a peer that has been away longer**: on reconnect,
          replay the queued local edits through the authority (dedup by `opId`),
          it assigns authoritative `seq`s, and LWW-by-`seq` rebase converges -
          no CRDT (same decision as HOST-1). Content-addressed samples (sha256)
          sync by "push the hashes the server lacks", dedup for free.


          **The work to get there.** (1) **Always keep an OPFS working copy**,
          even in remote mode (write-through cache), so there is local state to
          render + mutate when the network drops; (2) a **durable offline
          write-queue** (append edits with `opId`s + provisional local `seq`s to
          OPFS, flush through `SharedSession` on reconnect - the gap-fill
          extended to a long gap); (3) **runtime online/offline switching** (a
          "cache + queue" wrapper at the `BundleStore` seam, not a build-time
          flag); (4) **service worker + manifest** for the installable PWA (this
          is MOBILE-3). The one subtlety is **`seq`-space reconciliation** -
          solo-offline is a clean replay (no peers); multi-user-with-offline
          rides the existing LWW-by-`seq` rebase.


          **This reshaped how history/commits (HOST-6) are built.** Under this
          model a commit is best a **syncable authored entry in the same log**
          (authorable offline, synced on reconnect like any edit), NOT a
          server-only `POST` the client cannot perform offline. So this
          substrate had to land before or with HOST-6. Likewise agent-session
          persistence rides the same substrate.


          **Per-backend index note.** Each backend needs a cheap listing index:
          remote uses the `projects` table columns; OPFS uses each bundle's
          `meta.json` (a small name-card, so the library needn't parse every
          `project.json`). That is why `meta.json` survives client-side after
          HOST-4 retired it server-side.


          Status: built and deployed, in an open PR, not yet on `main`.
        id: 019fae0e-a58d-730a-98fd-cb056ade873b
        created_at: 2026-07-29T13:27:03.309Z
        updated_at: 2026-07-29T16:01:18.532Z
      - ref: HOST-6
        area: HOST
        title: B2 server-authoritative history
        status: review
        sort_path: "000006"
        priority: 0
        deps:
          - HOST-4
          - HOST-5
        body: >-
          **A commit is a syncable log entry.** Commits were *already* persisted
          server-side (bundle writes reach the DB, `history/commits/*` is
          write-once), but the DAG was **authored independently by each
          client**: every client ran its own debounced auto-checkpoint and
          advanced `refs.json` - a single mutable HEAD pointer - so concurrent
          committers **raced and clobbered HEAD**, peers didn't see each other's
          commits without a reload, and there was redundant per-client
          auto-commit churn.


          The fix, per HOST-5's offline-first note, is **not** a WS/HTTP commit
          *request* (that can't be authored offline and adds a second,
          uncoordinated notion of HEAD): make a **commit a new authored entry
          kind in the edit log itself**. A "save version" dispatches a `commit`
          marker (message + author) that rides `SharedSession` exactly like an
          edit - queued offline, flushed on reconnect, assigned an authoritative
          `seq` by the `Room`, and broadcast to peers in the same `editApplied`
          stream.


          **Consequences:** (a) the `refs.json` race disappears by construction
          - HEAD is just the latest `commit` marker in `seq` order, a derived
          value, not a mutable pointer anyone writes; (b) commits **reference
          log ranges** rather than embedding client-seq copies, unifying on the
          authoritative `seq` space (this resolves the "commit embeds its
          entries" item deferred under HOST-4); (c) the server **materializes**
          snapshots/keyframes on cadence (reusing B1 keyframe machinery) so
          replay stays bounded; (d) peers' history is live for free. Reads
          (`list_history` / `diff` / get-commit) reconstruct from the
          authoritative log + keyframes - shareable by any caller. The
          **local/offline backend keeps its file-DAG** unchanged (the
          `repoOverride` seam isolates it); this reworked the *remote* path.


          This is a meaty rework of the commit model (seq-space unification +
          marker-in-log), not a drop-in - it was always going to need it (the
          design flagged "B2 will need rework" without the substrate; HOST-5 is
          that substrate).


          **Design revision from the "keyframe budget" discussion -
          auto-checkpoints are keyframes, not commits.** We separated two
          concerns the earlier plan conflated: *durability/undo* (never lose
          work, scrub recent history) vs *version history* (deliberate
          milestones). Keyframes only ever serve two jobs - cold-start/initial
          load, and reconstructing a specific commit - so pin them to those:
          **one keyframe per commit** (few, user-driven) gives full, cheap
          time-travel to any commit; a **rolling keyframe on the edit cadence**
          is the durability/undo safety net. This **supersedes the earlier
          "auto-commit on edit cadence" decision**: auto-checkpoints become
          *keyframes* (invisible in the version list -> no feed noise), and
          commits are **entirely user-driven** (fewer, meaningful nodes).
          Numbers: N=100 edit cadence, one pinned keyframe per commit, a rolling
          window of ~M=10 head keyframes (~1000 edits of fine-grained reach).
          Ctrl-Z undo is a separate in-memory stack, unaffected.


          Delivered in three steps - see the sub-tickets HOST-6.1 - HOST-6.3.


          **Deferred (no consumer yet):** the **rolling head-keyframe window
          (M)** + its GC, and *arbitrary uncommitted-seq* scrubbing.
          Commit-pinned keyframes are self-contained, so commit diff/revert
          needs zero replay *without* the rolling window - M only bounds replay
          for scrubbing to an uncommitted point, which no UI does yet. Build it
          when a timeline-scrubber lands. For now the single cold-start
          `project.json` keyframe + the retained recent log cover load + recent
          undo.


          Status: built and deployed, in an open PR, not yet on `main`.
        id: 019fae0e-ff87-73fc-88d7-2b2a246f67f3
        created_at: 2026-07-29T13:27:26.343Z
        updated_at: 2026-07-29T16:02:16.297Z
      - ref: HOST-6.1
        area: HOST
        title: Commit as a log marker
        status: done
        sort_path: "000006.000001"
        priority: 0
        parent: HOST-6
        body: >-
          *Steps 1-2 of HOST-6.*


          The `commit` edit command (message; `applyEdit` no-ops it) +
          `SharedSession.postCommit`.


          A named commit is authored into the log, queued offline, seq'd by the
          `Room`, broadcast to peers - **no new message types, no `Room`
          change**. Concurrent commits land as distinct ordered markers, so the
          HEAD race is gone by construction.


          Tested in `sharedSession.test.ts`.
        id: 019fae9a-a921-73dd-8b2e-53eebbfc5326
        created_at: 2026-07-29T15:59:59.265Z
        updated_at: 2026-07-29T15:59:59.265Z
      - ref: HOST-6.2
        area: HOST
        title: Client reads history from the log + commit-pinned keyframes +
          revert-as-marker
        status: done
        sort_path: "000006.000002"
        priority: 0
        parent: HOST-6
        deps:
          - HOST-6.1
        body: >-
          *Step 3 of HOST-6.*


          The remote `VersionStore` (`src/audio/commands/history.ts`) now
          derives history from the authoritative log instead of the client
          file-DAG: `history()` scans the mirrored log for `commit` /
          `loadSnapshot` markers (HEAD = the latest marker's `seq`, derived);
          `commit()` -> `session.postCommit`; `revertTo()` dispatches a
          `loadSnapshot`; `diff` materialises from pinned keyframes.


          The **local file-DAG is untouched** (`repoOverride` seam /
          `setRemote(null)`), and the client-side auto-checkpoint is a no-op in
          remote mode. Reactivity: `SharedSession.onConfirmed` fires when the
          log advances (ours or a peer's) -> `onLogAdvanced()` re-reads, so a
          peer's commit appears live. Covered by `history.test.ts` (remote
          suite) + `room.test.ts`.


          - **Server writes a keyframe per commit.** On a `commit` marker the
          `Room` snapshots HEAD *synchronously* at seq-assignment (exact under
          concurrency) to `history/keyframes/<seq>.json` (a `ProjectData`
          snapshot, distinct prefix + schema from the `commitSchema` file-DAG
          nodes). Materialise = load that keyframe, **zero replay**, exact
          however old. Markers are exempt from log compaction
          (`deleteEditsBelow`), so the commit list stays enumerable forever.

          - **Revert = a `loadSnapshot` marker carrying the target snapshot.**
          Unlike a commit (a no-op pointer), a revert changes state, so it
          embeds the target `ProjectData` and `applyEdit` replays it with
          `project.load`. Because the state is *in the command*, it is a plain
          forward edit: rides sync, applies optimistically, replays on peers,
          self-anchors on replay - **zero special-casing** in the realtime
          authority. Acceptable payload because reverts are rare + explicit (the
          reason we don't embed snapshots in frequent commits). It is also a
          history node (`message` = `Revert to "..."`).
        id: 019fae9a-c806-77b9-81d9-cbc75f3397e7
        created_at: 2026-07-29T16:00:07.174Z
        updated_at: 2026-07-29T16:00:07.174Z
