      - ref: DAW-6
        area: DAW
        title: Recording and input
        status: done
        sort_path: "000006"
        priority: 0
        deps:
          - DAW-4
          - DAW-5
        body: >-
          Audio and MIDI recording. Design thinking (the latency argument,
          monitoring, compensation) is in the "Recording and input (design)"
          context section.


          - **Metronome (slice 27).** Engine `scheduleClick`; the scheduler
          emits whole-beat clicks in the lookahead window (bar accent follows
          the loop); transport toggle. A transient preference, not an edit.

          - **Live audio capture (slice 28).** `getUserMedia` (voice DSP off) ->
          a capture AudioWorklet (per-quantum float32 via postMessage, no
          SharedArrayBuffer) -> WAV (`recording/wav.ts`) -> `putAudio` hash ->
          one `addAudioTrack` edit, so persistence/replay match import (capture
          is a side effect, the edit is pure data). A `Recorder` controller
          holds the transient arm/record state; count-in (0/1/2 bars) pre-rolls
          metronome clicks. Latency is a fixed `outputLatency + baseLatency`
          estimate baked into the take's start beat. Monitoring is
          hardware/direct.

          - **Record arm + into-track (slice 29).** Per-track record-enable (a
          grey->coral circle on audio track headers) arms one track; Record
          lands the take on it via an `addAudioClip` edit (clip + placement, ids
          pre-minted -> deterministic replay), else a fresh track. Transport
          Stop (and spacebar) finalize the take.

          - **Recording UI polish (slice 30).** Mute/solo line up across group
          and track headers via a shared leading "gutter". Recording settings
          (count-in, input device) moved into the "Timeline options" menu as
          nested submenus; `Menu` gained submenu flyouts, radio items, and
          separators.

          - **MIDI recording (slice 40).** The target track's kind picks the
          mode (audio track captures the mic, instrument track captures live
          MIDI notes). Record arms the armed track, or the selected track if
          nothing is armed, and a take **punches in** over the lane (its clip
          replaces whatever it overlaps, trimming/splitting straddlers; undo
          restores them via the snapshot checkpoint). Live notes are stamped
          against arrangement beats by the `Recorder`; on stop they become one
          `addNoteClip` edit. The piano roll shows a **live overlay** of the
          take as it is played - released notes as static ghosts, the held note
          growing to the playhead each frame - in the record colour.

          - **MIDI device input (Web MIDI API) - shipped.**
          `src/audio/midi/midiInput.ts` + `parseMidiMessage.ts` capture from a
          real MIDI keyboard / controller (not just the computer keyboard), with
          a device picker in `ui/MidiSettings.tsx`, wired through `AppShell`. It
          routes into the same `Recorder.noteOn/noteOff` capture path, so
          recording, the live overlay, and quantize all came along. *(The old
          design doc still listed this as roadmap - it is done.)*

          - **Audio clip editing (slices 32-35).** Waveform overview
          (`waveform.ts` decodes OPFS bytes once via an `OfflineAudioContext`,
          caches a min/max peaks array per `fileId`; `Waveform.tsx` draws to a
          canvas). A bar/beat ruler over the waveform with draggable loop
          start/end handles setting `loopStartSec`/`loopEndSec` as a
          `setAudioClip` edit (the engine plays that slice via
          `source.start(when, offset, duration)`; a longer placement repeats
          it). Clip gain > 1 (clamp 4x / +12 dB) with the shared `Fader`, the
          waveform scaling its trace by gain and painting past-full-scale
          columns in the warning colour. A live playhead following the active
          placement. A per-clip **content offset** (`gridOffsetSec`) so a
          transient can be lined up with a bar line - the grid is the fixed
          frame and the audio slides underneath, resolved by the pure
          `audioPlayWindow` helper (`engine/audioWindow.ts`), which clamps the
          slice to the buffer and renders a head that precedes the buffer as
          silence.


          **Remaining follow-ups:** MCP arm/record tools, input level meter
          (DAW-8.5), remembered device + eager enumeration, a
          software-monitoring option, loopback **latency calibration** (store
          the offset on the region), punch-in at the playhead, multi-track arm,
          stereo. **Overdub & punch options:** record into the existing clip
          (merge takes) instead of always punching a fresh clip; a loop-record
          mode that stacks takes. The arrangement block's audio thumbnail still
          draws the whole buffer (ignores offset + loop region); a per-placement
          nudge (vs per-clip) is a later option. **Live-input arpeggiation**
          (real-time note transforms on what you play) is the extension the
          MIDI-device chain still wants - it needs held-set state and reuses the
          same transforms.
        id: 019fae03-88b8-741a-a9f2-c4eb2ad34b65
        created_at: 2026-07-29T13:14:55.032Z
        updated_at: 2026-07-29T16:03:08.469Z
      - ref: DAW-7
        area: DAW
        title: Undo/redo and activity feed
        status: done
        sort_path: "000007"
        priority: 0
        deps:
          - DAW-1
        body: >-
          The authored edit log - the spine the whole thesis hangs off.


          **Authored edit log + persistence (slices 9, 11).** Every durable edit
          flows through one `dispatch(command, author)` seam into an
          append-only, authored command log, sharing the MCP protocol's command
          vocabulary. It powers undo/redo (snapshot checkpoints with coalescing)
          and the two-voice activity feed. The log persists alongside the
          project snapshot and is restored on load, so the feed and authored
          history survive a reload.


          Undo/redo later graduated from session-only to time-travel over
          commits (see the HOST history tickets). The **persisted undo/redo
          stacks** (`undo.json`) delta-encode: instead of one full snapshot per
          checkpoint, each stack stores a single base snapshot + the command of
          each checkpoint, rebuilt on reload by replaying through `applyEdit`
          (the in-memory stacks stay full snapshots for instant undo) - ~24x
          smaller in practice. This required making `apply` a *pure function of
          the command*: the one hole was `createTrack` auto-creating a family
          group with a random id, now derived deterministically from the family
          name.


          **Feed + edit-log unification (slice 70).** Feed notes and edits are
          now **one** seq-ordered authored stream. A note is a `kind:"note"`
          entry carrying its text on `command` (`{type:"note", text}`); forward
          replay skips it (only `edit` kinds apply). So notes ride the delta
          append (durable without a keyframe) and both `notes.json` and
          `log.json` retired.


          Deps: DAW-1.
        id: 019fae03-ab54-7553-be6d-30310bd7b553
        created_at: 2026-07-29T13:15:03.892Z
