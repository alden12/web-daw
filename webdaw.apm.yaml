        area: AGENT
        title: Expose analyze_mix over MCP via the bridge
        status: to-do
        sort_path: "000020"
        priority: 0
        body: >-
          *Part of AGENT-4. Formerly `AGENT-4.6`. Deps: AGENT-15.*


          `analyze_mix` is registered only in the in-app `createAgentTools`; the
          Node MCP server is DOM-free and its tools are registered separately,
          so external clients (Claude Code / Desktop) cannot call it yet.


          Add an MCP tool + a bridge handler that forwards to the live tab,
          where `renderProjectOffline` + analyze run and return the `MixSummary`
          (plain JSON, crosses the wire fine) - the same round-trip every MCP
          edit already uses.


          Needs a live tab open (Web Audio is browser-only); a tab-less
          server-side render is the separate deferred epic (portable DSP core,
          pairs with HOST-7).
