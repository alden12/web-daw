        area: HOST
        title: Fail closed without auth config
        status: review
        sort_path: "000008.000004"
        priority: 0
        parent: HOST-8
        body: >-
          **Done.** `resolveAuthConfig` (`server/api/principal.ts`) is the
          single place the bootstrap turns env into an `AuthConfig`.


          When `SUPABASE_JWKS_URL` / `SUPABASE_JWT_ISSUER` are unset (or only
          half-set) it throws under `NODE_ENV=production` - the server refuses
          to boot rather than silently dropping to the open dev-stub (a single
          "local" owner, no credential), so a misconfigured production deploy
          fails closed instead of running wide open.


          Outside production it still returns the open dev-stub, now with a loud
          warning. Both the HTTP and WS gates inherit the one decision.
          `NODE_ENV=production` is set in two independent places in the deploy
          (Dockerfile + fly.toml), so the signal is hard to lose.


          Covered by `test/principal.test.ts`.


