      - ref: INST-1
        area: INST
        title: Built-in instruments
        status: done
        sort_path: "000001"
        priority: 0
        deps:
          - DAW-1
        body: >-
          The instrument catalog and the two frameworks under it. Adding an
          instrument is a three-touch extension (catalog entry + factory +, for
          worklets, the module URL), after which it appears in the library, the
          knob panel, the MCP palette, automation, and persistence for free.


          **Node-graph instruments.** Subtractive + FM, built from native Web
          Audio nodes.


          **Custom-DSP AudioWorklet framework (slice 36), part A of the worklet
          intro.** The ceiling of the node-graph approach (no per-sample logic /
          block algorithms) is lifted by a worklet authoring + loading seam:
          worklet processors are authored in **TypeScript** under
          `src/audio/worklets/` and bundled by Vite via the `?worker&url` import
          suffix (which transpiles + inlines the worklet's imports and returns a
          URL for `addModule`); the pure DSP they run lives in shared,
          unit-tested modules under `src/audio/dsp/` (the worklet is a thin
          realtime shell). `worklets/index.ts` is the single module registry;
          `AudioEngine.start()` awaits `loadWorklets` before building the graph
          so worklet-backed effects construct synchronously. Worklet-scope
          globals are declared in a tiny ambient `worklets/audioworklet.d.ts`.


          **Worklet *instrument* framework + wavetable synth (slice 39), part
          B.** A `WorkletInstrument` base implements the `Instrument` interface
          over an `AudioWorkletNode`: note events post to the processor with
          their absolute `when` (the scheduler's lookahead delivers them ahead
          of time, so the processor places them **sample-accurately**), and
          params bind **generically** - every number param in the schema binds
          to the processor's same-named `AudioParam` via `rampParam`, so a
          worklet instrument needs no per-param code, just a processor name +
          matching `parameterDescriptors`. Shipped on it: a polyphonic
          **wavetable synth** (a morphing bank of single-cycle tables in pure
          `dsp/wavetable.ts`; a 16-voice pool with linear attack/release
          envelopes, a one-pole tone control, and sample-accurate dispatch).


          **Flagship synth "Nimbus" (slice 56).** A warm, Juno-inspired
          **polyphonic subtractive synth** on the worklet-instrument framework.
          Each of 16 voices mixes band-limited **saw + pulse (PWM) + sub +
          noise** (PolyBLEP, pure `dsp/oscillators.ts`) through a four-pole
          **resonant Moog-style ladder filter** (pure, unit-tested
          `dsp/ladder.ts` - the "the filter is the sound" investment, reusable
          by future synths), shaped by a full **ADSR** (the amp env also
          modulates the filter by an amount) with **key-track**, one global
          **LFO** (rate + delay/fade-in, to pitch / filter / PWM), and subtle
          per-voice **drift**. Continuous osc-level knobs (rather than on/off
          switches) keep every param a *number*, so `WorkletInstrument` binds
          them all generically. Continuous modulation (pitch/PWM/cutoff)
          refreshes per block; the VCA envelope runs per sample. Its signature
          lushness comes from the existing Chorus effect (bundled into the
          patches). **Remaining in the arc:** a **Minimoog-style mono**
          lead/bass voice reusing the ladder filter. Nimbus is the test-bed for
          the tonic-relative display (DAW-12).


          **Sampler (slice 50, PR 1 of the drum arc).** A single-voice, one-shot
          Sampler plays an audio buffer chromatically (keytracked playback rate
          around a root note). It is the first consumer of a new keystone
          **`sample` param kind** (a tagged-string ref: `builtin:<id>`,
          `asset:<id>`) - so the picker, MCP, persistence, and patches all
          project off the schema with no per-instrument branching. The shared
          voice was generalized from `oscillators` to
          `AudioScheduledSourceNode[]` so a buffer source reuses the base
          envelope.


          **Drum machine - `drumkit` instrument + step grid (slice 58).** A bank
          of one-shot sample players (up to `DRUMKIT_PADS`) where a played MIDI
          note *selects a pad* rather than pitching one sample. **Which note
          fires a pad is itself a param** (`pad{n}.note`, defaulting to a
          contiguous octave up from `DRUMKIT_BASE_NOTE`), so the mapping is data
          - visible in the panel, settable over MCP, remappable to a GM/hardware
          layout - and `Drumkit` resolves note -> pad from those params at play
          time (no hardcoded inverse). Each pad is a `sample` ref + note + level
          + tune (tune snaps to whole semitones via a new `step` on the number
          spec), all schema-driven, so it needs no per-pad code. The rack gives
          the kit its own `DrumkitPanel`: a compact pad-per-cell layout
          (note-name selector in the title, sample picker, horizontal Level/Tune
          faders) showing only pads in use plus an **Add pad** button. A
          drum-kit track edits notes as a **pad x step sequencer grid** or the
          ordinary **piano roll** via a per-track **Pads | Keys** toggle -
          "Keys" is the exact same `PianoRoll` via a thin `DrumRoll.tsx` wrapper
          passing one optional `rows` prop (rows map to pads, so a reserved left
          gutter reads "C4 Kick" beside the notes, loaded pads are tinted, and
          it frames to the assigned notes). Both drive the **same note-clip
          model**, so a beat is just notes. *Follow-ups: per-pad velocity/choke,
          a 16-step clip default.*


          **MIDI devices (note-transform pipeline).** A third device class on
          the note path, transforming notes *before* the instrument - the
          symmetric counterpart to an audio effect. Cataloged + schema-driven +
          per-track chain like audio effects; pure `(notes, range, ctx)`
          transforms run in the scheduler. **Octavator** and **arpeggiator** are
          both registered in `src/audio/midi/device/catalog.ts`. Design detail
          in the "MIDI effects (design)" context section; the chain-code
          duplication is ARCH-2.


          Deps: DAW-1.
        id: 019fae07-58b5-73d6-89f6-6d45b4f7dfc8
