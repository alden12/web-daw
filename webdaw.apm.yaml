      - ref: INST-2
        area: INST
        title: Effects chain
        status: done
        sort_path: "000002"
        priority: 0
        deps:
          - INST-1
        body: >-
          A per-track (and per-group) ordered effect chain, host-addressed,
          behind a uniform wet/dry `mix`.


          Shipped effects: Delay, Distortion, Reverb, Filter, **Chorus** (added
          purely through the registration API, proving the extension point), and
          **Bitcrusher** (per-sample quantize + sample-hold downsample, `bits` /
          `downsample` as real `AudioParam`s - impossible with native nodes, so
          it proved the worklet-effect path).


          The engine realizes the project as audio: per track `instrument ->
          fx... -> trackGain -> master -> limiter -> destination`
          (`src/audio/engine/AudioEngine.ts`). Chain CRUD (add / remove / move /
          bypass) flows through the same `dispatch` seam, so it is undoable, in
          the feed, two-voice, and persisted; `EffectChain` is the shared UI. A
          worklet effect is the same three-touch extension as any effect (class
          + catalog + registry), so it appears in the UI rack and the MCP
          palette automatically.


          Deps: INST-1.
        id: 019fae07-73c8-779a-8876-92611a70a6e5
