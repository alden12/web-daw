      - ref: AGENT-23
        area: AGENT
        title: Two MCP clients on one machine collide on the WebSocket port
        status: to-do
        sort_path: "000023"
        priority: 0
        body: >-
          `server/index.ts` binds a fixed `ws://localhost:8765` and calls
          `process.exit(1)` on `EADDRINUSE`. That is deliberate and correct for
          avoiding orphans, but it means **the second concurrent MCP client on
          the same machine silently gets no web-daw tools**: its server spawns,
          exits immediately, and the tool list is simply missing with no in-app
          signal.


          **Hit in practice on 2026-07-30.** A day-old VS Code Claude session
          still held the port; a new session in the same repo had no `web-daw`
          MCP at all. Diagnosing it meant `lsof`-ing the port and walking the
          process tree back to the other editor window. The failure presents to
          the user as "my MCP won't connect", with nothing pointing at the real
          cause.


          **Options, cheapest first.**

          - *Make the conflict legible.* The exit message already says the right
          thing but lands on stderr where the client may not surface it. Failing
          with a tools-visible error, or registering a single tool that reports
          the conflict, would turn a mystery into a one-line fix.

          - *Probe for a free port* and publish the chosen one where the tab can
          find it (the tab currently dials a constant). Removes the collision
          but means the DAW tab has to discover the port.

          - *One server per machine, later clients proxy to it.* Closest to the
          truth of the system, since the DAW tab is a single WebSocket peer and
          a second server has nothing to talk to. More work, and it raises the
          question of which client's edits win.


          Low urgency, but it is a sharp edge for exactly the power-user
          workflow AGENT-1 describes (MCP in a second window), and it will bite
          harder as more sessions run concurrently.
        id: 019fb3c7-7c7a-764c-ac83-f5eaef4a3c7f
        created_at: 2026-07-30T16:07:03.035Z
        updated_at: 2026-07-30T16:07:03.035Z
        notes:
          - body: >-
              **Reviewed 2026-07-31; two refinements that change the option
              ordering above.**


              **`WEBDAW_WS_PORT` is not merely unfinished - setting it today
              actively breaks the app.** `server/index.ts:14` honours the env
              var, but `AppShell.tsx:272` calls `connectMcpBridge` with no
              `url`, so the tab always dials the constant at `bridge.ts:40`.
              Moving the server therefore moves it away from the only address
              the tab knows, and the bridge silently stops connecting. So the
              case for wiring the client half is not "the seam is incomplete",
              it is "there is a documented knob that breaks the product" - which
              makes it the cheapest and highest-value item here, ahead of both
              port-probing and the proxy.


              **The tab should name the server it connected to.** Suggested from
              the apm side, whose viewer feed returns the store path so the page
              can say which file it is showing; the analogue here would have
              turned this ticket's diagnosis (`lsof` the port, walk the process
              tree back to another editor window) into reading the screen.


              **Sharper still, found while checking the code:** the tab does not
              merely fail to say *which* server - it says nothing at all.
              `McpStatus` is a bare `"connecting" | "connected" |
              "disconnected"` with no endpoint in it, and
              `CenterWorkbench.tsx:119` renders the chip **only** when
              connected. That was a deliberate call (commit `6d514b4`, "quiet
              the MCP indicator when disconnected") and it is right for the
              common case, where MCP is not in use and a permanent dead dot
              would be noise. But it means the collision is invisible from both
              ends at once: no `web-daw` tools in the MCP client, no indicator
              in the tab, and nothing anywhere saying something tried to connect
              and failed.


              Suggested resolution keeping that intent: stay quiet while
              `disconnected` *and* never-connected, but surface the chip - with
              the endpoint and an error tint - once a connection has been
              attempted and refused. Carrying the resolved URL on `McpStatus` is
              the enabling change and is small.


              Also worth noting this is the third instance of one pattern across
              yesterday's bugs: a silent failure where the diagnostic exists but
              is not surfaced (this hidden chip, the apm server's stderr-only
              port message, and the acknowledged-but-unwritten ticket).
            audience: user
            id: 019fb782-dfea-733c-8879-dc89ef9ccdae
            at: 2026-07-31T09:30:35.370Z
            actor: claude
      - ref: AGENT-24
        area: AGENT
        title: The loop costs too much per turn
        status: to-do
        sort_path: "000024"
        priority: 0
        deps:
          - AGENT-10
        body: >-
          One musical phrase through the in-app agent on Sonnet cost roughly **a
          dollar**, and hit the step limit before finishing. Measured
          2026-08-10. That is too expensive to iterate on the thinking loop
          with, and it is the same dollar a user with their own key would pay -
          so this is a product problem, not only a development one.


          Three things compound in `agent/loop.ts`, and they multiply rather
          than add:


          - **No prompt caching.** The Anthropic entry in `providers.ts` points
          at `api.anthropic.com/v1` and speaks the OpenAI-compatible dialect,
          which does not carry `cache_control`. Every step therefore pays full
          input price for a prefix that is almost entirely identical to the last
          one. Native Anthropic caching bills a repeated prefix at a fraction of
          that. Confirm what the compat layer supports before assuming it has to
          mean a native provider path - if it does, the provider seam is the
          place for it, not the loop.

          - **The whole conversation is re-sent every step.** Each round appends
          the assistant turn plus every tool result and re-posts the lot, so
          early tokens are paid for once per remaining step. Cost grows with the
          square of the step count, not linearly.

          - **Tool results are never trimmed.** `list_samples` returns the whole
          builtin catalogue and `list_parameters` a full parameter dump per
          track, and they sit in the context for the rest of the run whether or
          not anything still refers to them.


          Also: `maxSteps` defaults to **8** and `useAgentChat` never passes
          one. That budget was set when the loop was driven by cheaper, chattier
          models; a model that plans in bigger strides runs out of steps
          mid-phrase and says so. It should at least be configurable, and
          probably scaled to what the model is.


          ## Worth deciding while measuring


          Whether the fix is to cache the prefix, to stop resending it, or both
          - they overlap, and caching a prefix that should not have been resent
          is the wrong order to do them in. Measure first: the run result
          already carries `usage`, so the cheapest instrument is to log input
          tokens per step for one real phrase and look at the shape of the curve
          before changing anything.


          ## On testing this cheaply, and why it is not a plan


          A local shim (an OpenAI-compatible endpoint backed by the Claude Agent
          SDK, added as one more entry in `PROVIDERS`) would let development
          runs draw on a Claude subscription instead of an API key. Checked
          2026-08-10, and two things bound it:


          - **Only for our own use, never shipped.** Anthropic's Claude Code
          legal terms permit OAuth/subscription auth for "ordinary, individual
          usage" but do not permit third-party developers "to offer Claude.ai
          login or to route requests through Free, Pro, or Max plan credentials
          on behalf of their users". A local dev provider is fine; the same
          thing in the deployed app is explicitly not.

          - **It is not free headroom, and it is unstable.** A separate monthly
          Agent SDK credit ($20 Pro to $200 Max 20x) was announced for
          2026-06-15 and **paused on the day**; today Agent SDK / `claude -p`
          usage draws from the same subscription usage limits as interactive
          Claude Code, so it competes with our own coding sessions rather than
          adding to them. Anthropic paused it because heavy agent use on
          subscriptions is a large subsidy, and has said it will revisit - so
          this is a way to make development cheaper today, not a foundation to
          build on.


          Which is the argument for doing this ticket regardless of which key
          pays: the efficiency is the durable fix.


          Blocked on nothing, but deliberately queued behind the current review
          (2026-08-10).
        id: 019fed31-44e2-765d-8f71-9e264084d282
        created_at: 2026-08-10T19:40:56.930Z
        updated_at: 2026-08-10T19:48:00.556Z
      - ref: AGENT-25
        area: AGENT
        title: A local provider backed by the Agent SDK, so the loop can be developed
        status: to-do
        sort_path: "000025"
        priority: 0
        deps:
          - AGENT-24
        body: >-
          Refining the thinking loop needs a lot of runs, and every run
          currently costs API tokens paid for separately from the Claude
          subscription the development already runs on. That cost is the thing
          suppressing the testing - the loop is under-developed because trying
          things is expensive, which is the wrong reason for a design to stay
          where it is.


          **Local only, deliberately.** At the desk this needs no settings UI at
          all: the shim is on a known port, so the provider entry carries a
          fixed `baseUrl` and there is nothing to type. Reaching it from
          elsewhere (a phone, while out) needs a configurable endpoint and a
          tunnel, and that is AGENT-26 - split off because localhost already
          buys the whole point of this ticket, which is being able to try
          things.


          **The seam already exists.** `PROVIDERS` in `agent/providers.ts` is
          plain data over an OpenAI-compatible `baseUrl`, and `provider.ts` is
          generic across it; `AgentSettings.tsx` iterates `PROVIDER_IDS`, so a
          new entry appears in the picker for free. The work is a small Node
          server that accepts `/chat/completions` with tool specs, drives the
          Claude Agent SDK, and translates the reply back. Nothing else in the
          app changes.


          **Single-turn, with the SDK's own tools off.** The Agent SDK runs its
          own agent loop; if it is left to do so we would be testing *its* loop
          rather than ours, which is the one thing this ticket exists to
          develop. The shim asks for one completion at a time and hands our tool
          specs through, so `runAgent` stays the thing under test.


          ## Constraints, not preferences


          - **It must not ship.** Anthropic permits subscription auth for
          "ordinary, individual usage" but does not permit third-party
          developers "to offer Claude.ai login or to route requests through
          Free, Pro, or Max plan credentials on behalf of their users" (Claude
          Code legal terms, checked 2026-08-10). A localhost entry is inert in a
          deployed build, but gate it out of production anyway rather than
          relying on that: an entry offering a Claude-subscription-backed
          provider should not be in the bundle a user downloads, whether or not
          it would resolve.

          - **It is not free headroom.** Agent SDK usage currently draws from
          the same subscription limits as interactive Claude Code (the separate
          monthly credit was announced for 2026-06-15 and paused on the day).
          Testing competes with our own coding sessions, and Anthropic has said
          it will revisit. Build this to make development cheap now, and do not
          let the loop's design come to depend on it.


          ## What it does not replace


          Token accounting through the shim will not represent what a BYOK user
          pays, so AGENT-24's measurements have to be taken against a real API
          key. This makes iteration cheap; it does not make the efficiency work
          optional, which is why it sits after it.
        id: 019fed3b-ffa0-71e8-be8f-9192edeb8cd4
        created_at: 2026-08-10T19:52:40.096Z
        updated_at: 2026-08-10T20:04:52.972Z
      - ref: AGENT-26
        area: AGENT
        title: Point the agent at any OpenAI-compatible endpoint
        status: to-do
        sort_path: "000026"
        priority: 0
        deps:
          - AGENT-25
        body: >-
          A base-URL field in the agent settings, so the provider can be an
          endpoint the user names rather than only one of the three we ship. **A
          real feature, not a development backdoor** - it is how someone points
          the agent at Ollama or any local/self-hosted model, and it is the
          honest way to ship what AGENT-25 builds for the desk.


          Small, because the shape is already there: `AgentConfig` holds `keys`
          and `models` as `Partial<Record<ProviderId, string>>`, so this is a
          third map of the same kind (`baseUrls`), plus one more `PROVIDERS`
          entry with a blank `baseUrl` meaning "the user supplies it".
          `AgentSettings.tsx` iterates `PROVIDER_IDS`, so the picker needs no
          change; the only new control is the URL field.


          - **The key stays optional**, since a self-hosted endpoint may want
          none - but keep it *supported*: a shared secret typed there and
          checked by the endpoint is a second lock, useful where the first one
          is a network boundary.

          - **The model becomes free text** with no suggestions, which the field
          already allows (`models` is described as a few well-known ids for the
          picker, not a constraint).


          ## What it unlocks, and the line it must not cross


          The motivating case is testing prompts away from the desk: the
          AGENT-25 shim on an always-on machine, reached from a phone. Two
          requirements fall out of the browser calling providers directly - the
          endpoint must terminate **TLS** (an HTTPS app will not call `http://`)
          and must send **CORS** headers for the app's origin.


          It must be reached over a **private tunnel** (Tailscale, or an
          access-controlled equivalent), not published. The credentials stay on
          one machine, and "my own requests from my own devices" stays
          unambiguous in a way that a subscription-backed endpoint on a public
          host does not - the permitted case is ordinary individual usage, and
          the prohibited one is routing requests through plan credentials on
          behalf of users. This ticket ships the *field*; what a developer
          points it at is theirs, and nothing about a Claude subscription is
          offered to anyone by the app.
        id: 019fed47-6f4a-719a-9e0a-18b0db4e1f86
        created_at: 2026-08-10T20:05:09.579Z
        updated_at: 2026-08-10T20:05:09.579Z
      - ref: ARCH-1
        area: ARCH
        title: Split projectStore / state management
        status: to-do
        sort_path: "000001"
        priority: 0
        body: >-
          `projectStore.ts` has grown oversized (the repo conventions already
          flag it as a file to chip away at, alongside `AudioEngine.ts` and
          `ArrangementTimeline.tsx`).


          To be clear on one question that comes up: it has **not** moved
          server-side - the sync service persists project *data* through the
          storage seam, but the in-memory `ProjectStore` (tracks / params /
          clips plus the mutators the reducers call) stays client-side and is
          the app's central store.


          Two ways to tame it, both keeping the `dispatch` / edit-log seam
          intact:


          (a) **split into focused sub-stores** by responsibility (tracks,
          transport, selection, devices, ...) behind the same seam; or

          (b) **adopt a store library (zustand)** for selectors + fine-grained
          subscriptions, shrinking the bespoke wiring and re-render surface.


          Prefer whichever keeps the reducers / `applyEdit` boundary unchanged
          so persistence and history are unaffected.


          Sibling concern: AGENT-19 chips away at the oversized `AudioEngine.ts`
          by extracting a shared graph builder.
        id: 019fae0d-20f3-7238-8e12-40ca9b89b01f
        created_at: 2026-07-29T13:25:23.827Z
        updated_at: 2026-07-29T13:25:23.827Z
      - ref: ARCH-2
        area: ARCH
        title: Share MIDI and audio device-chain code
        status: planning
        sort_path: "000002"
        priority: 0
        deps:
          - INST-1
          - INST-2
        body: >-
          The MIDI device chain (the note-transform pipeline for the arpeggiator
          / octavator / Euclidean sequencer) looks to **duplicate parts of the
          audio effect-chain code**: an ordered chain of devices with add /
          remove / reorder, per-device param stores, and host-addressing are
          common to both.


          Investigate a shared **"device chain"** abstraction the two families
          reuse - the chain container, ordering, and param plumbing are likely
          the shared core; only the payload differs (a note transform vs an
          audio node).


          Would cut the duplication and keep the two device families consistent
          (one place to fix a chain bug, one addressing scheme).


          Needs a look at the MIDI-device (`src/audio/midi/device/`) and
          effect-chain code to confirm the shared surface before committing to
          the abstraction.


          ## Also in scope: built-ins are registered twice


          Adding a built-in device means editing **two hand-maintained lists**
          plus the def file. For MIDI devices that is `registerMidiDevice({
          type, label, schema })` in `catalog.ts` *and* the factory list in
          `registry.ts`; the audio effects have exactly the same split (7
          `registerEffect` calls in `effects/catalog.ts`, 7
          `registerEffectFactory` calls in `effects/registry.ts`), as do
          instruments. The data/code split itself is right and load-bearing -
          `catalog.ts` must stay DOM-free so the Node MCP server can hold it -
          but the *list of built-ins* should not be maintained in both halves.


          A `MidiDeviceDef` already carries `type`, `label` and `schema`, so the
          catalog entry is pure restatement. One exported list of defs (e.g.
          `devices/index.ts`) that both halves derive from would make adding a
          built-in a single edit. The blocker is a small import cycle to unpick
          first: the device defs currently import their schemas *from*
          `catalog.ts`, so `catalog.ts` cannot import the defs. Moving each
          device's schema into its own device file fixes that and reads better
          anyway - one file per device, holding its schema and its transform.


          The effect side only partly fits the same shape: `delay`, `distortion`
          and `tremolo` are `GraphEffect` over a def, but `reverb`, `filter`,
          `chorus` and `bitcrusher` are bespoke classes, so their factories
          cannot be derived from data alone. A registration helper that takes
          `(def, factory)` and writes both halves would cover every case without
          forcing the bespoke ones into a graph.


          Worth doing alongside the chain abstraction, since both are about
          making the device families one thing rather than two parallel ones.
          Note this is the *built-ins ergonomics* problem, distinct from the
          third-party loading story (INST-5) and from the missing note-path
          authoring format (INST-11).
        id: 019fae0d-3a4a-727a-8d2a-2be55efb30f7
        created_at: 2026-07-29T13:25:30.314Z
        updated_at: 2026-07-30T16:07:18.050Z
      - ref: ARCH-3
        area: ARCH
        title: Editing preferences are app state, not component state
        status: in-progress
        sort_path: "000003"
        priority: 0
        body: >-
          Raised during the MOBILE-1 code review, as a deliberate architectural
          decision rather than a drive-by cleanup.


          **The observation.** The touch shell needs the active surface's
          toolbar in its single ⋮, so surfaces publish menu items through
          `surfaceControls.ts`. That inversion (a child authoring what a parent
          renders) prompted the question: should an outer component own all of
          this state and render the controls per view, later per route?


          **Half yes.** The *state* those items are built from is genuinely
          app-level and was misfiled as component state. The *composition* -
          which items a surface offers - should stay with the surface.


          **We were already paying for the misfiling.** `usePersistent*` was a
          plain `useState` seeded once on mount with **no cross-instance
          notification**, so two components reading one key diverged silently
          the moment either wrote. Not hypothetical: `web-daw:metronome` is read
          by both `TransportBar.tsx:41` and `MobileShell.tsx:341`, mounted
          together on touch, and only stayed correct because of a hand-written
          guard (`if (compact) return`) standing one copy down. Ownership was
          being negotiated per feature, in prose.


          **The line to draw** is the one `ShellProps` already draws for the two
          shells: anything a shell may not differ on is shared; pure geometry
          stays private. The ~21 persisted keys split cleanly along it:


          - *Semantic editing preferences* - `roll-snap-on`, `arr-snap-on`,
          `arr-snap-div`, `count-in-bars`, `QUANT_KEYS.*`, `metronome`,
          `roll-vel-open`. The user's editing intent; belongs to no component.

          - *Pure geometry* - `lib-width`, `agent-width`, `timeline-height`,
          `devices-height`, `arr-header-w`, `roll-vel-height`, the zoom levels,
          the collapsed flags. One shell's layout; stays where it is.


          **Why composition stays with the surface.** A central owner knowing
          that the Edit view offers snap/quantize/velocity means the shell knows
          every surface's feature set, and adding a surface edits the shell -
          the "hardcode the catalog" shape ruled out for instruments and
          effects, and the reason the code prefers object maps to `switch`.
          Routing does not change this: the route decides what mounts and the
          mounted thing declares what it offers, rather than a hand-maintained
          route -> controls map.


          **Plan, in order.**

          1. **Done** (in the MOBILE-1 branch). Extracted
          `src/ui/persistentStore.ts` - one raw value per storage key, cached
          and authoritative, with a subscribe seam - and made `usePersistent*` a
          thin `useSyncExternalStore` binding over it. Every reader of a key now
          sees one value. The public hook API is unchanged, so none of the 37
          call sites moved. Covered by `test/persistentStore.test.ts` (8 tests:
          the drift case, per-key isolation, no-notify-on-unchanged,
          unsubscribe, and the private-mode path where storage throws).

          2. Move the ~7 semantic preferences behind a small prefs store on the
          same pattern (`currentUser.ts`, `authorColors.ts`, `gridView.ts`).
          Leave the geometry keys alone. Then `TransportBar`'s `if (compact)
          return` guard can be re-examined on its own merits, as a question of
          who drives the scheduler rather than a workaround for drift.

          3. Keep the `surfaceControls` registry, now thin: items become
          `f(store, a few local actions)` rather than stateful publishing.


          **Not adopting a state library (zustand et al.) for this.** The
          problem was one hook that did not notify, not the ergonomics of
          writing stores. The ~10 existing stores are already granular enough
          that selector subscriptions would buy little, and the audio layer must
          stay framework-free for the Node MCP server, so a React-oriented
          library would split the codebase into two store patterns rather than
          one. Worth revisiting if we need cross-store derived state or
          middleware we would otherwise hand-roll (undo, devtools, persistence -
          zustand's `persist` is close to what step 1 hand-rolls). Deferring is
          cheap because every store exposes read/subscribe, so one can be
          swapped underneath without touching consumers.


          **Related.** The staleness bug fixed in the same review (`Menu` now
          takes a getter, so the shell's ⋮ cannot show a stale tick or a stale
          `disabled`) is a symptom of the same root cause: the shell does not
          re-render for state it does not own. Step 2 removes that condition
          rather than working around it.
        id: 019fb7bf-253b-735e-bcb3-2cf3eeaddc1c
        created_at: 2026-07-31T10:36:25.275Z
        updated_at: 2026-07-31T10:36:25.275Z
      - ref: ARCH-4
        area: ARCH
        title: Enforce the layering rules with dependency-cruiser
        status: to-do
        sort_path: "000004"
        priority: 0
        body: >-
          The architectural rules in `CLAUDE.md` are prose, enforced by
          discipline and by whatever `tsc` happens to catch. Make the
          load-bearing ones machine-checkable with **dependency-cruiser**, and
          get an architecture graph out of the same config.


          ## Why this one, and not eslint


          Three motivations, and dependency-cruiser is the right tool for two of
          them:


          - **Cycle detection.** Nothing in the current gate set (`build`,
          `test`, `test:e2e`, `tsc`, `eslint`) looks for import cycles -
          TypeScript compiles them happily, and they surface later as an
          undefined constant at module init. This has already bitten us once:
          `src/ui/arrangement/shared.ts` exists specifically so the timeline
          shell and its row/lane parts can agree on geometry "without a circular
          import". That was solved by hand; nothing stops the next one.

          - **Layering as data, not prose.** A `.dependency-cruiser.js` with
          `from`/`to` patterns and a `comment` per rule is the same move as the
          param-schema keystone: the set of rules becomes data, easy to extend
          and hard to leave unhandled.

          - **The graph.** `--output-type archi` (folder-level) for the
          at-a-glance view, and `--affected <base-ref>` to see the blast radius
          of a slice, which suits the stacked-PR workflow.


          The alternative considered was `eslint-plugin-boundaries` /
          `import/no-restricted-paths`, which would do the layering half inside
          the lint gate we already run with no new dependency. It loses on the
          other two: `import/no-cycle` is slow, and there is no visualization.


          ## Rules to start with


          Deliberately small. Ratcheting rules, not aspirational ones - all of
          these hold today (verified by grep), so adopting them needs no
          cleanup:


          - `no-circular` (error)

          - `no-orphans` (warn)

          - `src/audio` must not import `src/ui` - currently zero violations

          - `server/**` must not reach `src/audio/**/registry.ts` or
          `src/audio/engine/**` - this is the "keep the Node MCP server
          DOM-free" rule. It is *partly* enforced today by
          `tsconfig.server.json` omitting the DOM lib, but that fails with a
          confusing error deep in a transitive import rather than naming the
          boundary that was crossed. `server/mcpServer.ts` legitimately reaches
          ~15 modules under `src/audio` (the catalogs, `params/validate`,
          `sequencer/quantize`, `graph/zod`, `mcp/protocol`), so the rule has to
          name what is *not* allowed rather than allow-list the whole surface.

          - `src/contract` must not import `src/ui`

          - `not-to-dev-dep`


          ## Config nuance worth knowing up front


          With `tsPreCompilationDeps` on, **type-only imports are counted as
          dependencies**. Several are harmless and cross boundaries deliberately
          (`server/mcpServer.ts` imports `type NoteEvent` from
          `src/audio/sequencer/types`). Exempt type-only imports from the
          layering rules or the output is noise.


          ## Scope


          Its own small PR: add the dev dependency and config, run it against
          the current tree *first* to confirm none of the proposed rules are
          already violated, add a `yarn graph` script (mermaid output, so it
          renders without a local graphviz), and wire `depcruise` into CI next
          to `lint`. Do not try to encode every convention - the
          catalog-iteration rule ("UI and MCP must iterate the catalogs, never
          hardcode") is about content, not dependencies, and this tool cannot
          check it.
        id: 019ff322-be75-749d-a826-3360d8f39c77
        created_at: 2026-08-11T23:22:48.309Z
        updated_at: 2026-08-11T23:22:48.309Z
      - ref: COLLAB-1
        area: COLLAB
        title: Real identity on the log
        status: done
        sort_path: "000001"
        priority: 0
        deps:
          - HOST-2
        body: >-
          *Deps: HOST-2.*


          **Authorship colour model - a projection of the log, not a stored
          field.** The keystone already stamps every edit with its author (that
          is how the two-voice colouring works), so "who last touched this
          clip/track/param" is a *query over the command log* and the colour is
          a *view*, never a property saved on the object. This composes with
          versioning for free (the overlay at any commit is just the log up to
          that point) and needs no format change.


          **Done:** per-user identity on the log plus perspective-relative
          colours have shipped (slices 73-75, 80 - see HOST-2 for the slice
          detail). `author` generalised from a 3-role enum to a bounded free
          string (`claude`/`agent` reserved AI voices, `you` the default; any
          other value a human user id). Colour is **perspective-relative**:
          `colorForAuthor(author, config, self)` paints the viewer's OWN edits
          with the teal "you" hue (whoever they are) and every collaborator in
          their own stable hashed hue; `agent`/`claude` stay absolute voices.
          The Authors settings tab lists collaborators seen in the feed, each
          with its own swatch picker.


          **One view this unlocks: historical blame** - a toggleable git-blame
          overlay tinting objects by last author, off by default (a permanent
          border on everything is noise), decaying or on-demand so the
          arrangement stays readable. The ephemeral *live-presence* view is
          COLLAB-2.


          **Open question - role vs identity are two axes.** Today's colours
          encode *role* (you / agent / claude); multi-user adds an *identity*
          axis (an open set of people). An option is to keep the
          teal/violet/coral accents for role and assign each human a stable hue
          (hashed id into a curated palette) for presence/blame, defaulting the
          overlay to track/clip granularity and drilling to note/param on demand
          so a busy piano roll does not turn to confetti.


          Note the `dispatch` seam audit this implies: building the blame
          overlay forces a check that *every* mutation flows through `dispatch`
          - anything poking `ProjectStore` directly is invisible to the log and
          would be invisible to any future sync. Finding those holes offline is
          far cheaper than debugging them later as merge desyncs.
        id: 019fae0c-1ac2-70cf-9f2e-02870bcd4b5f
        created_at: 2026-07-29T13:24:16.706Z
        updated_at: 2026-07-29T16:00:50.994Z
      - ref: COLLAB-2
        area: COLLAB
        title: Presence and live cursors
        status: to-do
        sort_path: "000002"
        priority: 0
        deps:
          - COLLAB-1
          - HOST-1
        body: >-
          **Live presence - an ephemeral per-person hue on a cursor /
          selection.** Showing what someone is touching *now* (the Figma /
          Google-Docs experience, where most of the "easy to follow who's doing
          what" value lives).


          It carries no document state, so a bug can flicker a cursor but never
          corrupt a project - which is why it is the natural first networked
          step. It also validates the transport + identity plumbing before any
          data rides on them. Presence needs none of the concurrency machinery:
          who-is-online + cursors is a small ephemeral broadcast over the same
          channel, never persisted (it lives in the room instance's memory / a
          pub-sub bus).


          The **concurrency model for shared editing is already decided and
          largely built** - see HOST-1: server-authoritative total order +
          optimistic apply + rebase, LWW by `seq`, not OT and not CRDT. The
          rationale, the library/lock-in survey, and the scaling analysis are
          recorded in the "Collaboration - options and rationale" context
          section.


          **Remaining for shared editing after presence:** per-user undo (undo
          *my* edits, not everyone's), and the explicit drop-or-resurrect rule
          for an op referencing something another user just deleted.


          Deps: COLLAB-1, HOST-1.
        id: 019fae0c-3a96-705e-b07b-5500904a988a
        created_at: 2026-07-29T13:24:24.854Z
        updated_at: 2026-07-29T16:00:51.951Z
      - ref: COLLAB-3
        area: COLLAB
        title: Comments and review flow
        status: to-do
        sort_path: "000003"
        priority: 0
        deps:
          - COLLAB-2
          - HOST-6
        body: >-
          A candidate collaboration surface: threaded comments anchored to
          objects (a clip, a track, a param, a point in time) plus a lightweight
          review flow over the commit DAG, so collaborators can discuss and sign
          off on changes rather than only editing them directly.


          Not designed in detail; captured as a follow-on once real identity
          (COLLAB-1) and live presence (COLLAB-2) are in place.


          Deps: COLLAB-2.
