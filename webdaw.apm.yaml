      - ref: HOST-10
        area: HOST
        title: "MCP mirror: stream edits instead of full snapshots"
        status: to-do
        sort_path: "000010"
        priority: 0
        deps:
          - AGENT-1
        body: >-
          **Tech debt.** The local Node MCP server keeps a full `ProjectStore`
          mirror of the tab (`server/mcpServer.ts`), kept current by inbound
          sync messages.


          The high-frequency edits already delta (`paramChanged`,
          `clipSnapshot`), but **every structural/transport emit ships the whole
          `ProjectData`**: `bridge.ts`'s `wireOutbound` sends a
          `projectStructure` snapshot on each `projectStore.subscribe` fire.


          The pathological case is a continuous drag of a structural control (a
          volume fader, or a tempo / time-signature numerator), which calls
          `emit()` per frame -> a full-project `JSON.stringify` ~60x/sec on a
          large project.


          It runs over localhost (loopback) and only when an MCP client is
          connected, so the cost is serialization CPU / GC, not network bytes -
          hence debt, not a live bug.


          **Fix:** send the `EditCommand` and `applyEdit` it into the mirror
          (the append-edits model the network authority already uses,
          `server/api/rooms.ts`) - O(edit), not O(project).


          **Cheap stopgap:** rAF/debounce the `projectStructure` send so a drag
          collapses to one snapshot at drag-end.


          Deps: AGENT-1.
        id: 019fae0f-ab24-7724-b8ee-33cab1828ebd
