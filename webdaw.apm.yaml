      - ref: DAW-12
        area: DAW
        title: Key and tonic-relative intervals
        status: planning
        sort_path: "000012"
        priority: 0
        deps:
          - DAW-5
          - INST-1
        body: >-
          Make **key** (a `{ tonic: 0-11, scale/mode }`) a first-class musical
          unit that the roll display and the computer-keyboard input are both
          projections of. Pairs with the flagship synth (INST-5) as its
          test-bed.


          The two halves reinforce each other: a tonic-relative model is
          precisely what lets the QWERTY keyboard span **4 octaves**, because
          diatonic degrees pack ~7 per octave (one keyboard row) where chromatic
          needs 12 (which doesn't fit a 10-key row).


          - **Data model unchanged.** `NoteEvent.pitch` stays **absolute MIDI**
          (transposition-safe, interop-friendly, and the scheduler/engine never
          learn about keys). Key is an **input/display layer**: display maps
          absolute -> degree; the keyboard maps degree -> absolute. A pure
          projection, no persistence change - the same "everything is a
          projection of the schema" discipline the rest of the app follows. Key
          lives at **project level** first; per-clip / per-section overrides are
          a clean follow-on.

          - **Keyboard = diatonic by default.** Replace the hardcoded
          single-octave `KEY_MAP` (`AppShell.tsx`) with a map **generated from
          the current key**: the four letter/number rows become four octaves of
          the scale, so playing is always "in key". A modifier (e.g. Shift)
          raises a semitone for accidentals; the layout mode (diatonic vs a
          chromatic / isomorphic option) can be a setting.

          - **Display = scale highlighting first, note colour last.** Hue is
          reserved for the two-voice authorship coding, so degree must **not**
          ride on hue. First cut: **scale highlighting on the piano-roll lane
          backgrounds** (in-key rows lit, the tonic row accented) plus optional
          **degree labels** on notes (`1 b3 5`...). Note *fill* stays authorship
          colour. A later opt-in can encode degree on a non-hue channel
          (brightness / saturation within the authorship hue) so both codings
          coexist.

          - **MCP payoff:** exposing key in project state lets the agent compose
          diatonically ("add a ii-V-I in the project key"). Pairs with the
          autotune scale-snap layer under audio pitch & time (INST-7).
        id: 019fae04-4269-7649-9153-7bd2abce8210
        created_at: 2026-07-29T13:15:42.569Z
        updated_at: 2026-07-29T16:00:33.171Z
      - ref: DAW-13
        area: DAW
        title: Audio export and mixdown
        status: to-do
        sort_path: "000013"
        priority: 0
        deps:
          - AGENT-4.1
        body: >-
          There is currently **no way to get a finished track out of the DAW as
          audio.** The `.daw.zip` export is the *project* bundle, not a rendered
          mix, and `OfflineAudioContext` appears only under the agent-ears work.


          Render the arrangement offline to a buffer and encode it out (WAV
          first, then MP3 / stem options), surfaced as a transport / File
          action. Every segment needs this and it plausibly gates any public
          launch.


          Engine work is a **shared offline-render core** with the agent's
          objective DSP analysis ticket: build the offline render once
          (client-side, the exact DSP graph the user hears) and both
          mixdown-export and the agent's ears draw on it - so the two are best
          built together, with export the more fundamental of the pair.


          This is also where provenance stripping happens (see the
          "local-by-default provenance" agent ticket): export / bounce strips
          authorship and agent-intent metadata unless the user explicitly opts
          in.


          Not research-driven; found while mapping the roadmap.
        id: 019fae04-5b6e-76cd-9ecb-604ffae6b1b8
