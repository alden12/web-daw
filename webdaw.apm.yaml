      - ref: DAW-25
        area: DAW
        title: "Project tree: a clip depth (browse, select, drag) - and the touch
          shell's Clips tab"
        status: planning
        sort_path: "000025"
        priority: 0
        deps:
          - MOBILE-1
        body: >-
          Give the **Project** rail view (`ProjectView`) a third depth: group ->
          track -> **its clips**. The tree becomes a whole-project overview:
          structure, per-track mixer (already there), record, and every clip in
          the project in one place.


          **Scoped down 2026-07-30 after review.** This ticket originally had
          the clip rows launchable, framed as "the vertical answer to DAW-3's
          deferred session grid". The user's steer was that these are two
          separate ideas and should stay separate: **the tree is for browsing -
          selecting a clip for edit and dragging clips around** (into the
          arrangement, onto another track). *Composing* and *triggering* clips
          is a different surface, now DAW-26 (sections), whose sections appear
          as their own branch of the same tree. So no launch control on a clip
          row here; a clip row selects, and drags.


          **Then the touch shell's Clips tab becomes this view instead of the
          selected track's clip pool** (MOBILE-1 round 2 shipped it as a
          per-track grid). On a phone that is a strict upgrade: every clip in
          the project rather than one track's, plus record-into-track and the
          mixer folded into the same surface, so one tab covers what three
          would. Note the tier honesty - dragging a clip from a tree onto the
          timeline needs both visible at once, which is a desktop/tablet
          gesture; the phone gets tap-to-select and (via DAW-26) tap-to-launch.


          **No model change:** clips, `selectClip` and placement drag-and-drop
          all exist and flow through dispatch, so anything done from here is
          undoable, in the feed, two-voice coloured and MCP-addressable for
          free.


          **One design caution:** a row that both selects and drags is fine, but
          if DAW-26's section rows land in the same tree, their launch control
          must be its own hit target or a tap meant to select starts audio.
          `ClipRail` already solves that with a play/stop button inside each
          chip - reuse it, don't invent.


          **Effort:** small. `ProjectView` is ~200 lines with a `flattenTree`
          and a `Row` union, so this is a new `{ kind: "clip" }` row plus a row
          component.


          Proposed by the user, 2026-07-30, while reviewing the touch shell.
        id: 019fb2df-c389-7732-ba9d-0c2758f5d908
        created_at: 2026-07-30T11:53:56.873Z
        updated_at: 2026-07-30T12:12:28.192Z
      - ref: DAW-26
        area: DAW
        title: "Sections: reusable multi-track clip fragments (instead of a session
          grid)"
        status: planning
        sort_path: "000026"
        priority: 0
        deps:
          - DAW-3
        body: >
          Proposed by the user, 2026-07-30, explicitly **in place of** copying
          Ableton's session grid: "if we wanted a way to compose clips, I might
          vote for a different view altogether where you could have multiple
          clip groups which you could build and would appear as a branch of the
          tree. Then you could trigger them from there, or drag them onto the
          timeline to bring in the whole clip group."


          A **section** is a named, reusable, position-free arrangement
          fragment: a set of clips across tracks at relative offsets. It can be
          launched (loop it instead of the timeline) or dragged onto the
          arrangement (stamp it in at a beat). This supersedes DAW-3's deferred
          "Session grid + scenes" item.


          **Name it `section`, not `group`.** `groups` is already taken in
          `schema.ts` (`groupDataSchema`: bus/mixer groups with
          `parentId`/`muted`/`solo`/`volume`) and across the MCP surface
          (`create_group`, `set_group`, `list_groups`). "Section" is also the
          musical word for what a captured bar range actually is.


          ## Why it is one model, not a bolted-on mode


          A section is a **nameless mini-arrangement**, so its data shape is a
          placement list minus the absolute start:


          ```

          Section = { id, name, members: Array<{ trackId, clipId, offsetBeats,
          offset, length }> }

          ```


          And the existing launched clip turns out to be **the one-member case
          of launching a section**. `scheduler.ts:261-262` already substitutes a
          synthetic placement array for a track's arrangement:


          ```ts

          const placements = track.launchedClipId
            ? [{ id: "__launch", clipId: track.launchedClipId, startBeat: loopStart, offset: 0, length: loopLen }]
            : track.placements;
          ```


          Launching a section is the same substitution with the member's
          `offsetBeats` added and the loop taken from the section's length
          rather than the transport's. That is the whole scheduler change - the
          same seam, generalised from one placement to a list. So this is a view
          *and* a small model addition, not a second playback engine.


          Two degenerate cases are worth stating, because together they are the
          argument that nothing is being given up by dropping the grid: **a
          launched clip is a one-member section**, and **a scene is a section
          whose every member sits at offset 0**. Sections are a strict superset
          of both, and add identity, repeatability and multi-bar span on top.


          ## Make it feel natural


          1. **Capture, don't compose.** The primary way to make a section is to
          select a bar range or a set of placements in the arrangement and "Save
          as section", auto-named (`Section 1`, or from its bars). Composing
          into an empty container is work with a deferred reward; naming eight
          bars you just liked is a reward for free. This is the single biggest
          naturalness lever, and it is what stops the Sections branch being
          permanently empty.

          2. **A section is a stamp, not a live instance (v1).** Dragging one in
          expands to real placements with no back-link. This dodges the entire
          instance/override/detach design space, and costs less than it sounds:
          **the clips are already shared references**, so editing the chorus
          bass line still changes every stamped copy. Only the *layout* is
          copied. Forward-compatible - adding an `instanceOf` field later
          upgrades a stamp to a live instance, whereas the reverse is not
          cleanly downgradable.

          3. **Tier the verb, not the object.** Drag-to-arrangement is
          desktop/tablet (it needs the tree and the timeline visible at once);
          tap-to-launch is the phone. One section, different reach.
          `ArrangementTimeline` already has the `dropBeat` hover state for a
          drop ghost.

          4. **Launch quantised to the bar**, like every clip launcher, or the
          gesture feels broken rather than late.

          5. **Separate hit targets on a tree row.** A row that both selects and
          launches must keep the launch control as its own target, or a tap
          meant to select starts audio. `ClipRail` already solves this with a
          play/stop button inside each chip.

          6. **Sections are a sibling branch of Tracks, not nested under one** -
          they span tracks, so they cannot live under a single track. Keeps the
          tree at Tracks -> track -> clip and Sections -> section -> member,
          rather than one four-deep spine.


          ## Effort: the selection model is the bulk of it, not the section


          Checked 2026-07-30: **the arrangement has no multi-select.**
          `arrangement/shared.ts` has `export type Selection = { trackId:
          string; id: string } | null` - one placement, and there is no range
          concept anywhere in `ArrangementTimeline` (only `markerBeat`, the
          paste marker). So "select these eight bars and save them" needs a
          selection model that does not exist. The section object itself is
          small (a schema addition, a scheduler generalisation at one line, a
          tree branch); the capture gesture is the real cost, and it should
          drive the estimate.


          **A bar range is probably cheaper than general multi-select, and a
          better fit.** A section *is* a bar range across tracks, so the
          selection can be a single `{ startBeat, endBeat, trackIds }` value
          with membership *derived* (every placement intersecting the range),
          rather than a set of individually-selected placement ids. One value to
          hold, one gesture to build it (a ruler drag or a marquee), and it
          generalises to the other things a range unlocks later -
          loop-to-selection, duplicate a range, delete a range. Worth deciding
          this first, because general multi-select is a much larger surface
          (shift-click, marquee, group drag, group resize) and would dwarf the
          feature it was added for.


          ## Open questions / risks


          - **Dangling members.** A section referencing a deleted track or clip.
          Resolve-at-use (skip missing members) is probably right, with a heal
          pass in `ProjectRepository.load` alongside the other bundle healing.

          - **Schema bump.** Sections live in `project.json`, so this needs a
          forward upcaster in `documentMigration.ts` (required now that projects
          are hosted).

          - **Does launching a section clear other tracks?** Ableton scenes
          leave non-member tracks alone; the current `launchedClipId` model is
          per-track, so leaving them is the cheap and probably correct answer,
          with `stopAllClips` as the escape.

          - **Where does the composing view live?** The user's framing is "a
          different view altogether", with sections appearing as a branch of the
          tree. The tree branch is the *browse/launch* surface; whether building
          one needs more than capture-from-arrangement plus add/remove-member on
          the branch is undecided, and the answer may be "no", which would be
          the cheapest good outcome.
        id: 019fb2f0-7f2d-76af-b126-c1034b100965
        created_at: 2026-07-30T12:12:13.485Z
        updated_at: 2026-07-30T12:23:17.566Z
      - ref: DAW-27
        area: DAW
        title: "Clock-driven MIDI generators: phase-lock the cycle to the transport"
        status: to-do
        sort_path: "000027"
        priority: 0
        body: >-
          The arpeggiator and the Euclidean sequencer place their *steps* on the
          transport beat grid while playing (`stepTimes` in
          `src/audio/midi/device/devices/stepStrategy.ts`), but the **cycle
          phase is anchored to the note onset, not the bar line**: `stepCount`
          starts at 0 on the first step after the held set becomes non-empty,
          and resets whenever it empties.


          **Consequence.** A clip whose note starts mid-bar puts the pattern's
          step 0 mid-bar too. Individual steps stay in time; which step counts
          as "step 0" floats. For the arpeggiator this is barely noticeable. For
          a Euclidean pattern it is audible, because `rotate` and `accent` are
          both defined relative to the cycle start - the accent that should mark
          the downbeat can land anywhere in the bar, and two tracks meant to
          interlock by rotation only do so if their notes happen to start
          together.


          **Options.**

          - *Derive the index from transport time.* While playing, compute
          `stepIndex` from the continuous beat (`floor(beat / stepBeats)`)
          instead of an incrementing counter, keeping the free-run counter only
          for the transport-stopped case. Makes pattern position a pure function
          of transport time, which also makes offline render identical
          regardless of where the render window starts - worth having for
          AGENT-21 render fidelity.

          - *Make it a choice.* A `sync` param (free / bar / pattern) so a
          deliberately drifting part is still possible. Closer to what hardware
          sequencers offer, and the drift is sometimes the point.


          Probably do the first as the default behaviour and add the second only
          if the free-running feel turns out to be wanted.
        id: 019fb3c7-4aad-7779-905f-a4c58f59907a
        created_at: 2026-07-30T16:06:50.285Z
        updated_at: 2026-07-30T16:06:50.285Z
      - ref: DAW-28
        area: DAW
        title: Note names on notes in the piano roll
        status: to-do
        sort_path: "000028"
        priority: 0
        body: >-
          Draw each note's name (`C4`, `F#3`) inside the note, in low-contrast
          ink, always on - not on hover, not selection-only.


          **Not a mobile-only improvement.** Reading pitch off a grid position
          against a key gutter is a chore at any screen size, and it gets worse
          the further a note sits from the gutter. This lands on desktop too; it
          surfaced while designing the touch roll (see the **Mobile editing
          surfaces (design)** context section) but nothing about it is
          phone-specific.


          - Hide the label below roughly 21px of note width, rather than
          clipping it.

          - On a selected note, shift the label clear of the resize handle.

          - Keep the contrast low enough that a dense roll still reads as shapes
          first. The label is for confirmation, not for scanning - if it
          competes with the note block for attention it has gone too far.


          Related: MOBILE-7 renders velocity as note fill strength. The two
          together are what let a phone drop the velocity lane entirely, and on
          desktop they mean the roll answers "what note, how hard" without a
          second lane or a hover.
        id: 019fb8c0-0fcb-7420-acaa-00a45ee59c2d
