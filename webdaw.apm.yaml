        (2); piano roll + playback + persistence (3); multi-track + instrument
        abstraction + FM (4); effect chains + the shared `bindParams` seam +
        master limiter (5).


        **6-8, the spine.** App-shell relayout in Tailwind - video-editor spine,
        agent pane, library tree - plus a conventions pass (zod validation, map
        dispatch, catalog-driven) (6); the data-model spine, project as a tree
        of buses with group effect chains and group-addressed MCP tools (7);
        audio tracks + audio clips - `Track` becomes a discriminated union of
        instrument|audio, OPFS-backed clip storage, file import +
        `AudioBufferSourceNode` playback through the bus tree (8).


        **9-14, the authored-events theme.** Sequencing followed the thesis
        directly. The authored edit log (9), clip variants (10), log persistence
        (11), piano-roll editing (12), the arrangement clip model + editable
        timeline (13), and mode-less clip launching (14). The remaining piece in
        this theme is the optional multi-track **Session grid view** + scenes on
        the same launched-clip model - now a view, not a model change.


