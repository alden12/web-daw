      - ref: AGENT-19
        area: AGENT
        title: Unify the live and offline graph build
        status: to-do
        sort_path: "000019"
        priority: 0
        body: >-
          *Part of AGENT-4. Formerly `AGENT-4.5`. Deps: AGENT-15.*


          The DSP is already shared (one set of factories drives both live and
          offline), but the wiring *around* it is duplicated in three places:


          1. **Per-track routing** - `renderProjectOffline`'s `connectChain`
          mirrors `AudioEngine.reconcile`'s `rewireChain` + `parentInput`.

          2. **The master bus + limiter** - the same magic numbers in two spots.

          3. **Note flattening** - `flattenTrackNotes` vs `Scheduler.tick`'s
          placement -> notes pass.


          **Extract the two cheap ones first:** a shared pure
          `flattenArrangement(track, range)` and a `createMasterBus(ctx)`
          helper.


          **The real work** is a graph builder parameterized by
          `BaseAudioContext` that both the live (incremental) `reconcile` and
          the offline (one-shot) render drive, so routing + limiter config
          cannot diverge - and it chips away at the oversized `AudioEngine.ts`
          (see ARCH-1's sibling concern).


          Its own focused engine slice, not folded into a feature.
        id: 019fae0b-a994-71ad-8278-6b54b31a6d1e
