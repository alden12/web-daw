      - ref: DAW-3
        area: DAW
        title: Clips, variants, launch
        status: done
        sort_path: "000003"
        priority: 0
        deps:
          - DAW-2
        body: >-
          The clip model, arrived at over three slices.


          **Clip variants (slice 10, superseded).** An instrument track owned a
          stack of variants, each bundling clip notes + instrument params +
          effect chain, so switching morphed the devices too. "Try"/fork was
          non-destructive. Slice 13 superseded the variant *stack* with a
          track-level sound + a **pool of clips** (the v6 variant format
          migrates to it: one clip per variant, sound from the active variant).
          The fearless-iteration intent survives as the clip pool +
          non-destructive editing; "Try"/fork became duplicate (drag-loop /
          copy-paste).


          **Arrangement clip model (slice 13).** A track owns a **pool of
          clips** (each its own ClipStore) and an **arrangement of placements**
          `{clipId, startBeat, offset, length}` along time; the sound
          (instrument params + effect chain) is track-level, so a clip is just
          notes. The scheduler flattens placements into events and **tiles a
          clip whose window outruns it** (drag-out loop); audio re-triggers per
          clip-length. This rippled through the command vocabulary, MCP tools,
          and persistence.


          **Mode-less clip launching (slice 14).** A persisted per-track
          `launchedClipId` loops over the transport and **overrides** that
          track's placements, so a track can loop a clip without dragging it
          across the timeline. Launch from the clip rail (auto-starts the
          transport); the lane greys with a "now playing" badge and the
          arrangement header shows a **Clip mode / Back to timeline** control.
          The scheduler treats a launched clip as one full-region placement
          (reusing the loop tiling); the state flows through the same
          dispatch/MCP seam (`launch_clip` / `stop_all_clips`), so it is
          undoable, in the feed, two-voice, and saved - no separate Session
          mode/view, just a visible override state. Same slice added clip
          copy/paste in the rail: a `pasteClip` command carries kind-tagged clip
          content through a module clipboard, so clips copy within a track and
          **across same-kind tracks** (audio reuses the source OPFS file;
          cross-type paste is refused).


          **The remaining "Session grid view + scenes" item is dropped,
          2026-07-30.** It was carried here as optional: each track a column of
          its clips, scenes launching a row across tracks. The user's decision
          was not to copy Ableton verbatim, and to reach the same expressive
          goal with a different object instead: **DAW-26 (sections)** - named,
          reusable, position-free multi-track clip fragments that appear as a
          branch of the project tree, can be launched, and can be dragged onto
          the arrangement as a unit. A section is a superset of a scene (it has
          identity, can repeat, and can span a bar range rather than a single
          instant), and it keeps the "one model, two views" property this item
          wanted: `scheduler.ts`'s launched-clip substitution generalises from
          one synthetic placement to a list. See also DAW-25 for the tree's
          clip-browsing depth, which is the separate half of the same review.


          Deps: DAW-2.
        id: 019fae02-e437-74ac-8464-f94bd7bcaf7a
        created_at: 2026-07-29T13:14:12.919Z
