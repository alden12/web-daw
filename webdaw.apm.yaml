      - ref: INST-11
        area: INST
        title: Agent-authored MIDI devices (the note path is code-only)
        status: planning
        sort_path: "000011"
        priority: 0
        deps:
          - INST-4
        body: >-
          `create_instrument` / `create_effect` (INST-4) let a user or the agent
          author a new instrument or audio effect declaratively, validated by
          `parseInstrumentDef` / `parseEffectDef` in `src/audio/graph/zod.ts`.
          **There is no equivalent for the note path**: no `create_midi_device`
          verb, and no `parseMidiDeviceDef`. The MIDI-device MCP verbs
          (`add_midi_device`, `set_midi_device_parameter`, ...) all operate on
          types that already exist in the catalog.


          **Two gaps, not one.**


          1. *No authoring surface.* Nothing parses a `MidiDeviceDef` from JSON,
          and no MCP verb exposes it.

          2. *The declarative format itself is too thin.* Of the `MidiTransform`
          kinds in `src/audio/midi/device/transform.ts`, only `tap` is genuinely
          data (a stateless per-note fan-out: pitch, velocity and beat offsets).
          The generators (`arpeggiate`, `euclid`) only *name* param ids - their
          behaviour is a strategy class reading a `TransportClock`. That is
          code, and no amount of JSON reaches it.


          **Worked example (why this is concrete).** The Euclidean sequencer
          shipped 2026-07-30 could not have been authored by the in-app agent. A
          *fixed* Euclidean pattern is expressible as a tap - E(3,8) is three
          copies at beat offsets 0, 1.5, 3.0 - but Steps and Pulses as **live
          knobs** are not, because the number of taps is structural in the data
          rather than a parameter. The agent's only move today is to bake the
          rhythm into literal notes via `add_notes`, which loses every knob, all
          automation, and any response to what is held.


          **What would close it.** A declarative *generator* kind: "walk a tempo
          grid; at each step evaluate a pure function of (stepIndex, held
          pitches, params) -> notes". `devices/stepStrategy.ts` is already
          exactly that shape after the Euclidean work - it owns the held-note
          spans, the lookahead timer and the step grid, and asks the subclass
          only "how long is a step" and "what does one step play". The missing
          piece is a safe, declarative way to express that second question (a
          small expression/rule language, or a curated palette of step-decision
          primitives, in the spirit of the curated-node-graph approach the DSP
          side already takes).


          Pairs with INST-5, whose shell contract already lists **"note/event
          in"** and transport context (tempo, beat/bar position, time signature)
          as capabilities to expose - those are precisely what a device like
          this needs and what the format lacks today.


          See also the "MIDI effects (design)" context section.
        id: 019fb3c7-2d49-7606-85ba-d12f7460aae0
        created_at: 2026-07-30T16:06:42.762Z
        updated_at: 2026-07-30T16:06:42.762Z
        notes:
          - body: 'Shipped the Euclidean MIDI device (Torso T-1 style) on branch
              `slice-96-mobile-shell`, 2026-07-30. The user then asked how much
              of it the in-app agent could have built itself - the answer was
              "essentially none", which is what surfaced this ticket. Worth
              keeping that as the motivating example: it is a clean case of a
              device that is trivially describable but not expressible in the
              current declarative MIDI format.'
            audience: user
            id: 019fb3c7-cd84-7393-8e2c-c0e0aaa7d43f
            at: 2026-07-30T16:07:23.780Z
            actor: claude
      - ref: MOBILE-1
        area: MOBILE
        title: Responsive shell, tier by device
        status: in-progress
        sort_path: "000001"
        priority: 0
        body: >-
          An epic; direction settled 2026-07-14. The four-region video-editor
          grid assumes a wide screen; touch devices need a different shape. A
          concept mockup of the phone + tablet layouts lives at
          `docs/mockups/mobile-ux.html` (self-contained, open in a browser).


          **Guiding decisions:**


          - **Swap the shell, not the app.** The stores (`projectStore`,
          `editLog`, the param schema) and the leaf components (`PianoRoll`,
          `Knob`, `LibraryPanel`, mixer, agent) are already UI-agnostic. Only
          the desktop `[grid-area:...]` shell doesn't map. So below a
          breakpoint, render a `MobileShell` that re-hosts the same panels -
          mobile is another projection of the same stores, not a fork.

          - **Tier by device, don't build one "mobile."** Phone = play / tweak /
          **agent-driven** creation (not full arrangement editing by finger);
          tablet (esp. landscape + Pencil) = a genuine editing surface
          approaching desktop. Detect with `pointer: coarse` / `pointerType`,
          not just width.

          - **Navigation:** a thumb-reachable **bottom tab bar** (reuse the
          data-driven `ActivityRail` view list: Arrange / Edit / Mix / Library /
          Agent) + a **persistent transport bar** pinned top + **slide-up
          sheets** for transient tasks (add instrument, edit a param) so you
          don't lose your place. **Long-press replaces right-click** (no hover,
          no secondary click).

          - **Agent-forward is the mobile superpower.** Precise multi-track
          touch editing is inherently painful; describing intent is not. On
          mobile the agent shifts from assistant to the **primary creation
          path** ("add a four-on-the-floor kick", "harmonize in the project
          key"), with touch for auditioning and fine-tuning. Notes-as-prompt
          (AGENT-5) is especially strong here.

          - **Platform gotchas:** iOS Safari / WKWebView has **no Web MIDI**
          (the on-screen keyboard/pads become the only input - invest there,
          velocity via touch-y/force); **AudioContext needs a user-gesture to
          unlock**; handle safe-area insets.


          **Suggested sequencing:** (1) spike - render + navigate at phone width
          (`MobileShell` + tabs + transport); (2) the Pointer Events refactor
          (MOBILE-2, no desktop behaviour change); (3) touch gesture + tool
          layer; (4) agent-forward flow + on-screen keyboard/pads; (5) PWA
          packaging (MOBILE-3).
        id: 019fae0c-8f83-7472-86e9-e1e8f5f0c6cd
        created_at: 2026-07-29T13:24:46.595Z
        updated_at: 2026-07-29T18:37:35.521Z
        notes:
          - body: "Step 1 of the sequencing (the spike) is built on `slice-96-mobile-shell`:
              `useDeviceTier` (phone/tablet/desktop from `pointer: coarse` +
              width), `DesktopShell` extracted out of `AppShell` verbatim, and a
              new `MobileShell` (pinned transport, one view, bottom tabs
              Arrange/Edit/Mix/Library/Agent). Both shells render against one
              `ShellProps` bag, so mobile really is a second projection - no
              panel was forked. Two findings worth carrying: **MOBILE-2's
              \"keystone\" Pointer Events migration is already done** (zero
              `onMouseDown` left in `src/ui`, everything goes through
              `beginPointerDrag`), and the panels' hardcoded `[grid-area:...]`
              classes turned out to be a non-issue because grid-area is inert
              outside a grid container. The one real blocker was that panel
              roots had no `flex-1` (the desktop grid row sized them), so in a
              flex column the timeline collapsed to its 38px toolbar; adding
              `flex-1` is safe because grid items ignore flex properties."
            audience: user
            id: 019faf42-e0eb-701c-a556-88826d3e39ac
            at: 2026-07-29T19:03:43.595Z
            actor: claude
          - body: "Known rough edges left for steps 2-4, deliberately not fixed in the
              spike: (1) the arrangement's track-header column is ~220px of a
              390px phone screen, leaving little lane - `headerW` is
              drag-resizable and persisted under one localStorage key shared
              with desktop, so making it tier-aware is a real decision (whose
              width wins when you switch device?) rather than a tweak; (2) large
              scroll surfaces (piano-roll grid background, arrangement lane
              background) deliberately kept default `touch-action` so a finger
              can still pan, which means drag-on-background gestures scroll
              instead of drawing - the explicit draw/select/erase tool model in
              MOBILE-2 is what resolves that properly; (3) no slide-up sheets or
              long-press menus yet."
            audience: user
            id: 019faf42-fac1-7648-adc4-7316756ce227
            at: 2026-07-29T19:03:50.209Z
            actor: claude
          - body: "Round two of the spike, from using it: track/group headers are non-sticky
              on phone (`stickyHeaders` prop, so the header column scrolls away
              with the lanes rather than costing 220 of 390px), the clip rail
              stacks above the roll instead of beside it (`compact` prop on
              CenterWorkbench, reusing ClipRail's existing
              `orientation=\"horizontal\"`), and the device rack is now clamped
              against a measured body height. That last one was a genuine bug
              reachable on desktop too: the rack has a fixed persisted height
              while the editor above it is the flexible one, so any short
              viewport (phone landscape ~390px) let the rack take everything and
              leave the piano roll zero pixels. Clamp is `min(deviceH, max(bodyH
              * 0.35, bodyH - 200))` - the MIN_EDITOR floor normally, falling
              back to a proportional share when the body cannot give both their
              minimum. **Landscape phone is still cramped** (roll ends up
              ~70px); the real fix is making the device rack a slide-up sheet on
              phone rather than a permanent band, which belongs with the sheets
              work in step 3."
            audience: user
            id: 019faf5d-caea-736d-a27b-6187ef91ceb9
            at: 2026-07-29T19:33:07.434Z
            actor: claude
          - body: "**Round-2 mobile UX agreed (2026-07-30)**, after using the round-1
              prototype. Mockup: `docs/mockups/mobile-ux-v2.html` (to be
              committed). The move: bottom tabs mirror the desktop's four
              surfaces - **Arrangement / Edit / Clips / Devices** - instead of
              phone-invented navigation, so each tab holds exactly one panel and
              the mental model transfers both ways. New keystone: a **persistent
              lane strip** (~56px) showing the selected track's own lane, on
              every tab except Arrangement, on the shared bar grid + playhead.
              Library becomes a **left sheet** off a ☰ (the six `RAIL_ITEMS` as
              a segmented control, tap-to-add: assign if the selected track is
              empty, else create one in the current group); agent becomes a
              **right sheet** off a ✦ in the top-right. Top bar reduces to ☰ / ●
              / ▶ / tempo / ⋮ / ✦, with ⋮ **context-sensitive** (the active
              surface's controls, then the project's) - that is what lets the
              piano-roll toolbar disappear. Decisions: Clips keeps its own tab
              (mode-less launching is the most touch-native surface the app
              has); the lane strip shows on Devices too; tapping a track in
              Arrangement now only **selects** (the strip keeps it on screen, so
              selection stops implying navigation). Tab 2 label stays a fixed
              **\"Edit\"** - a dynamic Roll/Pads/Sample label would need an
              `editor` field on `InstrumentInfo`, deferred rather than adding a
              hardcoded per-type label map."
            audience: user
            id: 019fb26f-bc63-756c-b864-ddeb1977efaa
            at: 2026-07-30T09:51:35.012Z
            actor: claude
          - body: "Two corrections from the round-2 design review, both worth keeping
              because they were wrong in a way that would have cost work. (1) I
              claimed the bus tree had no mobile home and proposed a new Mixer
              sheet - wrong: `GroupHeader` in the Arrangement timeline already
              carries mute/solo/volume per group, so the whole bus tree is
              reachable, and per-track mixer detail is the existing **Project**
              rail view which comes across in the library sheet for free.
              Nothing to build. The one real gap: `ProjectView` gives expandable
              detail to tracks but not groups, true on desktop too. (2) I
              claimed the tab label could be derived from the instrument catalog
              - it can't: `InstrumentInfo` is `{type, label, schema, family,
              hidden?}` with no editor notion, which is why `CenterWorkbench`
              hardcodes `kind === \"audio\"` and `instrumentType ===
              \"drumkit\"`. Adding an `editor` field would drive the label *and*
              delete that branch; worth doing eventually, out of scope for this
              slice."
            audience: user
            id: 019fb26f-d201-736b-bf57-8660469f1d8c
            at: 2026-07-30T09:51:40.545Z
            actor: claude
          - body: "**Round 2 built** (uncommitted on `slice-96-mobile-shell`, all gates
              green: 630 unit, 83 e2e). Four new seams, all reusable beyond
              mobile: (1) **CenterWorkbench split 788 -> 228 lines** into
              `workbench/{TrackEditor,InstrumentEditor,AudioClipPanel,DeviceRac\
              k,TrackRecordButton}` - it was one component holding four surfaces
              that now live in different tabs, and CLAUDE.md already flagged it
              for splitting. (2) `arrangement/gridView.ts` +
              `useSharedGridScroll` - the arrangement's view offset shared
              between the full timeline and the lane strip. Stored in **beats,
              not pixels**, because the two surfaces have different chrome
              before beat 0 (the timeline scrolls a header column inside its
              scroller; the strip's header sits outside it) so a shared pixel
              offset points at different bars in each, and beats also survive a
              zoom change. (3) `shell/surfaceControls.ts` +
              `usePublishSurfaceControls` - the active workspace publishes its
              toolbar as `MenuItem[]` for the shell's single ⋮. Publishes a
              **getter backed by a ref**, not the array, so a surface whose
              controls depend on its own state needs no dependency list and the
              registry never churns. (4) `shell/Sheet.tsx` - stays mounted once
              opened (slides out, `inert`), because unmounting the agent panel
              mid-run would abort an interruptible AGENT-10 request. `LaneStrip`
              reuses `Lane` rather than redrawing placements, so
              tap/drag/resize/split behave identically to the full arrangement."
            audience: user
            id: 019fb29a-f2ae-75ee-aad6-c693ca3746cc
            at: 2026-07-30T10:38:46.958Z
            actor: claude
          - body: "Two things found while building round 2, worth keeping. **A real UX flaw
              in `Menu`:** it dismisses on any scroll (so the portal-positioned
              popover never detaches from its trigger), but on touch a surface
              that has just mounted may still be restoring its own scroll
              offset, which closes the ⋮ the instant it opens. The e2e helper
              retries around it; the app-level fix is to ignore scroll events
              for a beat after opening, or to only close on a scroll of the
              popover's own scroll parent. Left alone because changing it
              affects desktop too. **A selector gotcha for future tests:**
              `Menu` renders checkable rows as `role=\"menuitemradio\"` (not
              `menuitem`) whenever `checked` is defined, so
              `getByRole(\"menuitem\")` silently misses Snap/Metronome-style
              toggles. Also: `MuteSolo` stretches to fill a flex *column* (its
              bordered box spans the column with the buttons adrift at one end)
              - it needs `items-start` on the parent, which bit the lane strip's
              header."
            audience: user
            id: 019fb29b-1bd3-7301-aff0-bef5fcef0653
            at: 2026-07-30T10:38:57.491Z
            actor: claude
          - body: "Three fixes from using round 2, all with regression tests. (1) **A bug I
              introduced in the shared grid view:** `writeGridScrollBeats`
              floors at 0, and the hook also *subscribed* and pushed the shared
              value back into the DOM - so scrolling left into the header gutter
              published 0, which notified the surface, which yanked `scrollLeft`
              forward to the gutter edge. The timeline visibly caught on the
              headers at the start every time. Fixed by dropping the
              subscription entirely: only one arrangement surface is ever
              mounted, so following changes bought nothing and cost that. (2)
              **A pre-existing desktop bug**, not a mobile one: the roll's
              toolbar held snap + grid + Quantize + Auto-Q + kebab + zoom in one
              no-wrap row, so with the agent panel open it overflowed below
              ~1150px and pushed the zoom cluster clean out of view - the
              most-used controls were the ones hidden. Snap/quantize/settings
              now live in one `rollControls` list with two homes (the roll's
              kebab on desktop, the shell's ⋮ on touch); the toolbar keeps label
              + menu + Quantize + zoom. (3) The **velocity lane is now
              collapsible** (`web-daw:roll-vel-open`, toggled from the same
              list) and clamped to 40% of the roll's viewport, because at ~390px
              tall the lane plus ruler was most of the available height."
            audience: user
            id: 019fb2ad-34a8-764b-9253-1371f5378eba
            at: 2026-07-30T10:58:43.496Z
            actor: claude
          - body: "Round-2 refinements (all green: 630 unit, 92 e2e). **Scroll restore,
              fully fixed** - the earlier fix only stopped the mid-scroll catch.
              Two more causes of losing your place on a tab switch: the shared
              offset floored at 0, so \"showing the header gutter\" and
              \"showing bar 1\" stored the same value and returning always
              landed at `headerW` with the headers scrolled off; and the lane
              strip *published its own restore*, which the browser had clamped
              to 0 (its content starts at beat 0, so it cannot show a gutter),
              quietly overwriting the offset the timeline needed. Now: negative
              beats are legal, and a restore never publishes (a rAF flag
              distinguishes it from user scrolling). Also found the
              arrangement's selected-track `scrollIntoView({block:\"nearest\"})`
              was nudging the view *sideways* - `inline` defaults to \"nearest\"
              too - so it fought the restore; replaced with a manual
              scrollTop-only adjustment. **Tablet panels now dock** rather than
              overlay (`docked = tier === \"tablet\" && !short`):
              `LibraryContent` is wrapper-agnostic, framed by a `Sheet` on a
              phone and a `DockedPanel` aside on a tablet. Landscape phone stays
              sheets - same tier, but only ~390px tall. **Top bar**: undo/redo
              added with real disabled states, tempo moved into ⋮ (joining meter
              and metronome). **Lane strip** lost its header column for a slim
              title row: record button (audio tracks only) left, track name
              centre, gain fader right, lane full-width below."
            audience: user
            id: 019fb2ce-2cc3-7168-be0d-503867d4c220
            at: 2026-07-30T11:34:44.163Z
            actor: claude
          - body: >-
              Round 2 (same branch, `slice-96-mobile-shell`) replaced the
              round-1 tab set after review: the bottom tabs now mirror the
              **desktop workspace areas** rather than the `ActivityRail` view
              list - Arrange / Edit / Clips / Devices - with the library moved
              to a burger sheet and the agent to a right sheet launched from the
              top bar. A mockup of the agreed design is at
              `docs/mockups/mobile-ux-v2.html`.


              Three pieces of machinery came out of it, all reusable beyond
              mobile:


              - **`LaneStrip` + a shared grid view in beats** (`gridView.ts`,
              `useSharedGridScroll`). Off the Arrange tab, the selected track's
              own lane is pinned above the workspace on the same grid, zoom,
              scroll offset and playhead, so editing a clip never loses where it
              sits in the song. The offset is stored in **beats, not pixels**,
              because the timeline scrolls a header column *inside* its scroller
              while the strip's title sits outside it, and beats also survive a
              zoom change. Negative beats are legal and mean "showing the header
              gutter" - flooring at 0 was a bug that made returning to the tab
              land at `headerW` instead of bar 1. `LaneStrip` reuses `Lane`, so
              tap/drag/resize/split behave identically with no second lane
              implementation.

              - **A surface-controls registry** (`surfaceControls.ts` /
              `usePublishSurfaceControls`). The phone top bar cannot hold a
              workspace's own toolbar, so the active workspace *publishes* its
              overflow items and the shell's ⋮ renders them. The registry holds
              a **getter backed by a ref**, not the array, so it only changes on
              mount/unmount while the shell still reads current values at
              menu-open time. Same `MenuItem[]` feeds the desktop kebab, so
              there is one list per surface, not two.

              - **`Sheet`** stays mounted once opened (slides out, `inert`)
              rather than unmounting, because unmounting `AgentPanel` mid-run
              would abort an interruptible AGENT-10 request.


              Also: `CenterWorkbench` split 788 -> 228 lines
              (`workbench/TrackEditor`, `InstrumentEditor`, `AudioClipPanel`,
              `DeviceRack`, `TrackRecordButton`), `PianoRoll` and
              `ArrangementTimeline` gained a `compact` mode, the piano roll's
              velocity lane became collapsible (landscape left it no room), and
              the tablet tier keeps library/agent **docked beside** the
              workspace instead of overlaying.


              Still open, and the reason the epic stays in-progress: **touch
              itself.** Device sliders, the piano roll and the instrument panel
              are all still mouse-shaped in practice - that is step 3 (the
              gesture/tool layer). One app-level flaw surfaced and was left
              alone because it affects desktop too: `Menu` closes on any scroll
              event, so a menu opened immediately after a tab switch can close
              as it opens.
            audience: user
            id: 019fb2ea-d44b-7774-aab3-0a225043a499
            at: 2026-07-30T12:06:02.059Z
            actor: claude
          - body: "Found 2026-07-31 while testing the touch shell on a real phone: **the app
              could not run in an insecure context at all.**
              `crypto.randomUUID()` is secure-context-only, so over plain http
              from a LAN address (`vite --host`, opened at the laptop's IP - the
              only practical way to try the shell on a device) it is
              `undefined`, the first generated id throws, `AppShell` fails to
              mount and the page is blank with nothing to say why. Auth mode
              masked it: the login gate rendered before any `ProjectStore` was
              built. Fixed by `src/audio/randomUuid.ts` (falls back to a v4
              assembled from `crypto.getRandomValues`, which has no such
              restriction) with all 19 client call sites moved onto it;
              `server/` still uses the platform one. Also relevant to MOBILE-3:
              a PWA needs HTTPS anyway, but device testing before that should
              not require it."
            audience: user
            id: 019fb920-4db8-777a-b6bb-4ed499566e10
            at: 2026-07-31T17:02:09.848Z
            actor: claude
      - ref: MOBILE-2
        area: MOBILE
        title: "Touch gestures: pinch-zoom, two-finger pan, hit-target floors"
        status: to-do
        sort_path: "000002"
        priority: 0
        deps:
          - MOBILE-1
        body: >-
          **Scope corrected 2026-07-31 after checking the code - most of what
          this ticket described as the work is already done**, and it was gating
          tickets it had no business gating. What it used to say, and the
          reality:


          - *"The keystone is migrating drag logic to the Pointer Events API."*
          **Done.** `src/ui/pointerDrag.ts` is the shared seam
          (`beginPointerDrag`), used by 11 files - `PianoRoll`, `Lane`, `Ruler`,
          `Knob`, `MixerControls`, `ResizeHandle`, `AudioClipPanel`,
          `ArrangementTimeline`, `rows`, `InlineRename`, `Menu`. There are
          **zero** `mousedown`/`mousemove` handlers left anywhere in `src`.

          - *"Heavier reliance on grid snap/quantize."* **Done.** `PianoRoll`
          has snap, grid division, quantize strength, quantize-ends and
          auto-quantize-on-record; `Lane` snaps drags and resizes.

          - *"An explicit tool model (draw / select / erase)."* **Rejected**,
          see MOBILE-7. Selection promotes one object to an editable state and
          only that object grows finger-sized handles, so a drag is never
          ambiguous and no tool palette is needed. Do not build one without
          reading MOBILE-7 first.


          **What actually remains, and it is all gesture work:**


          - **Pinch-zoom and two-finger pan.** Not merely missing - see the note
          below, the gesture currently does something actively wrong (zooms the
          whole page and breaks the layout). Three separate zoom states to write
          through.

          - **Hit-target floors** - minimum note height, resize-handle size, the
          fixed keyboard edge. MOBILE-7 sets the affordance sizes for selected
          objects; this is the floor for everything else.


          **The standing principle stays, and applies to every ticket, not just
          this one.** Build interactions so they also work by touch, because
          retrofitting hover- and right-click-only UI is expensive: prefer
          persistent ⋮ menus over hover-only kebabs; always pair a right-click
          context menu with a tap-reachable equivalent; keep hit targets
          generous (~16-18px glyphs with a ~`w-6`/`w-7` hit area). This is why
          DAW-20 specifies a touch path for each new action.


          **Nothing in the mobile editing slice depends on this any more.**
          MOBILE-5, MOBILE-6 and MOBILE-7 all build on the pointer seam that
          already exists; this ticket is now independent of them and can land
          before, after or alongside.
        id: 019fae0c-b32a-724c-bad1-b354de720785
        created_at: 2026-07-29T13:24:55.722Z
        updated_at: 2026-07-31T15:33:36.331Z
        notes:
          - body: >-
              Observed on the deployed MOBILE-1 build, 2026-07-30: **pinch on
              the arrangement timeline and the piano roll zooms the whole
              page.** The body already lists pinch-zoom as work to do, but this
              is worth recording as a distinct defect rather than a missing
              feature - the gesture currently does something actively wrong
              (scales the app's own chrome and breaks the layout) rather than
              nothing.


              **Cause.** There is no pinch or gesture handling anywhere in
              `src/ui`, and `touch-action` is only set (as Tailwind's
              `touch-none`) on *individual drag handles* - `Knob`'s three
              variants, `Lane`'s clip bodies, `PianoRoll`'s note bodies and
              velocity handles, `ResizeHandle`, `Ruler`'s loop handle,
              `MixerControls`' fader, `AudioClipPanel`'s waveform. It is never
              set on the **scroll containers**, so a two-finger gesture landing
              on the timeline or roll background is unclaimed and the browser
              takes it as a page zoom.


              **Not a viewport-meta fix.** `index.html:8` deliberately omits
              `user-scalable=no`, iOS Safari has ignored it since iOS 10 anyway,
              and suppressing page zoom globally would be wrong - it is the only
              way to read small text elsewhere in the app. The gesture has to be
              *claimed locally* instead.


              **Shape of the fix.** `touch-action: pan-x pan-y` on the scroll
              containers keeps native scrolling (which `useSharedGridScroll`
              relies on) while taking pinch away from the browser for that
              element; then a two-pointer handler owns it. This fits the
              existing seam - everything already routes through
              `beginPointerDrag` and Pointer Events give multiple pointers, so
              it is a matter of tracking two `pointerId`s and deriving scale
              from the distance ratio. No touch-event path needed.


              **Anchor on the pinch centroid, not the scroll origin,** or the
              content slides out from under the fingers. Convenient consequence
              of MOBILE-1: the shared arrangement offset is already stored in
              **beats** (`arrangement/gridView.ts`), so the invariant is
              literally "keep the beat under the centroid fixed" and the maths
              falls out of the unit choice rather than needing pixel
              bookkeeping.


              **Three separate zoom states, all persisted and clamped** - pinch
              must write through the same setters or the surfaces desync:

              - arrangement: `web-daw:arr-zoom` (`ZOOM` 6-96), read by *both*
              `ArrangementTimeline` and `LaneStrip`, so this one is shared and
              x-only today;

              - piano roll: `web-daw:roll-zoom-x` (`ZOOM_X`) and
              `web-daw:roll-zoom-y` (`ZOOM_Y`) - two axes, so the roll wants a
              genuine two-axis pinch while the arrangement wants one.


              Needs a real-device check at the end: `touch-action`'s pinch
              suppression on iOS Safari is the part most likely to misbehave
              versus the spec.
            audience: user
            id: 019fb304-6a18-739b-b61b-c2d1a71047fe
            at: 2026-07-30T12:33:58.808Z
            actor: claude
          - body: "Verified against the code 2026-07-31: `grep` finds **zero**
              `onMouseDown`/`onMouseMove`/`\"mousedown\"`/`\"mousemove\"` in
              `src`, and `src/ui/pointerDrag.ts` (`beginPointerDrag`) is used by
              11 files. The Pointer Events migration this ticket called its
              keystone shipped some time ago; snap/quantize likewise. Body and
              title rewritten to the gesture work that genuinely remains, and
              MOBILE-7's dependency on this ticket dropped as a result."
            audience: user
            id: 019fb8cf-68a4-77fe-bd07-f56d4050b659
            at: 2026-07-31T15:33:48.324Z
            actor: claude
          - body: >-
              Observed on the MOBILE-5 build, 2026-08-04: **on first load the
              platform scroll indicators appear on every overflowing scroller
              and never fade** - the roll horizontally and vertically, the track
              lanes horizontally. They behave normally (fade on their own) from
              the first manual scroll onwards.


              **Not our doing, and worth recording so it is not re-diagnosed
              from scratch.** Measured during boot at phone size:


              - each scroller reaches its final size exactly once, at ~159ms,
              and never resizes again - so we are not re-triggering the flash;

              - exactly one programmatic scroll happens in the whole load (the
              roll centring itself at ~183ms);

              - the main thread is then blocked for **123ms from ~248ms** - a
              single long task, on a laptop.


              Every overflowing scroller flashes its indicator when created or
              resized; that is the platform advertising scrollability, and it
              explains all three axes lighting up when only one was scrolled.
              The fade is scheduled ~500ms later on the main thread, and the
              long task lands inside that window. On a phone that block is
              several times longer, which fits it looking stuck on device and
              fine on desktop. The block is boot work - worklet compilation,
              project load, engine start.


              **Deliberately not fixed.** The options were: suppress indicators
              on coarse pointers (`scrollbar-width: none` + `::-webkit-scrollbar
              { display: none }`), which throws away the indicator the touch
              scrollbar rule was written to keep (see `src/index.css`, `@media
              (pointer: fine)`); cut boot main-thread work, which is worth doing
              on its own merits but is a project rather than a fix and would
              only make the fade *more likely* to land; or drop the roll's
              centring scroll, which removes one trigger of three and loses a
              feature. One flash per load that clears on first touch is the
              cheaper outcome.


              If boot cost is ever attacked for its own sake, expect this to
              improve as a side effect. It is cosmetic, not a functional defect.
            audience: user
            id: 019fcef0-99d2-7443-ac7c-58de74c4b1e4
            at: 2026-08-04T22:41:42.355Z
            actor: claude
      - ref: MOBILE-3
        area: MOBILE
        title: "PWA packaging: manifest, service worker, icons"
        status: to-do
        sort_path: "000003"
        priority: 0
        deps:
          - HOST-5
        body: >-
          *Deps: HOST-5 (offline foundation).*


          **PWA first, because it validates webview audio.** The real gating
          risk is not the shell tech but whether an **OS webview can deliver
          acceptable real-time AudioWorklet audio** on mobile - and that risk is
          shared by every webview approach (PWA, Tauri, Capacitor), since all
          three use WKWebView / Android WebView.


          So ship a **PWA first** (installable, zero native shell, free) to
          validate webview audio on real devices and get an offline-capable app
          now. It is the cheapest way to learn whether the webview can carry the
          audio before committing to a native shell (MOBILE-4).


          The service worker + manifest is item (4) of HOST-5's work list, so
          the two tickets meet here.
        id: 019fae0c-ce5c-710d-908f-6a5903ee3c26
        created_at: 2026-07-29T13:25:02.684Z
        updated_at: 2026-07-29T16:00:54.343Z
      - ref: MOBILE-4
        area: MOBILE
        title: Tauri v2, desktop and mobile
        status: planning
        sort_path: "000004"
        priority: 0
        deps:
          - MOBILE-3
        body: >-
          *Deps: MOBILE-3.*


          Once the PWA has proved webview audio, reach for **Tauri v2** for
          app-store presence + native niceties - it added first-class
          iOS/Android targets, so one Tauri project can cover desktop *and*
          mobile (a point in its favour over a native rewrite, which would
          abandon the shared web codebase).


          Tauri-mobile is younger than its desktop story and its mobile plugin
          ecosystem is thinner, so **Capacitor** is the fallback if Tauri-mobile
          plugins fall short (more proven web-to-mobile wrapper, same webview +
          audio caveats). Only reach for React Native / Flutter / native if the
          webview proves it can't carry the audio - which the PWA step
          (MOBILE-3) will tell us cheaply.


          **The desktop shell is also the home for two other things:**

          - **Native low-latency monitored tracking.** A Rust audio backend
          (CPAL, or WASAPI-exclusive / CoreAudio, even ASIO) could own
          capture/monitoring natively while the same web UI/model rides on top.
          See the "Recording and input (design)" context section - the browser
          cannot reach ASIO-class round-trip latency, and this is the escape
          hatch.

          - **The fullest in-app IDE / local-first file workflow** - a real disk
          folder and a `plugins/` drop-in directory the shell loads (see
          INST-5's distribution tiers and INST-10).


          Related open decision: web-only-with-FS-API vs Tauri desktop, and when
          to make the jump.
        id: 019fae0c-fc9e-77fe-ae9f-e17f910bf35f
        created_at: 2026-07-29T13:25:14.526Z
        updated_at: 2026-07-29T16:00:54.810Z
      - ref: MOBILE-5
        area: MOBILE
        title: "The editor sheet: throwable detents over the arrangement"
        status: review
        sort_path: "000005"
        priority: 0
        deps:
          - MOBILE-1
        body: >-
          Replaces MOBILE-1's four bottom tabs with a **non-modal bottom sheet
          over the arrangement**, thrown between three detents. The **Mobile
          editing surfaces (design)** context section carries the reasoning and
          the prototype link; this ticket is the build.


          **Detents.** Peek (parked - grabber and the Edit/Rack switch only),
          Half (edit and arrange at once), Full (covers everything but the
          selected lane). Held as *fraction of the workspace covered*, per
          device shape - a landscape phone may need its own set, or only two of
          them.


          **The gesture.**


          - Pointer Events with `setPointerCapture`; `touch-action: none` on the
          drag surface. Without that line iOS claims the gesture before the
          first event arrives.

          - Velocity from ~100ms of `(y, timestamp)` history, not a frame delta
          - far too noisy at 120Hz.

          - `landing = release + velocity * ~130ms`, snapped to the nearest
          detent. That projection is the entire feel of a throw; at 0 flicking
          stops working.

          - **Seed the settle spring with the release velocity.** A CSS
          transition discards it and restarts from rest; carrying it through is
          what reads as native. A/B'd in the prototype and the difference is
          large for about ten lines of rAF.

          - Transform while moving, commit layout once on settle - animating
          height would relayout the roll every frame. Same discipline as
          `useSharedGridScroll`.

          - Nested scrolling: a scroller inside the sheet keeps the drag unless
          it is at `scrollTop` 0 and you are pulling down. Find the scroller
          from the event target rather than assuming one; the roll has its own.


          **The whole header is the drag surface**, not just the grabber - it is
          the easiest thing on screen to catch, and a 4px pill is a cruel target
          mid-idea. Buttons inside it opt out.


          **Non-modal is load-bearing.** Tapping a track in the arrangement
          while the sheet is up must select it, with the sheet staying put. That
          is why no off-the-shelf sheet library will do (all are built on a
          modal dialog primitive), and why this must not share an implementation
          with `Sheet.tsx`, whose library and agent sheets genuinely are modal.


          **Deletions this earns:**


          - the bottom tab bar (~56px plus the safe area back on a phone); Edit
          and Rack become a segmented control in the sheet header;

          - `LaneStrip` as a special case - it existed only because the Edit tab
          took the arrangement away, and the Full detent is now what it was;

          - the top bar's tempo / meter / position readouts. They do not fit at
          390px; tempo and meter are already in the ⋮ menu, and position is on
          the timeline ruler, which is visible at every detent but Full.


          **Detent state belongs in shell state, not inside the sheet** - the
          sections read it, and that is a straight application of ARCH-3 (state
          central, composition local). On a tablet the sheet is positioned
          inside the workspace column, not the shell, so it does not run under a
          docked library or agent - the same rule already applied to the tab
          bar.


          Rewrite `MobileShell`'s header comment while here: mobile is no longer
          "the desktop split four ways" but "the desktop, occluded".


          ---


          **Also landed here: a device-testing procedure (`yarn dev:mobile`).**
          Not in the original scope, but validating this ticket on real hardware
          forced it, and it is dev-only so it does not widen the shipped
          surface.


          Testing on a phone meant `vite --host` at the laptop's LAN address,
          which is plain http and not `localhost`, so an **insecure context** -
          and four things the app needs are gated on a secure one, all failing
          silently:


          - `crypto.randomUUID` - the first id thrown on, `AppShell` never
          mounted, blank white page. Fixed with a `getRandomValues` fallback in
          `src/audio/randomUuid.ts`.

          - `AudioWorklet` - `loadWorklets` threw, so the engine never started
          and nothing played.

          - `navigator.storage` - no OPFS, so `getProjectStorage()` fell through
          to `MemoryProjectStorage` and nothing persisted.

          - `getUserMedia` - no mic recording.


          `yarn dev:mobile` serves https with a self-signed certificate
          (`@vitejs/plugin-basic-ssl`), opt-in via `MOBILE_HTTPS` so everyday
          `yarn dev` stays on plain `http://localhost` (already a secure
          context, no certificate warning) and Playwright is untouched.
          `strictPort` on, because the URL is typed into a phone by hand and a
          silent drift to the next port leaves the remembered address pointing
          at an orphaned earlier run - which answers, so it looks like your
          changes had no effect. Procedure and the `ERR_EMPTY_RESPONSE` gotcha
          are in the README.


          The failures are now legible as well as fixed: `loadWorklets` rejects
          with an explanation rather than "cannot read addModule of undefined",
          and `StartDialog` shows it instead of the button appearing dead.


          A trusted certificate (`mkcert` plus its root installed on the device)
          is still needed before service workers and PWA install can be tested -
          relevant to the packaging epic, not to this ticket.
        id: 019fb8bf-4e50-76ff-9b52-af40940356fa
        created_at: 2026-07-31T15:16:13.008Z
        updated_at: 2026-08-03T19:46:58.146Z
      - ref: MOBILE-6
        area: MOBILE
        title: Pads and clips as sections under the roll
        status: review
        sort_path: "000006"
        priority: 0
        deps:
          - MOBILE-5
        body: >-
          Two collapsible sections beneath the piano roll, in that order,
          sharing one drawer component. Not tabs, and not a separate Keys
          surface - you play a phrase and watch it land without changing
          surface.


          **A section's height is a function of its content, never a drag.**
          Adding a pad row grows it by exactly one row, and the roll gives up
          exactly that much. An earlier prototype let the roll resize as the
          keyboard appeared and it was confusing precisely because the amount
          was unpredictable.


          **Clips** are the thin horizontal chip rail. `ClipRail` already takes
          `orientation` as data, so a horizontal value is additive rather than a
          special case. Visibility is the section's disclosure and nothing else
          - an earlier version tied it to the detent as well, which means you
          collapse it and the detent reopens it.


          **Pads, not keys.** ~27px keys on a 390px phone are unplayable; pads
          give 50px+ and a legible note name.


          - In-scale notes take the full-width row; everything else sits above,
          between them. Derive the gaps from **the scale's own interval
          pattern**, so the shape holds for any key or mode with only the labels
          moving. In C major it lands exactly where the black keys are.

          - **Each row closes on the next tonic**, as a piano octave ends on C.
          Without it the leading tone has no gap to sit in and vanishes - found
          by testing the layout across six scales, not by looking at it.

          - Each pad carries its **interval to the tonic** (`1`, `2`, `b3`,
          `5`). This is the first real consumer of a project-level key and
          scale; until that exists, a local setting.

          - Accidentals switchable off, for a row you cannot play a wrong note
          in. Possibly the better default on a phone.

          - Multi-touch, so chords work, and slide-to-glissando.

          - Octave range is **one control, not two**: a pair of buttons to move
          the range and a pair to size it, sharing the label between them. Each
          pair disables at its limit.

          - **A tablet fits two octaves per row, a phone one.** Below ~44px per
          pad the layout is wrong, not merely tight.


          **Sustain by drag-down.** Press a pad, drag down past a threshold and
          it latches; drag up on it to release. **Playing a new note releases
          the held ones** - decided 2026-07-31 knowing the limitation: that rule
          means you can only hold *instead of* playing, never *while* playing,
          which is the main reason to want sustain in the first place. Ship the
          simple form, expect to revisit. The alternative (latches persist,
          release is explicit) is prototyped and is one flag away.


          ## Built 2026-08-05: the pads


          The pads shipped; the clip rail as a section did not, so Clips is
          still a segment in the sheet's switch. Everything above holds, and
          three things were decided in the building of it:


          **The octave count is a function of the room, not of the device.**
          "One octave on a phone, two on a tablet" is right about *width* and
          says nothing about height, and height is what actually runs out: a
          landscape phone has ~130px of editor at Half, a tablet in portrait has
          ~800px at Full. So `fitPads` computes the row limit from the editor's
          height at the *committed* detent - derived from the workspace and the
          detent fraction rather than measured on the sheet, because a sheet
          mid-throw is held at full height and translated, and measuring it
          would add a row during the gesture and take it back on settle (the
          trap the roll's re-centring fell into). The stored count is kept as
          *asked for*, so throwing the sheet up gives back the rows that did not
          fit at Half.


          **The pads take a share of the editor, not all but a sliver of it**
          (corrected 2026-08-05, on the report that expanding the sheet bought
          no more rows). The first version kept a flat 40px for the roll and
          capped the pads at four rows, and the two constants failed in opposite
          directions: below the cap the pads absorbed *every* pixel a taller
          sheet added, so Half and Full left the roll the same unreadable
          sliver; above it, extra height bought nothing at all. Both are gone,
          for one number. `PADS_SHARE`: the pads may take 65% of the editor and
          the roll keeps the rest, so raising the sheet grows both, and dropping
          back to Half gives rows away before it gives away notes. On a 390x844
          phone that is 1 row / 150px of roll at Half against 3 / 217 at Full,
          where it was 2 / 60 and 4 / 127. Nothing arbitrary is left to pick:
          the room says how many rows there is *space* for and `OCTAVE_RANGE`
          says how many there are *notes* for.


          Worth knowing, since it is why this arrived as "it limits the rows on
          my actual phone but not in Chrome's mobile mode": an emulated viewport
          is often taller than the device's real one (no address bar, no home
          indicator), which put Half over the four-row cap and made both detents
          look identical.


          Where nothing fits at all - landscape at Half - the section says
          "Raise the sheet to play" rather than showing a clipped half-row. At
          Full, landscape gets a row by folding the key and octave controls into
          the section's header: it is short *and* wide, so the header has the
          width; and if that is still not enough, it gives up the roll's share
          for a single row. The concessions are an ordered list and the first
          arrangement that fits a row wins, so the controls' own row always goes
          before the roll's share does - a label costs less than the thing you
          are playing along to.


          **Slide between pads, decided by an axis lock** (2026-08-05). The
          bullet above asked for slide-to-glissando and the first version
          deliberately refused it: every pad captured its pointer, so a finger
          that wandered kept sounding the note it started on. The reason it is
          not free is that the two gestures collide *by geometry* - the pad
          below a pad is another pad, so "dragged down 34px to latch" and "slid
          onto the neighbour" are the same event stream. The first 8px of travel
          therefore picks the axis and holds it for the rest of that press, the
          way a scroller does. A slide is horizontal only, which is the shape of
          a glissando anyway, and the sustain drag is four times the lock
          distance so it has room to declare itself.


          Capture is also why the slide has to hit-test for itself
          (`elementFromPoint`): the events keep arriving at the pad the finger
          started on, so the target says where the gesture *began*, never where
          the finger is. Crossing releases the note it left unless another
          finger is also on it - a two-handed glissando crosses, and the
          crossing must not silence the note the other hand is holding - and a
          finger over no pad holds its note rather than cutting out, so sliding
          through the gap above an accidental is a slide and not a lift.


          **The pads sit under every surface, not inside Edit** (2026-08-05).
          They were a child of the roll's surface, so switching to Rack or Clips
          took away the way to play. Playing while you turn a filter is as much
          the point as playing while you edit notes, and having to leave the
          rack to hear what you just changed is exactly what a section rather
          than a fourth tab was for. They render at the foot of the sheet now,
          under whichever surface is showing; `PADS_SHARE` divides the sheet
          with that surface rather than specifically with the roll.


          **A kit gets its own pads.** A drum kit has no key, so the scale
          layout would be a lie told in note names - intervals of a tonic over a
          General MIDI map where 36 is a kick. Kit tracks get a grid of their
          loaded pads instead, labelled with the sample, reusing `usePads`. This
          is what makes drums recordable on a phone, which is the most likely
          thing anyone wants to do on one.


          **The velocity lane now starts folded on touch.** 56px of lane is a
          whole row of pads, and velocity already renders as note fill strength;
          the roll's settings menu still turns it back on. Editing velocity per
          note belongs in the note's own menu (MOBILE-7).


          Notes go out through `LiveNotes` - the seam the computer keyboard and
          hardware MIDI already use - so recording came for free: arm, record,
          play the pads, and the take lands as a clip. That is the point of the
          whole ticket, and it is covered end to end in `mobile-shell.e2e.ts`.


          Fixed on the way past, because the pads' key menu is the worst case
          for it: `Menu` submenus opened level with their own row and ran off
          the bottom of a phone, so most of a twelve-row list was under the
          fold. They now measure on open, slide up to fit, scroll if taller than
          the viewport, and no longer close on a scroll that started inside the
          popover.


          Left for a follow-up: the clip rail as the second section,
          `EditorSection` gaining a second consumer (the device rack is the
          likely third), and MOBILE-11, which the pads exposed - count-in is a
          surface away from the record button it governs. What the pads should
          learn next is its own set of tickets: MOBILE-12 (chords mode),
          MOBILE-13 (light up with what the track is playing), MOBILE-14
          (velocity you can play), MOBILE-15 (drag up to bend).


          Note the drawer component is worth extracting properly - the device
          rack will likely want one too. *(Done: `ui/shell/EditorSection.tsx`.)*
        id: 019fb8bf-839d-75ab-bdf2-caf8358426c2
        created_at: 2026-07-31T15:16:26.653Z
        updated_at: 2026-08-05T16:11:39.340Z
      - ref: MOBILE-7
        area: MOBILE
        title: "Touch editing: select, then handles and a kebab"
        status: to-do
        sort_path: "000007"
        priority: 0
        deps:
          - MOBILE-5
        body: >-
          One editing model for notes in the piano roll and clips in the
          timeline. **This answers the "explicit tool model (draw / select /
          erase)" question MOBILE-2 raises** - differently, and that ticket has
          been corrected to point here.


          Touch has no hover, no modifiers, and a 44px finger, so the desktop
          roll's 4px drag-edges cannot transfer. **Selection is the substitute
          for hover:** only the selected object grows handles, so they can be
          finger-sized without turning every neighbour into a grab target.


          - Drag the body to move; drag an end handle to resize (notes) or trim
          (clips). Grid-snapped throughout - snap is doing the work precision
          cannot.

          - **Actions hang off a kebab pinned to the object's right edge**, not
          a bar pinned to the screen. It costs no permanent space, which
          landscape cannot spare, and it means the actions are ordinary
          `MenuItem`s, so `Menu.tsx` is reused rather than a bespoke toolbar
          grown. Clamp it to the visible edge - an affordance you have to scroll
          to find is one you stop reaching for.

          - **Velocity in that menu as an inline row of values, not a submenu.**
          `Menu.tsx` opens submenus on hover, which does not exist on touch, and
          a nested flyout near a screen edge is a cramped thing to aim at.
          Velocity also renders as **note fill strength**, which is what earns
          the right to drop the velocity lane on a phone.

          - **Split at the playhead**, not at a tap point. No precision needed,
          because the playhead is already positioned and already on screen. The
          touch version is the easy one, so it ships here rather than being
          deferred.

          - Duplicate and delete in the same menu.


          ## Creating: the two surfaces differ, deliberately


          Settled 2026-07-31. They differ because **a note has an obvious
          default and a clip does not**: tap a grid cell and you have stated
          pitch and position, and one beat is a fine length. A clip's length and
          position *are* its substance, so a tap states nothing useful.


          **In the roll - tap to create.** A tap on empty space means *deselect
          if something is selected, otherwise create a note there*. That
          ordering is the point: you cannot fat-finger a note into existence
          while editing one, and creation is still a single tap the rest of the
          time.


          **In the timeline - a range, then a menu.** Drag across empty lane
          space to highlight a range; a kebab appears on it offering **Create
          clip**, and **Paste** when the clipboard holds something. The range
          states the length and position that a tap could not.


          **The playhead is a valid target on its own.** Paste should be
          reachable with no selection at all, at the ticker - which is the same
          reasoning as split-at-playhead. Something already positioned and
          already on screen beats asking for precision.


          This also gives range operations a natural home later (duplicate a
          range, set the loop from it) without inventing a second mechanism.


          **Implementation note.** The roll canvas must own its gestures
          (`touch-action: none`) and scroll itself on an empty-space drag.
          Letting the browser pan means every vertical note drag races the
          scroller for the same pixels, and the browser wins those races.
          Consequently in the roll an empty-space *drag* scrolls while an
          empty-space *tap* creates or deselects, distinguished by a movement
          threshold - note this is the opposite assignment to the timeline,
          where an empty-space drag defines a range. That is a real asymmetry to
          keep straight: the roll scrolls in the axis it creates in, the
          timeline does not.


          Applies to the desktop surfaces too wherever it costs nothing -
          MOBILE-2's standing point is that touch-reachable equivalents are
          cheap to build in and expensive to retrofit.
        id: 019fb8bf-be5a-756f-9c63-7d0ac202be7f
        created_at: 2026-07-31T15:16:41.690Z
        updated_at: 2026-07-31T15:33:36.974Z
        notes:
          - body: "**Settled 2026-07-31, same day it was raised** (the note previously
              flagged it as blocking). In the roll, a tap on empty space means
              *deselect if something is selected, otherwise create a note* - the
              prototype's behaviour, kept because it prevents fat-fingering a
              note into existence mid-edit. MOBILE-2's explicit draw/select tool
              model is **not** adopted. The timeline diverges: drag an empty
              range, then a kebab offering Create clip / Paste, because a clip's
              length and position are its substance and a tap states neither.
              Both behaviours are live in the prototype:
              https://claude.ai/code/artifact/9072c7ef-cebf-4ba2-a344-689cea364\
              e22"
            audience: user
            id: 019fb8c0-66da-76ff-8744-626e64529fe1
            at: 2026-07-31T15:17:24.826Z
            actor: claude
      - ref: MOBILE-8
        area: MOBILE
        title: "Safe areas: pad all four insets, not just the bottom"
        status: to-do
        sort_path: "000008"
        priority: 0
        deps:
          - MOBILE-1
        body: >-
          A defect in the shipped MOBILE-1 build, found on a device 2026-07-31.


          `index.html:8` sets `viewport-fit=cover`, with a comment saying the
          touch shell "pads itself back with the `env(safe-area-inset-*)`
          values" - but the only `env()` in the codebase is
          `safe-area-inset-bottom`, in `MobileShell.tsx:607` and `Sheet.tsx:74`.
          We opted into going edge-to-edge and then handled one of the four
          edges.


          **Symptoms.** The top bar's ☰ and ✦ buttons sit under the display's
          corner radius and are clipped. In landscape the notch takes a column
          off the arrangement.


          **Decision: keep `cover` and pad all four sides**, rather than
          dropping `cover` and letting iOS inset the viewport for us. Landscape
          is where the app is most starved of width, and we want that width
          back; the letterboxed alternative gives it away permanently.


          **The trap that makes this worth a ticket rather than a two-line
          fix.** An absolutely positioned box resolves against its containing
          block's **padding box**, so padding on a container is ignored by
          exactly the children that need it. The insets have to go on the
          positioned boxes themselves. This looks correct in review and does
          nothing - it caught the prototype, where the workspace carried the
          padding and both its children were absolute.


          **Scope.** The top bar (top, left, right), the workspace's positioned
          children (the arrangement and the sheet), and anything else absolutely
          positioned inside the shell. The rail background should run up behind
          the status bar so the inset reads as deliberate rather than as a
          letterbox.


          **Verify on a notched device in landscape both ways up** - the notch
          swaps sides with rotation direction, and iOS reports the insets
          accordingly.


          Related: MOBILE-5 removes the top bar's readouts, which buys back
          roughly what the notch costs on the horizontal.
        id: 019fb8bf-e9cf-7295-984e-c64745fd5f32
        created_at: 2026-07-31T15:16:52.815Z
        updated_at: 2026-07-31T15:16:52.815Z
      - ref: MOBILE-9
        area: MOBILE
        title: Adding from the library should get out of the way on a phone
        status: review
        sort_path: "000009"
        priority: 0
        deps:
          - MOBILE-5
        body: >-
          Noticed on a device 2026-07-31. Tapping an instrument or device in the
          library adds it, but the library stays open over the workspace, so you
          cannot see the thing you just added. You have to dismiss the panel
          yourself before the action has any visible result.


          **Close the library after an add, but only where it is an overlay.**
          On a phone it is a `Sheet` over the app, so it hides the outcome and
          should get out of the way. On a tablet it is a docked column beside
          the workspace - it occludes nothing, and closing it there would be
          actively annoying when adding several tracks in a row. The `docked`
          flag in `MobileShell` already draws exactly that distinction.


          Worth confirming while implementing: the same argument probably
          applies to any library action with a visible result in the workspace
          (adding a track, loading a patch, dropping in a sample), not just
          instruments. Do it as one rule rather than per-action, or it will
          drift.


          There is a precedent in the other direction to keep in mind -
          `onRevealSamples` deliberately *opens* the library from the rack,
          because there the library is the destination rather than the source.
          So the rule is about where the user's attention is going, not about
          the library as such.


          ## Built 2026-08-05


          One rule, as the ticket asked. `LibraryPanel` already had a
          `pickResult` wrapper for search results (act, then clear the query);
          it turned out that "acting on a library row and then getting out of
          the way" is the same idea, so it generalised into `picked` and every
          row now goes through it - instruments, patches applied or added as a
          track, MIDI devices, effects, samples, and selecting a track from the
          results. Clearing the query stays part of it and is a no-op outside
          the results view, since a query is what puts you there.


          The panel takes an optional `onPick`, and `MobileShell` passes it only
          when the library is *not* docked - the distinction the ticket pointed
          at, spent in one line where the panel is framed rather than threaded
          through as a device flag.


          **Library management is deliberately not a pick.** Deleting a patch
          and removing a sample stay put: they change the library, not the
          track, so there is nothing behind the panel to go and look at. Same
          reasoning as `onRevealSamples` in reverse.


          Covered both ways in `mobile-shell.e2e.ts`: on a phone, picking FM
          closes the sheet and the editor behind it reads `fm`; on a tablet the
          same pick changes the track and leaves the docked column exactly where
          it was.
        id: 019fb948-6bc4-73dc-b70a-8c29daf6002f
        created_at: 2026-07-31T17:45:58.980Z
        updated_at: 2026-08-05T16:24:36.031Z
      - ref: MOBILE-10
        area: MOBILE
        title: Swipe the library and agent sheets closed
        status: to-do
        sort_path: "000010"
        priority: 0
        deps:
          - MOBILE-1
        body: >-
          Drag the library or agent sheet off its own edge to dismiss it, with
          the throw deciding whether it goes or springs back. **Closing only** -
          see the constraint below for why opening is not part of this.


          Only applies where the panels are sheets. A tablet docks them
          (`docked` in `MobileShell`) and there is nothing to swipe away.


          ## Why it is cheaper than MOBILE-5 was


          `Sheet.tsx` is `absolute top-0 bottom-0` at a fixed width, so
          **nothing inside it depends on measuring a mid-flight size**. The
          "transform while moving, commit layout on settle" split - and every
          bug that came out of code believing the travelling height - simply
          does not arise here. Transform is the only representation the sheet
          ever needs.


          It is also two states rather than three, so the projection is a
          threshold rather than a nearest-detent search, and it is modal, so
          there is no live background to keep interactive.


          ## Closing only, because the OS owns the edges


          iOS Safari and Android Chrome claim edge swipes for back/forward
          navigation, and a system gesture cannot be `preventDefault`ed.


          - **Dismissing works.** The touch starts inside the sheet, which is
          `w-[88%]`, so it never begins in the system's edge zone.

          - **Opening by edge-swipe does not**, and on the left it would fight
          the back gesture directly. The ☰ / ✦ buttons stay the only way in. Do
          not add an edge-swipe-to-open affordance without testing it on a real
          iOS device first; expect it to lose.


          ## `touch-action: pan-y`, not `none`


          The library list scrolls vertically, so claiming both axes would kill
          it. `pan-y` leaves vertical panning to the browser and hands
          horizontal to us. Same shape MOBILE-2 needs on the arrangement and
          roll scroll containers, so the two should agree on the approach.


          ## Extract the gesture primitives rather than writing a second copy


          This is the part that pays for itself. `detents.ts` is already
          DOM-free and its hard parts are axis-agnostic - `velocityFrom` fitted
          across a ~100ms window, `trimSamples`, `PROJECTION_MS` and the
          projection - with unit tests that cover the maths a swipe needs
          unchanged. `useSheetDrag` is vertical only (`clientY`, `clientHeight`)
          but the shape transfers.


          So: lift velocity, projection and the velocity-seeded spring into a
          shared primitive that the editor sheet and this both use, rather than
          duplicating. MOBILE-2's pinch handling wants the same seam, so doing
          it here means it exists by the time that lands.


          Replace the CSS `transition-transform duration-200` with that spring
          for the gesture path. A transition stays correct for a scrim tap or
          Escape, which start from rest; it is wrong after a throw, because it
          discards the speed you built. Fade the scrim **with** the drag rather
          than only at the end, or a half-dragged sheet looks detached from it.


          ## Testing


          Same split MOBILE-5 settled on: the projection maths is pure and
          unit-tested, and the browser only proves the wiring. Playwright should
          not synthesise a swipe - Escape and the scrim tap are already covered,
          so e2e needs nothing new beyond confirming the sheet still closes by
          those paths. The gesture itself wants a real-device check.


          ## Scope note


          The win is real but modest: scrim tap and Escape already dismiss, so
          this is polish that makes the shell feel native rather than a
          capability gap. Worth doing when the gesture layer gets attention -
          ideally alongside MOBILE-2, which shares the `touch-action` decision
          and the extracted primitives - not before.
        id: 019fcf0a-d942-71ef-8a6b-fd508694a8b7
        created_at: 2026-08-04T23:10:22.531Z
        updated_at: 2026-08-04T23:10:22.531Z
      - ref: MOBILE-11
        area: MOBILE
        title: Project settings are unreachable while the sheet is up
        status: review
        sort_path: "000011"
        priority: 0
        deps:
          - MOBILE-5
        body: >-
          Reported 2026-08-05, testing the pads on a phone: **count-in and
          groove are missing from the shell's ⋮** unless you first park the
          sheet.


          The cause is `isActiveSurface` doing exactly what it was built to do.
          The shell's ⋮ shows the *active surface's* controls above the
          project's, and the arrangement only owns it while the sheet is parked
          (MOBILE-5). Count-in, Groove and Groove amount live in
          `ArrangementTimeline`'s compact controls, so they leave with it - and
          the sheet now opens at Half, so the default state of the app is the
          one where they are gone.


          **They are misfiled, not mis-shown.** Count-in and groove are
          properties of the *project*, not of the arrangement surface: they read
          and write project state, they change what recording and playback do
          everywhere, and nothing about them is about the lane you are looking
          at. Tempo, meter and the metronome are already in `MobileShell`'s
          `projectItems` for precisely that reason, and count-in sitting a
          surface away from the record button it governs is the sharpest version
          of the problem.


          ## Fixed 2026-08-05, both halves


          **The reachability half went further than this ticket proposed.**
          Rather than moving these three rows so they survive the swap, the swap
          itself is gone: every mounted surface publishes to the shell's ⋮ under
          its own key and the menu shows all of them at once, under headings.
          `isActiveSurface` - a prop threaded down through `TrackEditor` and
          `InstrumentEditor` to the roll, existing only to arbitrate a single
          registry slot - is deleted. Following the front-most surface was a
          focus idea imported to a screen that has no focus: at Half you are
          looking at the timeline and the roll together, so it was hiding
          controls for a panel in plain view.


          **The misfiling half is fixed as asked**, and grouping is what forced
          it: under a heading that says "Arrangement", count-in and groove are
          visibly in the wrong place. They now build in
          `src/ui/projectSettings.ts` and are asked for by both menus that want
          them - the timeline's own kebab on desktop (still one kebab, not two)
          and the shell's project group on touch.


          Nothing else in the timeline's compact list turned out to be
          project-level; what remains is snap, zoom and add-track, which really
          are about that surface.


          Also seen and **already fixed** in the pads branch, recorded here so
          it is not re-diagnosed: submenus opened level with their own row and
          ran off the bottom of a phone, so most of a twelve-row list was under
          the fold. Every level is now portaled and placed against the viewport
          (`menuPlacement.ts`).
        id: 019fcf46-101e-7729-afa9-57e4258701ed
        created_at: 2026-08-05T00:15:03.198Z
        updated_at: 2026-08-05T15:04:11.678Z
      - ref: MOBILE-12
        area: MOBILE
        title: "Chords mode: the pads play the key, not just the notes"
        status: to-do
        sort_path: "000012"
        priority: 0
        deps:
          - MOBILE-6
        body: >-
          A toggle on the scale pads that turns each in-scale pad from a note
          into its **diatonic chord**, so a phone can lay down a progression
          with seven pads instead of asking for three fingers on 52px targets.
          In C major: I ii iii IV V vi vii°, labelled by degree exactly as the
          note pads are labelled by interval.


          This is the layout's own idea taken one step further, not a new
          surface. The pads are already "a scale, drawn from its interval
          pattern"; a chord is the same pattern read three notes at a time, so
          `scales.ts` gains a `triadAt(tonic, scale, degree)` and the geometry
          does not move at all.


          **The accidental band above becomes the variations**, which is what it
          is already shaped for: the notes you reach *for*. Per degree, the
          slots above it offer 7th / 9th / sus4 / sus2 rather than chromatic
          notes. That keeps the "everything is one flick away" feel - you play
          the triad on the beat and reach up for the colour - and it keeps the
          two modes visually the same instrument.


          Open questions worth prototyping rather than deciding on paper:


          - **Voicing.** Root position throughout makes a progression leap
          around and sound like a keyboard demo. Voice-leading each chord to the
          nearest inversion of the previous one is what makes it sound played,
          and it is a small pure function over the previous chord - but it means
          the pad's *sound* depends on what came before, which is a surprise the
          labels cannot show. Try both.

          - **Whether the variations are momentary or sticky.** Holding the 7th
          while pressing the degree is the guitarist's answer; tapping it to arm
          the next chord is the phone's. The second is easier to play
          one-handed, which is the whole reason for the mode.

          - Chords land in a clip as their notes, so nothing about recording or
          the note model changes. Whether the clip should *remember* that a
          chord was played (for later re-voicing) is a real question, and the
          answer is probably no until there is a project key (see the note in
          `padSettings.ts`).


          Most musical value of the pad follow-ups and the most self-contained:
          pure maths plus labels, no engine change, no new seam.
        id: 019fd2b0-8ab5-76bb-8196-ef22b9f84005
        created_at: 2026-08-05T16:10:13.045Z
        updated_at: 2026-08-05T16:10:13.045Z
      - ref: MOBILE-13
        area: MOBILE
        title: The pads light up with what the track is actually playing
        status: to-do
        sort_path: "000013"
        priority: 0
        deps:
          - MOBILE-6
        body: >-
          Right now a pad lights only when a finger is on it: `usePadTouch` owns
          the sounding set, so it knows about *your* notes and nothing else. A
          clip playing back, an arpeggiator running, the octavator doubling a
          note - none of it shows. Make the pads a display of the track as well
          as an input to it, and the section becomes something you can play
          *along with*, and learn a part from.


          **Tap the end of the chain, not the start.** The seam is `NoteTarget`
          (`midi/device/GraphMidiDevice.ts`): the engine hands out the head of
          the track's MIDI device chain, and a monitor placed at the *end* of it
          sees what the instrument actually receives - the arpeggiator's notes
          rather than the one that triggered them, the octavator's doubling
          rather than the single note played. That is the version worth showing;
          tapping the head would just be an echo of the finger already lighting
          the pad.


          - The pads then take two sources for "sounding" - the local presses
          and the observed stream - and it is a union, not a replacement. Keep
          them distinguishable in the rendering (a finger's note is a press, the
          track's is an indication).

          - **Rate.** A 16th-note arp at 140bpm is ~9 events/sec and a chord
          multiplies it. Accumulate into a ref and publish on a rAF, the same
          discipline `useSheetDrag` uses; a `setState` per note-on would
          re-render the sheet at the arp's rate.

          - Notes outside the shown octaves have nowhere to light. Say so
          quietly (an edge marker on the row) rather than silently dropping them
          - "why is nothing lighting" is otherwise a bug report.

          - Kit pads get it for free and it may matter more there: a drum
          pattern playing back across the pads is legible in a way a piano roll
          of a kit is not.


          Useful beyond mobile: the same monitor is what a desktop keyboard
          display or a MIDI-activity indicator would want, so put it in
          `audio/`, not in `ui/pads/`.
        id: 019fd2b0-c5e5-7639-ac7d-216a77f8a4b4
        created_at: 2026-08-05T16:10:28.197Z
        updated_at: 2026-08-05T16:10:28.197Z
      - ref: MOBILE-14
        area: MOBILE
        title: Velocity you can play, not just edit
        status: to-do
        sort_path: "000014"
        priority: 0
        deps:
          - MOBILE-6
        body: >-
          `PAD_VELOCITY` is one honest constant (0.85) because a touchscreen has
          no force to read - `PointerEvent.pressure` is 0 or a flat 0.5 on every
          device tried. That makes everything played on a phone perfectly even,
          which is fine for laying down a part and wrong for playing one.


          **A velocity control a second finger can hold**, beside the pads, read
          at note-on. The pads are already multi-touch, so a thumb on the
          control while the fingers play needs no new gesture machinery - it
          needs the value to live in a ref that `noteOn` reads, not in state, so
          moving it never re-renders the pads mid-phrase.


          - It sets the velocity of the *next* note, not the sounding ones.
          Changing a note's velocity after note-on is aftertouch, which is a
          different feature and a different message; do not quietly conflate
          them.

          - **A vertical strip down the side of the pads** is the shape that
          lets a thumb ride it, and it costs width rather than the height the
          pads are always short of. A slider in the controls row is cheaper but
          is a reach away from where the playing hand is.

          - Worth trying before building the strip: **velocity from where on the
          pad you press**, MPC-style. It is free in interaction terms, but the
          pads are 52px tall and the vertical axis already carries the sustain
          drag and (per MOBILE-14) the bend, so the axis is crowded. Probably
          the reason the strip wins.

          - Whichever wins, the recorded take gets real velocities and the
          roll's velocity lane finally has something to show that was not typed
          in.


          Small in code, and the smallest of the pad follow-ups; the design
          question (where a thumb can actually reach while playing) is the whole
          of it.
        id: 019fd2b0-f5fc-7774-9b45-e266f372e3c7
        created_at: 2026-08-05T16:10:40.508Z
        updated_at: 2026-08-05T16:10:40.508Z
      - ref: MOBILE-15
        area: MOBILE
        title: Drag up to bend, like pushing a string
        status: to-do
        sort_path: "000015"
        priority: 0
        deps:
          - MOBILE-6
        body: >-
          The pads' vertical axis already means something downward (drag down
          past 34px and the note latches) and nothing upward, and the axis lock
          added with slide gives a clean place to put it: **down latches, up
          bends**, the same finger, decided by direction. Pushing a note up like
          a string is the one expressive gesture a touchscreen is genuinely
          *good* at, and the pads currently have none.


          **The blocker is that instruments cannot bend.** `Instrument` is
          `noteOn` / `noteOff` / `playNote` / `allNotesOff`, and there is no
          pitch on a sounding voice to move. The shape of the fix is small and
          general:


          - `Instrument.pitchBend(semitones, when?)`, implemented once in
          `BaseInstrument` by ramping every live voice's sources' `detune`.
          Oscillators and `AudioBufferSourceNode` both have `detune`, so the
          synths and the sampler are all covered by the base and no instrument
          needs its own version.

          - Per-track and monophonic-in-spirit (bend moves everything sounding
          on that track), as MIDI channel bend is. Per-voice bend is MPE and is
          a much larger design.

          - Range is a setting with a sane default of 2 semitones, because that
          is what a guitar bend and every synth's default agree on.


          **It is live-only expression to start with, and that has to be said
          out loud**: the note model has no bend, so a bent note records as its
          unbent self. Making it record means a per-note or per-clip automation
          lane, which is a real feature (and overlaps whatever automation lands
          generally) rather than a follow-on to this. Ship the feel first; do
          not let the recording question hold the gesture hostage, and do not
          pretend the take captured it.


          Largest of the pad follow-ups, and the only one that reaches into the
          audio engine.
        id: 019fd2b1-2f06-77d4-9f51-26a706a0a533
        created_at: 2026-08-05T16:10:55.110Z
        updated_at: 2026-08-05T16:10:55.110Z
      - ref: MOBILE-16
        area: MOBILE
        title: Pinned headers are a question about room, not about tier
        status: review
        sort_path: "000016"
        priority: 0
        deps:
          - MOBILE-1
        body: >-
          Reported on a tablet 2026-08-11: the arrangement's track headers stay
          pinned there and should scroll away with the lanes as they do on a
          phone, because a tablet does not give the arrangement the whole screen
          the way a desktop does.


          The cause was `stickyHeaders={!isPhone}` in `MobileShell` - a decision
          about **room** made from **device**. It was right about a phone and
          wrong about a tablet, which opens with the library docked beside the
          workspace: 1024px less a 288px column leaves the timeline ~736px, and
          a 220px pinned header column there is not a header beside an
          arrangement, it is a header with a sliver next to it. Docking the
          agent as well leaves 400px, which is narrower than a phone in
          landscape - the shape the flag was confident it had room for.


          **The same lesson as the pads' `fitPads`**, one screen over: tier by
          what is on screen, not by what the screen is. `pinHeaders(viewportW,
          headerW)` in `arrangement/shared.ts` pins only while the lane keeps
          `MIN_PINNED_LANE_W` (560px), read from the timeline's own measured
          width - so docking a panel changes the answer and undocking changes it
          back, and dragging the header column wider is also a way to lose the
          pin.


          - The prop is **gone**, not re-tiered. There was one caller passing it
          and a default of `true` everywhere else; deriving it means the desktop
          gets the same rule and satisfies it by having the width, so nothing
          has to be told what it is.

          - **Pixels, not beats.** A threshold in bars would make the headers
          pin and unpin as you zoom.

          - **Unmeasured counts as wide.** `viewportW` starts at 0 before the
          ResizeObserver reports, and starting scrolled would show the headers
          sliding into place on every mount.


          Covered by `test/pinHeaders.test.ts` for the shapes (desktop, tablet
          docked and bare, phone both ways, the column dragged to its maximum,
          the threshold itself) and `e2e/header-pinning.e2e.ts` for the part
          that needs a browser: that the width it reads is the *timeline's*, so
          docking a panel beside the arrangement flips it and undocking flips it
          back.
